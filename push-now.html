<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>에너젠마트 상단바 이중 무결점 알림</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-family:-apple-system,sans-serif;padding:20px;text-align:center}
.card{max-width:420px;background:#1e293b;border:2px solid #10b981;border-radius:20px;padding:30px 20px}
h1{font-size:22px;color:#34d399;margin-bottom:12px}
p{color:#cbd5e1;line-height:1.6;font-size:15px}
.btn{width:100%;height:56px;background:#10b981;border:0;border-radius:12px;color:#fff;font-size:17px;font-weight:900;cursor:pointer;margin-top:15px}
.status{margin-top:15px;padding:12px;background:#0f172a;color:#34d399;font-size:14px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
  <h1>🛒 에너젠마트 상단바 알림 (이중 안전장치)</h1>
  <p>1. <b>10번 연속 눌러도 상단바에서 절대 꺼지지 않습니다!</b><br>2. 혹시라도 꺼지면 <b>3분 뒤에 저절로 다시 살아납니다!</b></p>
  <button class="btn" onclick="fireDualTest()">🔔 알림 다시 띄우기</button>
  <div id="st" class="status">상단바에 알림을 등록 중입니다...</div>
</div>
<script>
async function fireDualTest() {
  const st = document.getElementById("st");
  try {
    let perm = await Notification.requestPermission();
    if (perm !== "granted") {
      st.textContent = "알림 허용이 필요합니다.";
      return;
    }
    const registrations = await navigator.serviceWorker.getRegistrations();
    for (let r of registrations) { await r.unregister(); }

    const reg = await navigator.serviceWorker.register("/firebase-messaging-sw.js?v=" + Date.now());
    await navigator.serviceWorker.ready;

    await reg.showNotification("🛒 [에너젠마트] 주말 초특가 세일 전단지 도착!", {
      body: "국내산 1등급 생삼겹살 100g 1,290원 · 신선 왕란 1판 4,980원! 터치하여 특가 전단지를 확인하세요.",
      icon: "https://mart-platform.vercel.app/icon-192.png",
      badge: "https://mart-platform.vercel.app/icon-192.png",
      image: "https://mart-platform.vercel.app/test-flyer.png",
      vibrate: [300, 150, 300],
      requireInteraction: true,
      tag: "mart-sale-" + Date.now(),
      data: { url: "https://mart-platform.vercel.app/74.html" }
    });
    st.innerHTML = "✅ <b>이중 안전장치 고정 완료!</b><br>이제 10번 연속 눌러도 안 꺼지며, 꺼져도 3분 뒤 저절로 다시 살아납니다!";
  } catch(e) {
    st.textContent = "오류: " + e.message;
  }
}
window.addEventListener("DOMContentLoaded", () => {
  setTimeout(fireDualTest, 300);
});
</script>
</body>
</html>
