<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>자동차 안심주차 QR</title>
<link rel="preconnect" href="https://dcysjuxyjqtvkihdsjvv.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://dcysjuxyjqtvkihdsjvv.supabase.co">
<link rel="prefetch" href="/72-android.html">
<link rel="prefetch" href="/72-iphone.html">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7fb;color:#111827}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{display:none;width:100%;max-width:420px;background:#fff;border-radius:18px;padding:28px 22px;text-align:center;box-shadow:0 10px 35px rgba(15,23,42,.1)}.card.active{display:block}
h1{margin:0 0 14px;font-size:24px}p{color:#64748b;line-height:1.7}
button{width:100%;min-height:54px;border:0;border-radius:11px;background:#16a34a;color:white;font-size:17px;font-weight:800;margin-top:10px;cursor:pointer}
button:disabled{background:#cbd5e1;color:#64748b;cursor:not-allowed}.emergency{background:#dc2626}.status{margin-top:14px;font-weight:700;line-height:1.6}.error{color:#dc2626}.success{color:#15803d}.countdown{margin-top:14px;color:#1d4ed8;font-weight:800}
.owner-link-box{margin-top:22px;padding-top:14px;border-top:1px dashed #cbd5e1;font-size:13px;color:#64748b}
.owner-link-box a{color:#16a34a;font-weight:700;text-decoration:underline;margin-left:4px}
</style>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<section id="loading" class="card active"><h1>자동차 QR 확인 중</h1><p>잠시만 기다려 주세요.</p></section>

<!-- [차주 전용 알림 수신 화면]: 알림을 터치해 들어온 차주에게 표시 -->
<section id="ownerNotice" class="card">
  <div style="font-size:48px;margin-bottom:10px;">🚗</div>
  <h1 style="color:#0f172a;font-size:22px;margin-bottom:8px;">차량 이동 요청 도착</h1>
  <p style="font-size:15px;color:#334155;line-height:1.7;margin-bottom:20px;">
    고객님의 주차 차량에<br>
    <strong style="color:#1e40af;">차량 이동 요청</strong>이 도착했습니다.<br>
    다른 차량의 출차를 위해<br>
    이동 주차를 부탁드립니다.
  </p>
  <button id="ownerAckBtn" type="button" style="background:#16a34a;padding:16px;font-size:17px;font-weight:900;">
    🏃 지금 차 빼러 갑니다 (확인 완료)
  </button>
  <div id="ownerAckStatus" class="status success" style="display:none;margin-top:14px;font-size:15px;">
    ✅ 호출자에게 차 빼러 이동 중임을 즉시 전달했습니다.
  </div>
</section>

<!-- [호출자 전용 화면]: 차 앞유리 QR을 찍은 사람이 차주를 호출하는 화면 -->
<section id="request" class="card">
<h1>차량이동 요청</h1>
<p>차주에게 차량이동 요청을 전달합니다.</p>
<button id="moveBtn">차량이동요청</button>
<div id="countdown" class="countdown"></div>
<button id="emergencyBtn" class="emergency" disabled>긴급통화</button>
<div id="status" class="status"></div>

<div class="owner-link-box">
  차주 본인이신가요? 
  <a id="reregisterLink" href="#">전화번호 / 알림 재등록하기</a>
</div>
</section>

<!-- [기본 안내 화면]: 올바른 주소 아닐 때도 친절한 안내 표시 -->
<section id="error" class="card">
  <div style="font-size:42px;margin-bottom:10px;">🚗</div>
  <h1>우리아파트 안심주차</h1>
  <p id="errorText">차량에 부착된 QR 코드를 스마트폰 카메라로 스캔해 주세요.</p>
</section>

<script>
"use strict";
const API_URL='https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/send-vehicle-push';
const SUPABASE_KEY='sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2';
const params=new URLSearchParams(location.search);
let qr=String(params.get("qr")||"").trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"");
const view=String(params.get("view")||"").trim().toLowerCase();

// QR 번호가 파라미터에 있으면 브라우저에 영구 저장, 없으면 기존 저장값 자동 복원
if(qr){
  localStorage.setItem("wooriapt_my_qr", qr);
} else {
  qr = localStorage.getItem("wooriapt_my_qr") || "";
}

const loading=document.getElementById("loading");
const ownerNotice=document.getElementById("ownerNotice");
const request=document.getElementById("request");
const errorCard=document.getElementById("error");
const ownerAckBtn=document.getElementById("ownerAckBtn");
const ownerAckStatus=document.getElementById("ownerAckStatus");

const moveBtn=document.getElementById("moveBtn");
const emergencyBtn=document.getElementById("emergencyBtn");
const countdown=document.getElementById("countdown");
const status=document.getElementById("status");
const errorText=document.getElementById("errorText");
const reregisterLink=document.getElementById("reregisterLink");
let timer=null;

function show(el){
  [loading, ownerNotice, request, errorCard].forEach(x=>{ if(x) x.classList.remove("active"); });
  if(el) el.classList.add("active");
}

function callerSession(){
  let id=sessionStorage.getItem("wooriapt_vehicle_caller_session");
  if(!id){
    id="caller_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);
    sessionStorage.setItem("wooriapt_vehicle_caller_session",id);
  }
  return id;
}

async function api(payload){
  const r=await fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:"Bearer "+SUPABASE_KEY,
      apikey:SUPABASE_KEY
    },
    body:JSON.stringify(payload)
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.ok===false||d.success===false){
    const e=new Error(d.message||"서버 처리에 실패했습니다.");
    e.data=d;
    throw e;
  }
  return d;
}

function getRegUrl(){
  const ua=navigator.userAgent||"";
  const ios=/iphone|ipad|ipod/i.test(ua);
  const target=ios?"/72-iphone.html":"/72-android.html";
  const store=String(params.get("store")||"").trim();
  return target+"?qr="+encodeURIComponent(qr)+(store ? "&store="+encodeURIComponent(store) : "");
}

function routeRegistration(){
  location.replace(getRegUrl());
}

function applyState(d){
  const count=Number(d.request_count||0);
  emergencyBtn.disabled=d.emergency_enabled!==true;
  if(d.next_allowed_at){
    const target=new Date(d.next_allowed_at).getTime();
    if(target>Date.now()){
      startCountdown(target);
      return;
    }
  }
  countdown.textContent="";
  moveBtn.disabled=count>=3;
  moveBtn.textContent=count>=3?"차량이동요청 3회 완료":"차량이동요청";
}

function startCountdown(target){
  if(timer)clearInterval(timer);
  const tick=()=>{
    const remain=target-Date.now();
    if(remain<=0){
      clearInterval(timer);
      timer=null;
      countdown.textContent="";
      refresh();
      return;
    }
    const sec=Math.ceil(remain/1000),m=Math.floor(sec/60),s=String(sec%60).padStart(2,"0");
    countdown.textContent="다음 요청까지 "+m+":"+s;
    moveBtn.disabled=true;
  };
  tick();
  timer=setInterval(tick,1000);
}

async function refresh(){
  try{
    const d=await api({action:"status",qr_code:qr,caller_session_id:callerSession()});
    applyState(d);
  }catch(e){}
}

// [차주 확인 버튼 클릭 시]
if(ownerAckBtn){
  ownerAckBtn.onclick=function(){
    ownerAckBtn.disabled=true;
    ownerAckBtn.style.background="#059669";
    ownerAckBtn.textContent="✅ 차 빼러 이동 중입니다";
    if(ownerAckStatus) ownerAckStatus.style.display="block";
    if(qr){
      api({action:"ack",qr_code:qr}).catch(()=>{});
    }
  };
}

async function start(){
  // 1. 차주가 푸시 알림을 터치해서 들어온 경우 -> 즉시 [차량 이동 요청 도착] 화면 표시!
  if(view === "owner"){
    show(ownerNotice);
    return;
  }

  // 2. QR 번호가 전혀 없는 경우
  if(!qr){
    errorText.textContent="차량에 부착된 45x60mm 안심주차 QR 코드를 카메라로 스캔해 주세요.";
    show(errorCard);
    return;
  }

  if(reregisterLink) reregisterLink.href = getRegUrl();

  try{
    const d=await api({action:"status",qr_code:qr,caller_session_id:callerSession()});
    if(d.registered===true){
      applyState(d);
      show(request);
      return;
    }
    routeRegistration();
  }catch(e){
    routeRegistration();
  }
}

moveBtn.onclick=async()=>{
  moveBtn.disabled=true;
  status.textContent="차량이동요청을 처리하고 있습니다.";
  status.className="status";
  try{
    const d=await api({action:"request",qr_code:qr,caller_session_id:callerSession()});
    status.textContent=d.message||"차량이동요청이 접수되었습니다.";
    status.className="status success";
    applyState(d);
  }catch(e){
    let emsg=e.message||"차량이동요청 처리 중 오류가 발생했습니다.";
    if(/token|device|unregistered|fcm|valid/i.test(emsg)){
      emsg="차주 알림 전송이 지연되고 있습니다. 즉시 아래 [긴급통화] 버튼으로 직접 통화하실 수 있습니다.";
      emergencyBtn.disabled=false;
    }
    status.textContent=emsg;
    status.className="status error";
    if(e.data)applyState(e.data);
    else moveBtn.disabled=false;
  }
};

emergencyBtn.onclick=async()=>{
  emergencyBtn.disabled=true;
  try{
    const d=await api({action:"emergency",qr_code:qr,caller_session_id:callerSession()});
    const pNum = d.owner_phone || d.phone; if(pNum) location.href="tel:"+String(pNum).replace(/[^0-9]/g,"");
    else status.textContent=d.message||"긴급통화가 활성화되었습니다.";
  }catch(e){
    status.textContent=e.message;
    status.className="status error";
    emergencyBtn.disabled=false;
  }
};

start();
</script>
</body>
</html>
