<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#15803d">

  <title>본사 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 22px 14px 40px;
      background: #f4f7f5;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      padding: 24px 22px;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        #166534,
        #15803d
      );
      color: #fff;
      box-shadow:
        0 12px 30px
        rgba(21, 128, 61, 0.2);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.35;
    }

    .header p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 14px;
      line-height: 1.6;
    }

    .admin-id {
      flex-shrink: 0;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 13px;
      font-weight: 700;
    }

    .status-box {
      margin-top: 14px;
      padding: 13px 15px;
      border: 1px solid #d8e8dc;
      border-radius: 12px;
      background: #fff;
      color: #375343;
      font-size: 14px;
      line-height: 1.55;
    }

    .menu-title {
      margin: 24px 2px 12px;
      color: #26362c;
      font-size: 17px;
      font-weight: 800;
    }

    .menu-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .menu-card {
      min-height: 150px;
      padding: 20px 17px;
      border: 1px solid #e0e7e2;
      border-radius: 16px;
      background: #fff;
      color: #111827;
      text-decoration: none;
      box-shadow:
        0 6px 20px
        rgba(15, 23, 42, 0.06);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .menu-card:active {
      transform: scale(0.98);
    }

    .menu-card:hover {
      box-shadow:
        0 10px 26px
        rgba(15, 23, 42, 0.1);
    }

    .menu-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      margin-bottom: 16px;
      border-radius: 13px;
      background: #edf7f0;
      font-size: 23px;
    }

    .menu-card strong {
      display: block;
      color: #1f2937;
      font-size: 17px;
      line-height: 1.35;
    }

    .menu-card span {
      display: block;
      margin-top: 7px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.55;
    }

    .menu-card.disabled {
      opacity: 0.65;
      cursor: default;
    }

    .ready {
      display: inline-block;
      width: auto !important;
      margin-top: 10px !important;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b !important;
      font-size: 11px !important;
      font-weight: 700;
    }

    .logout-button {
      width: 100%;
      min-height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      background: #374151;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .logout-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 11px;
      font-size: 14px;
      line-height: 1.55;
    }

    .message.error {
      display: block;
      border: 1px solid #efb8b8;
      background: #fff0f0;
      color: #a02020;
    }

    .message.waiting {
      display: block;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }

    #loadingScreen {
      display: flex;
      min-height: 65vh;
      align-items: center;
      justify-content: center;
    }

    .loading-card {
      width: 100%;
      padding: 28px 22px;
      border: 1px solid #e1e8e3;
      border-radius: 16px;
      background: #fff;
      text-align: center;
      box-shadow:
        0 8px 24px
        rgba(15, 23, 42, 0.07);
    }

    .loading-card strong {
      display: block;
      color: #1f2937;
      font-size: 18px;
    }

    .loading-card span {
      display: block;
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
    }

    #dashboard {
      display: none;
    }

    @media (max-width: 470px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }

      .menu-card {
        min-height: auto;
      }

      .header-top {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <section id="loadingScreen">
      <div class="loading-card">
        <strong>본사 관리자 확인 중</strong>
        <span>
          로그인 정보를 확인하고 있습니다.
        </span>
      </div>
    </section>


    <section id="dashboard">

      <header class="header">
        <div class="header-top">
          <div>
            <h1>본사 관리자</h1>

            <p>
              플랫폼의 주요 운영 기능을 관리합니다.
            </p>
          </div>

          <div
            id="adminIdLabel"
            class="admin-id"
          >
            admin
          </div>
        </div>
      </header>


      <div class="menu-title">
        운영 현황
      </div>

      <div class="status-box">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

          <div style="background:#fff;border:1px solid #d9e7dd;border-radius:12px;padding:14px;text-align:center">
            <div style="font-size:13px;color:#64748b">등록 매장</div>
            <div id="storeCount" style="font-size:28px;font-weight:700;color:#166534">-</div>
          </div>

          <div style="background:#fff;border:1px solid #d9e7dd;border-radius:12px;padding:14px;text-align:center">
            <div style="font-size:13px;color:#64748b">운영 중 매장</div>
            <div id="activeStoreCount" style="font-size:28px;font-weight:700;color:#166534">-</div>
          </div>

          <div style="background:#fff;border:1px solid #d9e7dd;border-radius:12px;padding:14px;text-align:center">
            <div style="font-size:13px;color:#64748b">메인 배너</div>
            <div id="bannerCount" style="font-size:28px;font-weight:700;color:#166534">-</div>
          </div>

          <div style="background:#fff;border:1px solid #d9e7dd;border-radius:12px;padding:14px;text-align:center">
            <div style="font-size:13px;color:#64748b">쿠폰 발행</div>
            <div id="couponCount" style="font-size:28px;font-weight:700;color:#166534">-</div>
          </div>

        </div>
      </div>


      <div class="menu-title">
        관리 메뉴
      </div>


      <div class="menu-grid">

        <a
          class="menu-card"
          href="/hq-password.html"
        >
          <div class="menu-icon">
            🔐
          </div>

          <strong>
            계정관리
          </strong>

          <span>
            본사 관리자 비밀번호를 변경합니다.
          </span>
        </a>


        <a
          class="menu-card"
          href="/main-banner.html"
        >
          <div class="menu-icon">
            🖼️
          </div>

          <strong>
            메인 배너관리
          </strong>

          <span>
            매장을 선택하고 배너 2개를 관리합니다.
          </span>
        </a>


        <a
          class="menu-card"
          href="/hq-store-inquiry.html"
        >
          <div class="menu-icon">
            💬
          </div>

          <strong>
            가맹점 문의
          </strong>

          <span>
            가맹점 문의와 본사 답변을 관리합니다.
          </span>
        </a>


        <div
          class="menu-card disabled"
          onclick="showPreparing('결제·계좌관리')"
        >
          <div class="menu-icon">
            💳
          </div>

          <strong>
            결제·계좌관리
          </strong>

          <span>
            입금계좌와 결제 정보를 관리합니다.
          </span>

          <span class="ready">
            준비 중
          </span>
        </div>


        <div
          class="menu-card disabled"
          onclick="showPreparing('쿠폰관리')"
        >
          <div class="menu-icon">
            🎟️
          </div>

          <strong>
            쿠폰관리
          </strong>

          <span>
            쿠폰 발행과 사용 상태를 관리합니다.
          </span>

          <span class="ready">
            준비 중
          </span>
        </div>

      </div>


      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        로그아웃
      </button>


      <div
        id="messageBox"
        class="message"
        aria-live="polite"
      ></div>

    </section>

  </main>


  <script>
    (function () {
      "use strict";

      const FUNCTION_URL =
        "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-admin-account";

      const STATS_FUNCTION_URL =
        "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-dashboard-stats";

      const SESSION_KEY =
        "wooriapt_hq_admin_session";

      const ADMIN_ID_KEY =
        "wooriapt_hq_admin_id";

      const LOGIN_PAGE =
        "/hq-account.html";

      const loadingScreen =
        document.getElementById(
          "loadingScreen"
        );

      const dashboard =
        document.getElementById(
          "dashboard"
        );

      const adminIdLabel =
        document.getElementById(
          "adminIdLabel"
        );

      const logoutButton =
        document.getElementById(
          "logoutButton"
        );

      const messageBox =
        document.getElementById(
          "messageBox"
        );


      function showMessage(
        text,
        type
      ) {
        messageBox.textContent =
          text || "";

        messageBox.className =
          "message" +
          (
            type
              ? " " + type
              : ""
          );
      }


      function clearSession() {
        localStorage.removeItem(
          SESSION_KEY
        );

        localStorage.removeItem(
          ADMIN_ID_KEY
        );
      }


      async function callApi(
        action,
        payload
      ) {
        const response =
          await fetch(
            FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  Object.assign(
                    {
                      action: action
                    },
                    payload || {}
                  )
                )
            }
          );

        const text =
          await response.text();

        let data = {};

        try {
          data =
            text
              ? JSON.parse(text)
              : {};
        } catch (error) {
          data = {};
        }

        if (
          !response.ok ||
          data.ok === false
        ) {
          throw new Error(
            data.message ||
            data.error ||
            "처리에 실패했습니다."
          );
        }

        return data;
      }


      async function loadDashboardStats() {
        const storeCount =
          document.getElementById("storeCount");

        const activeStoreCount =
          document.getElementById("activeStoreCount");

        const bannerCount =
          document.getElementById("bannerCount");

        const couponCount =
          document.getElementById("couponCount");

        try {
          const response =
            await fetch(
              STATS_FUNCTION_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({})
              }
            );

          const text =
            await response.text();

          let data = {};

          try {
            data =
              text
                ? JSON.parse(text)
                : {};
          } catch (error) {
            data = {};
          }

          if (
            !response.ok ||
            data.ok === false
          ) {
            throw new Error(
              data.message ||
              data.error ||
              "운영 현황을 불러오지 못했습니다."
            );
          }

          storeCount.textContent =
            Number(
              data.store_count || 0
            ).toLocaleString("ko-KR");

          activeStoreCount.textContent =
            Number(
              data.active_store_count || 0
            ).toLocaleString("ko-KR");

          bannerCount.textContent =
            Number(
              data.banner_count || 0
            ).toLocaleString("ko-KR");

          couponCount.textContent =
            Number(
              data.coupon_count || 0
            ).toLocaleString("ko-KR");

        } catch (error) {
          console.error(
            "운영 현황 불러오기 실패:",
            error
          );

          storeCount.textContent = "-";
          activeStoreCount.textContent = "-";
          bannerCount.textContent = "-";
          couponCount.textContent = "-";
        }
      }


      async function checkLogin() {
        const token =
          localStorage.getItem(
            SESSION_KEY
          ) || "";

        if (!token) {
          location.replace(
            LOGIN_PAGE
          );

          return;
        }

        try {
          const data =
            await callApi(
              "validate_session",
              {
                session_token:
                  token
              }
            );

          const adminId =
            data.admin_id ||
            localStorage.getItem(
              ADMIN_ID_KEY
            ) ||
            "admin";

          localStorage.setItem(
            ADMIN_ID_KEY,
            adminId
          );

          adminIdLabel.textContent =
            adminId;

          loadingScreen.style.display =
            "none";

          dashboard.style.display =
            "block";

          await loadDashboardStats();

        } catch (error) {
          clearSession();

          location.replace(
            LOGIN_PAGE
          );
        }
      }


      window.showPreparing =
        function (menuName) {
          alert(
            menuName +
            " 기능은 다음 단계에서 연결합니다."
          );
        };


      logoutButton.addEventListener(
        "click",
        async function () {
          const token =
            localStorage.getItem(
              SESSION_KEY
            ) || "";

          try {
            logoutButton.disabled =
              true;

            showMessage(
              "로그아웃하고 있습니다.",
              "waiting"
            );

            if (token) {
              await callApi(
                "logout",
                {
                  session_token:
                    token
                }
              );
            }

          } catch (error) {
            console.warn(error);

          } finally {
            clearSession();

            location.replace(
              LOGIN_PAGE
            );
          }
        }
      );


      checkLogin();
    })();
  </script>

</body>
</html>
