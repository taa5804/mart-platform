<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15803d">
  <title>본사 계정관리</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{
      min-height:100vh;padding:20px 14px 40px;background:#f4f7f5;color:#111827;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
    }
    .wrap{width:100%;max-width:720px;margin:0 auto}
    .header{
      padding:22px 20px;border-radius:18px;background:linear-gradient(135deg,#166534,#15803d);
      color:#fff;box-shadow:0 12px 30px rgba(21,128,61,.2)
    }
    .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    h1{margin:0;font-size:25px}
    .header p{margin:8px 0 0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.6}
    .back-link{
      flex-shrink:0;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.16);
      color:#fff;text-decoration:none;font-size:13px;font-weight:700
    }
    .card{
      margin-top:14px;padding:20px;border:1px solid #dfe7e1;border-radius:16px;background:#fff;
      box-shadow:0 8px 24px rgba(15,23,42,.06)
    }
    .title{margin:0 0 14px;font-size:18px;font-weight:800}
    .info-row{
      display:grid;grid-template-columns:120px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ee
    }
    .info-row:last-child{border-bottom:0}
    .info-label{color:#64748b;font-size:14px}
    .info-value{font-weight:700;word-break:break-all}
    .locked{display:inline-block;margin-left:7px;padding:3px 7px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:11px}
    label{display:block;margin:14px 0 7px;font-size:14px;font-weight:700;color:#374151}
    select,input{
      width:100%;height:49px;padding:0 13px;border:1px solid #cbd5e1;border-radius:10px;
      background:#fff;color:#111827;font-size:15px;outline:none
    }
    select:focus,input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
    input[readonly]{background:#f8fafc;color:#475569}
