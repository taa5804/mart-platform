<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#15803d">

  <title>가맹점 소통 | 본사 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 22px 14px 40px;
      background: #f4f7f5;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      padding: 24px 22px;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        #166534,
        #15803d
      );
      color: #fff;
      box-shadow:
        0 12px 30px
        rgba(21, 128, 61, 0.20);
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.35;
    }

    .header p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 14px;
      line-height: 1.6;
    }

    .back-button {
      flex-shrink: 0;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid
        rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      background:
        rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .card {
      margin-top: 16px;
      padding: 20px;
      border: 1px solid #dfe8e1;
      border-radius: 16px;
      background: #fff;
      box-shadow:
        0 6px 20px
        rgba(15, 23, 42, 0.05);
    }

    .card-title {
      margin: 0 0 6px;
      color: #1f2937;
      font-size: 18px;
      font-weight: 800;
    }

    .card-description {
      margin: 0 0 18px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-top: 15px;
    }

    .field:first-of-type {
      margin-top: 0;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 14px;
      font-weight: 800;
    }

    .required {
      color: #dc2626;
    }

    .input,
    .textarea {
      width: 100%;
      border: 1px solid #cfdad2;
      border-radius: 11px;
      background: #fff;
      color: #111827;
      outline: none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .input {
      height: 50px;
      padding: 0 14px;
      font-size: 16px;
    }

    .textarea {
      min-height: 150px;
      padding: 14px;
      resize: vertical;
      font-size: 15px;
      line-height: 1.65;
    }

    .input:focus,
    .textarea:focus {
      border-color: #15803d;
      box-shadow:
        0 0 0 3px
        rgba(21, 128, 61, 0.10);
    }

    .search-row {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr) 110px;
      gap: 9px;
    }

    .search-button {
      min-height: 50px;
      border: 0;
      border-radius: 11px;
      background: #166534;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .search-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .store-box {
      display: none;
      margin-top: 14px;
      padding: 15px;
      border: 1px solid #d9e7dd;
      border-radius: 12px;
      background: #f7fbf8;
    }

    .store-box.show {
      display: block;
    }

    .store-name {
      color: #166534;
      font-size: 17px;
      font-weight: 900;
    }

    .store-info {
      margin-top: 6px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .send-button {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      background: #15803d;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 11px;
      font-size: 14px;
      line-height: 1.55;
    }

    .message.show {
      display: block;
    }

    .message.error {
      display: block;
      border: 1px solid #efb8b8;
      background: #fff0f0;
      color: #a02020;
    }

    .message.success {
      display: block;
      border: 1px solid #bbdfc5;
      background: #effaf2;
      color: #166534;
    }

    .message.waiting {
      display: block;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .section-title {
      margin: 24px 2px 10px;
      color: #26362c;
      font-size: 17px;
      font-weight: 900;
    }

    .history-empty {
      padding: 24px 15px;
      color: #64748b;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      padding: 15px;
      border: 1px solid #e0e7e2;
      border-radius: 13px;
      background: #fff;
    }

    .history-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .history-store {
      color: #166534;
      font-size: 15px;
      font-weight: 900;
    }

    .history-date {
      flex-shrink: 0;
      color: #94a3b8;
      font-size: 12px;
    }

    .history-content {
      margin-top: 9px;
      color: #374151;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #loadingScreen {
      display: flex;
      min-height: 65vh;
      align-items: center;
      justify-content: center;
    }

    .loading-card {
      width: 100%;
      padding: 28px 22px;
      border: 1px solid #e1e8e3;
      border-radius: 16px;
      background: #fff;
      text-align: center;
      box-shadow:
        0 8px 24px
        rgba(15, 23, 42, 0.07);
    }

    .loading-card strong {
      display: block;
      color: #1f2937;
      font-size: 18px;
    }

    .loading-card span {
      display: block;
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
    }

    #pageContent {
      display: none;
    }

    @media (max-width: 470px) {
      body {
        padding:
          16px 12px 30px;
      }

      .header {
        padding: 21px 18px;
      }

      .header h1 {
        font-size: 22px;
      }

      .card {
        padding: 17px;
      }

      .search-row {
        grid-template-columns:
          minmax(0, 1fr) 92px;
      }

      .search-button {
        font-size: 14px;
      }

      .history-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <section id="loadingScreen">
      <div class="loading-card">
        <strong>
          본사 관리자 확인 중
        </strong>

        <span>
          로그인 정보를 확인하고 있습니다.
        </span>
      </div>
    </section>


    <section id="pageContent">

      <header class="header">

        <div class="header-top">

          <div>
            <h1>
              가맹점 소통
            </h1>

            <p>
              마트번호를 입력하여
              가맹점과 소통할 수 있습니다.
            </p>
          </div>

          <button
            class="back-button"
            type="button"
            id="backButton"
          >
            관리자 홈
          </button>

        </div>

      </header>


      <section class="card">

        <h2 class="card-title">
          가맹점 찾기
        </h2>

        <p class="card-description">
          소통할 가맹점의 마트번호를 입력하세요.
        </p>


        <div class="field">

          <label
            class="label"
            for="storeCode"
          >
            마트번호
            <span class="required">*</span>
          </label>

          <div class="search-row">

            <input
              id="storeCode"
              class="input"
              type="text"
              inputmode="text"
              autocomplete="off"
              placeholder="마트번호 입력"
            >

            <button
              id="searchButton"
              class="search-button"
              type="button"
            >
              확인
            </button>

          </div>

        </div>


        <div
          id="storeBox"
          class="store-box"
        >

          <div
            id="storeName"
            class="store-name"
          >
          </div>

          <div
            id="storeInfo"
            class="store-info"
          >
          </div>

        </div>


        <div class="field">

          <label
            class="label"
            for="inquiryContent"
          >
            내용
            <span class="required">*</span>
          </label>

          <textarea
            id="inquiryContent"
            class="textarea"
            placeholder="가맹점에 전달할 내용을 입력하세요."
          ></textarea>

        </div>


        <button
          id="sendButton"
          class="send-button"
          type="button"
        >
          보내기
        </button>


        <div
          id="messageBox"
          class="message"
          aria-live="polite"
        ></div>

      </section>


      <div class="section-title">
        소통 내역
      </div>


      <section class="card">

        <div
          id="historyList"
          class="history-list"
        >

          <div class="history-empty">
            마트번호를 확인하면
            해당 가맹점의 소통 내역이 표시됩니다.
          </div>

        </div>

      </section>

    </section>

  </main>


  <script>
    (function () {
      "use strict";


      const ADMIN_FUNCTION_URL =
        "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-admin-account";

      const INQUIRY_FUNCTION_URL =
        "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-store-inquiry";

      const SESSION_KEY =
        "wooriapt_hq_admin_session";

      const LOGIN_PAGE =
        "/hq-account.html";

      const DASHBOARD_PAGE =
        "/hq-dashboard.html";


      const loadingScreen =
        document.getElementById(
          "loadingScreen"
        );

      const pageContent =
        document.getElementById(
          "pageContent"
        );

      const backButton =
        document.getElementById(
          "backButton"
        );

      const storeCodeInput =
        document.getElementById(
          "storeCode"
        );

      const searchButton =
        document.getElementById(
          "searchButton"
        );

      const storeBox =
        document.getElementById(
          "storeBox"
        );

      const storeName =
        document.getElementById(
          "storeName"
        );

      const storeInfo =
        document.getElementById(
          "storeInfo"
        );

      const inquiryContent =
        document.getElementById(
          "inquiryContent"
        );

      const sendButton =
        document.getElementById(
          "sendButton"
        );

      const messageBox =
        document.getElementById(
          "messageBox"
        );

      const historyList =
        document.getElementById(
          "historyList"
        );


      let selectedStore = null;


      function showMessage(
        text,
        type
      ) {

        messageBox.textContent =
          text || "";

        messageBox.className =
          "message" +
          (
            type
              ? " " + type
              : ""
          );
      }


      function clearMessage() {

        messageBox.textContent = "";

        messageBox.className =
          "message";
      }


      function clearStore() {

        selectedStore = null;

        storeBox.classList.remove(
          "show"
        );

        storeName.textContent = "";

        storeInfo.textContent = "";

        historyList.innerHTML =
          '<div class="history-empty">' +
          '마트번호를 확인하면 해당 가맹점의 소통 내역이 표시됩니다.' +
          '</div>';
      }


      async function postJson(
        url,
        body
      ) {

        const response =
          await fetch(
            url,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  body || {}
                )
            }
          );


        const text =
          await response.text();


        let data = {};

        try {

          data =
            text
              ? JSON.parse(text)
              : {};

        } catch (error) {

          data = {};
        }


        if (
          !response.ok ||
          data.ok === false
        ) {

          throw new Error(
            data.message ||
            data.error ||
            "처리에 실패했습니다."
          );
        }


        return data;
      }


      async function validateSession() {

        const token =
          localStorage.getItem(
            SESSION_KEY
          ) || "";


        if (!token) {

          location.replace(
            LOGIN_PAGE
          );

          return null;
        }


        try {

          await postJson(
            ADMIN_FUNCTION_URL,
            {
              action:
                "validate_session",

              session_token:
                token
            }
          );


          loadingScreen.style.display =
            "none";

          pageContent.style.display =
            "block";


          return token;

        } catch (error) {

          localStorage.removeItem(
            SESSION_KEY
          );

          location.replace(
            LOGIN_PAGE
          );

          return null;
        }
      }


      function renderHistory(
        items
      ) {

        historyList.innerHTML = "";


        if (
          !Array.isArray(items) ||
          items.length === 0
        ) {

          historyList.innerHTML =
            '<div class="history-empty">' +
            '등록된 소통 내역이 없습니다.' +
            '</div>';

          return;
        }


        items.forEach(
          function (item) {

            const box =
              document.createElement(
                "div"
              );

            box.className =
              "history-item";


            const top =
              document.createElement(
                "div"
              );

            top.className =
              "history-top";


            const store =
              document.createElement(
                "div"
              );

            store.className =
              "history-store";

            store.textContent =
              item.sender_name ||
              item.sender_type ||
              "본사";


            const date =
              document.createElement(
                "div"
              );

            date.className =
              "history-date";

            date.textContent =
              item.created_at
                ? new Date(
                    item.created_at
                  ).toLocaleString(
                    "ko-KR"
                  )
                : "";


            const content =
              document.createElement(
                "div"
              );

            content.className =
              "history-content";

            content.textContent =
              item.content ||
              item.message ||
              "";


            top.appendChild(
              store
            );

            top.appendChild(
              date
            );

            box.appendChild(
              top
            );

            box.appendChild(
              content
            );

            historyList.appendChild(
              box
            );
          }
        );
      }


      async function searchStore() {

        clearMessage();

        clearStore();


        const storeCode =
          storeCodeInput.value
            .trim();


        if (!storeCode) {

          showMessage(
            "마트번호를 입력해 주세요.",
            "error"
          );

          storeCodeInput.focus();

          return;
        }


        const token =
          localStorage.getItem(
            SESSION_KEY
          ) || "";


        try {

          searchButton.disabled =
            true;

          showMessage(
            "가맹점 정보를 확인하고 있습니다.",
            "waiting"
          );


          const data =
            await postJson(
              INQUIRY_FUNCTION_URL,
              {
                action:
                  "get_store",

                session_token:
                  token,

                store_code:
                  storeCode
              }
            );


          const store =
            data.store ||
            data.data ||
            null;


          if (!store) {

            throw new Error(
              "해당 마트번호의 가맹점을 찾을 수 없습니다."
            );
          }


          selectedStore =
            store;


          storeName.textContent =
            store.store_name ||
            store.name ||
            "가맹점";


          const info = [];


          if (
            store.store_code ||
            storeCode
          ) {

            info.push(
              "마트번호: " +
              (
                store.store_code ||
                storeCode
              )
            );
          }


          if (store.owner_name) {

            info.push(
              "대표자: " +
              store.owner_name
            );
          }


          if (store.phone) {

            info.push(
              "연락처: " +
              store.phone
            );
          }


          storeInfo.textContent =
            info.join(" · ");


          storeBox.classList.add(
            "show"
          );


          renderHistory(
            data.inquiries ||
            data.messages ||
            []
          );


          showMessage(
            "가맹점을 확인했습니다.",
            "success"
          );


        } catch (error) {

          clearStore();

          showMessage(
            error.message ||
            "가맹점 확인에 실패했습니다.",
            "error"
          );

        } finally {

          searchButton.disabled =
            false;
        }
      }


      async function sendInquiry() {

        clearMessage();


        if (!selectedStore) {

          showMessage(
            "먼저 마트번호를 입력하고 가맹점을 확인해 주세요.",
            "error"
          );

          storeCodeInput.focus();

          return;
        }


        const content =
          inquiryContent.value
            .trim();


        if (!content) {

          showMessage(
            "전달할 내용을 입력해 주세요.",
            "error"
          );

          inquiryContent.focus();

          return;
        }


        const token =
          localStorage.getItem(
            SESSION_KEY
          ) || "";


        const storeCode =
          selectedStore.store_code ||
          storeCodeInput.value.trim();


        try {

          sendButton.disabled =
            true;

          showMessage(
            "내용을 보내고 있습니다.",
            "waiting"
          );


          const data =
            await postJson(
              INQUIRY_FUNCTION_URL,
              {
                action:
                  "send_message",

                session_token:
                  token,

                store_code:
                  storeCode,

                content:
                  content,

                sender_type:
                  "HQ"
              }
            );


          inquiryContent.value =
            "";


          if (
            Array.isArray(
              data.inquiries
            )
          ) {

            renderHistory(
              data.inquiries
            );

          } else {

            await searchStore();
          }


          showMessage(
            "가맹점에 내용을 보냈습니다.",
            "success"
          );


        } catch (error) {

          showMessage(
            error.message ||
            "내용을 보내지 못했습니다.",
            "error"
          );

        } finally {

          sendButton.disabled =
            false;
        }
      }


      backButton.addEventListener(
        "click",
        function () {

          location.href =
            DASHBOARD_PAGE;
        }
      );


      searchButton.addEventListener(
        "click",
        searchStore
      );


      storeCodeInput.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key ===
            "Enter"
          ) {

            event.preventDefault();

            searchStore();
          }
        }
      );


      storeCodeInput.addEventListener(
        "input",
        function () {

          clearStore();

          clearMessage();
        }
      );


      sendButton.addEventListener(
        "click",
        sendInquiry
      );


      validateSession();

    })();
  </script>

</body>
</html>
