<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>가맹점 문의 | 본사 관리자</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}

body{
  min-height:100vh;
  padding:20px 14px 40px;
  background:#f4f7f5;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:760px;
  margin:0 auto;
}

.back{
  margin-bottom:14px;
  padding:11px 15px;
  border:0;
  border-radius:8px;
  background:#374151;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.header{
  padding:21px 19px;
  border-radius:15px;
  background:#15803d;
  color:#fff;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:7px 0 0;
  font-size:14px;
  opacity:.9;
}

.card{
  margin-top:15px;
  padding:17px;
  border:1px solid #dde5df;
  border-radius:13px;
  background:#fff;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:700;
}

.store-row{
  display:flex;
  gap:8px;
}

input,
textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input{
  height:45px;
  padding:0 11px;
}

textarea{
  min-height:100px;
  padding:11px;
  resize:vertical;
}

input:focus,
textarea:focus{
  border-color:#15803d;
}

button{
  border:0;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

.check{
  flex:0 0 80px;
  background:#475569;
  color:#fff;
}

.store-name{
  display:none;
  margin-top:10px;
  padding:11px;
  border-radius:8px;
  background:#f0fdf4;
  color:#166534;
  font-size:14px;
  font-weight:700;
}

.messages{
  min-height:240px;
  max-height:460px;
  overflow-y:auto;
  padding:12px;
  border:1px solid #e2e8f0;
  border-radius:10px;
  background:#f8fafc;
}

.empty{
  padding:70px 10px;
  text-align:center;
  color:#94a3b8;
  font-size:14px;
}

.msg{
  margin-bottom:12px;
}

.msg.hq{
  text-align:right;
}

.bubble{
  display:inline-block;
  max-width:82%;
  padding:10px 12px;
  border-radius:10px;
  background:#fff;
  border:1px solid #e2e8f0;
  text-align:left;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.msg.hq .bubble{
  background:#dcfce7;
  border-color:#bbf7d0;
}

.sender{
  margin-bottom:4px;
  color:#64748b;
  font-size:11px;
}

.send{
  width:100%;
  min-height:47px;
  margin-top:9px;
  background:#15803d;
  color:#fff;
  font-size:15px;
}

.send:disabled,
.check:disabled{
  opacity:.55;
}

.notice{
  min-height:20px;
  margin-top:10px;
  font-size:13px;
  font-weight:700;
}

.error{color:#dc2626}
.success{color:#15803d}

@media(max-width:500px){
  body{padding:14px 10px 30px}
}
</style>
</head>

<body>

<main class="wrap">

<button
  class="back"
  type="button"
  onclick="location.href='/hq-dashboard.html'"
>
← 본사 관리자
</button>

<header class="header">
  <h1>가맹점 문의</h1>
  <p>가맹점과 문의 및 답변을 주고받습니다.</p>
</header>

<section class="card">

<label for="storeId">마트번호</label>

<div class="store-row">
  <input
    id="storeId"
    placeholder="마트번호 입력"
    autocomplete="off"
  >

  <button
    id="checkButton"
    class="check"
    type="button"
  >
    확인
  </button>
</div>

<div
  id="storeName"
  class="store-name"
></div>

<div
  id="notice"
  class="notice"
></div>

</section>


<section class="card">

<div
  id="messages"
  class="messages"
>
  <div class="empty">
    마트번호를 입력하고 확인해 주세요.
  </div>
</div>

</section>


<section class="card">

<label for="message">내용</label>

<textarea
  id="message"
  placeholder="문의 또는 답변을 입력하세요."
  disabled
></textarea>

<button
  id="sendButton"
  class="send"
  type="button"
  disabled
>
전송
</button>

</section>

</main>


<script>
(function(){

"use strict";

const FUNCTION_URL =
  "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-admin-account";

const SESSION_KEY =
  "wooriapt_hq_admin_session";

const LOGIN_PAGE =
  "/hq-account.html";

let currentStoreId = "";

const storeId =
  document.getElementById("storeId");

const storeName =
  document.getElementById("storeName");

const checkButton =
  document.getElementById("checkButton");

const messages =
  document.getElementById("messages");

const message =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const notice =
  document.getElementById("notice");


function session(){
  return localStorage.getItem(
    SESSION_KEY
  ) || "";
}


function showNotice(text,error){
  notice.textContent=text || "";
  notice.className=
    "notice " +
    (error ? "error" : "success");
}


function escapeHtml(value){
  const div=document.createElement("div");
  div.textContent=
    value == null ? "" : String(value);
  return div.innerHTML;
}


async function api(action,data){

  const response=
    await fetch(
      FUNCTION_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(
          Object.assign(
            {
              action:action,
              session_token:session()
            },
            data || {}
          )
        )
      }
    );

  const text=
    await response.text();

  let result={};

  try{
    result=text ? JSON.parse(text) : {};
  }catch(e){
    result={};
  }

  if(
    response.status===401
  ){
    localStorage.removeItem(
      SESSION_KEY
    );

    location.replace(
      LOGIN_PAGE
    );

    throw new Error(
      "로그인이 만료되었습니다."
    );
  }

  if(
    !response.ok ||
    result.ok===false
  ){
    throw new Error(
      result.message ||
      "처리에 실패했습니다."
    );
  }

  return result;
}


function renderMessages(list){

  messages.innerHTML="";

  if(
    !Array.isArray(list) ||
    list.length===0
  ){
    messages.innerHTML=
      '<div class="empty">문의내역이 없습니다.</div>';

    return;
  }

  list.forEach(function(item){

    const box=
      document.createElement("div");

    const isHQ=
      String(
        item.sender_type || ""
      ).toUpperCase()==="HQ";

    box.className=
      "msg " +
      (isHQ ? "hq" : "store");

    box.innerHTML=
      '<div class="sender">' +
      (isHQ ? "본사" : "가맹점") +
      '</div>' +

      '<div class="bubble">' +
      escapeHtml(
        item.message || ""
      ) +
      '</div>';

    messages.appendChild(box);

  });

  messages.scrollTop=
    messages.scrollHeight;
}


async function loadMessages(){

  if(!currentStoreId){
    return;
  }

  const result=
    await api(
      "hq_inquiry_list",
      {
        store_id:currentStoreId
      }
    );

  renderMessages(
    result.inquiries ||
    result.messages ||
    []
  );
}


async function checkStore(){

  const id=
    storeId.value.trim();

  if(!id){
    showNotice(
      "마트번호를 입력해 주세요.",
      true
    );

    return;
  }

  checkButton.disabled=true;

  showNotice(
    "확인 중...",
    false
  );

  try{

    const result=
      await api(
        "hq_store_check",
        {
          store_id:id
        }
      );

    currentStoreId=
      result.store.store_id;

    storeId.value=
      currentStoreId;

    storeName.textContent=
      (result.store.store_name || "") +
      " (" +
      currentStoreId +
      ")";

    storeName.style.display=
      "block";

    message.disabled=false;
    sendButton.disabled=false;

    showNotice(
      "",
      false
    );

    await loadMessages();

  }catch(error){

    currentStoreId="";

    storeName.style.display=
      "none";

    message.disabled=true;
    sendButton.disabled=true;

    messages.innerHTML=
      '<div class="empty">마트번호를 확인해 주세요.</div>';

    showNotice(
      error.message,
      true
    );

  }finally{

    checkButton.disabled=false;

  }
}


async function sendMessage(){

  if(!currentStoreId){
    return;
  }

  const text=
    message.value.trim();

  if(!text){
    showNotice(
      "내용을 입력해 주세요.",
      true
    );

    return;
  }

  sendButton.disabled=true;

  try{

    const result=
      await api(
        "hq_inquiry_send",
        {
          store_id:currentStoreId,
          message:text
        }
      );

    message.value="";

    showNotice(
      result.message ||
      "전송되었습니다.",
      false
    );

    await loadMessages();

  }catch(error){

    showNotice(
      error.message,
      true
    );

  }finally{

    sendButton.disabled=false;

  }
}


checkButton.addEventListener(
  "click",
  checkStore
);


sendButton.addEventListener(
  "click",
  sendMessage
);


storeId.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Enter"){
      checkStore();
    }

  }
);


if(!session()){
  location.replace(
    LOGIN_PAGE
  );
}

})();
</script>

</body>
</html>
