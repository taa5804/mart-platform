<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#15803d">

  <title>가맹점 문의 | 본사 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 22px 14px 40px;
      background: #f4f7f5;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      padding: 22px;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        #166534,
        #15803d
      );
      color: #fff;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,.86);
    }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      color: #166534;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .card {
      margin-top: 16px;
      padding: 20px;
      border: 1px solid #e0e7e2;
      border-radius: 16px;
      background: #fff;
      box-shadow:
        0 6px 20px
        rgba(15,23,42,.05);
    }

    label {
      display: block;
      margin: 0 0 7px;
      color: #374151;
      font-size: 14px;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      color: #111827;
      font-size: 16px;
      outline: none;
    }

    input {
      height: 50px;
      padding: 0 14px;
    }

    textarea {
      min-height: 140px;
      padding: 14px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus {
      border-color: #16a34a;
      box-shadow:
        0 0 0 3px
        rgba(22,163,74,.12);
    }

    .field {
      margin-top: 17px;
    }

    .field:first-child {
      margin-top: 0;
    }

    .send-button {
      width: 100%;
      min-height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 11px;
      background: #15803d;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .notice {
      margin-top: 13px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #475569;
      font-size: 13px;
      line-height: 1.6;
    }

    .conversation-title {
      margin: 24px 2px 10px;
      font-size: 17px;
      font-weight: 800;
    }

    .conversation {
      padding: 18px;
      border: 1px solid #e0e7e2;
      border-radius: 16px;
      background: #fff;
    }

    .empty {
      padding: 24px 10px;
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
    }

    #page {
      display: none;
    }

    #loading {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div id="loading">
      본사 관리자 확인 중입니다.
    </div>

    <section id="page">

      <a
        class="back"
        href="/hq-dashboard.html"
      >
        ← 본사 관리자
      </a>

      <header class="header">
        <h1>가맹점 문의</h1>

        <p>
          마트번호를 입력하여 해당 가맹점과 문의 내용을 주고받습니다.
        </p>
      </header>


      <section class="card">

        <div class="field">
          <label for="storeId">
            마트번호
          </label>

          <input
            id="storeId"
            type="text"
            autocomplete="off"
            placeholder="마트번호 입력"
          >
        </div>


        <div class="field">
          <label for="message">
            문의내용
          </label>

          <textarea
            id="message"
            placeholder="가맹점에 전달할 내용을 입력하세요."
          ></textarea>
        </div>


        <button
          id="sendButton"
          class="send-button"
          type="button"
        >
          보내기
        </button>


        <div class="notice">
          승인된 가맹점의 마트번호만 사용할 수 있도록
          다음 단계에서 서버와 연결합니다.
        </div>

      </section>


      <div class="conversation-title">
        문의 내역
      </div>

      <section class="conversation">
        <div
          id="conversationList"
          class="empty"
        >
          마트번호를 입력하면 해당 가맹점의 문의 내역이 표시됩니다.
        </div>
      </section>

    </section>

  </main>


  <script>
    (function () {
      "use strict";

      const FUNCTION_URL =
        "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-admin-account";

      const SESSION_KEY =
        "wooriapt_hq_admin_session";

      const LOGIN_PAGE =
        "/hq-account.html";


      const loading =
        document.getElementById("loading");

      const page =
        document.getElementById("page");

      const sendButton =
        document.getElementById("sendButton");


      function getSession() {
        return (
          localStorage.getItem(
            SESSION_KEY
          ) || ""
        );
      }


      async function validateSession() {

        const token =
          getSession();

        if (!token) {
          location.replace(
            LOGIN_PAGE
          );

          return;
        }


        try {

          const response =
            await fetch(
              FUNCTION_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    action:
                      "validate_session",

                    session_token:
                      token
                  })
              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            data.ok === false
          ) {
            throw new Error(
              "로그인 확인 실패"
            );
          }


          loading.style.display =
            "none";

          page.style.display =
            "block";


        } catch (error) {

          localStorage.removeItem(
            SESSION_KEY
          );

          location.replace(
            LOGIN_PAGE
          );
        }
      }


      sendButton.addEventListener(
        "click",
        function () {

          const storeId =
            document
              .getElementById("storeId")
              .value
              .trim();

          const message =
            document
              .getElementById("message")
              .value
              .trim();


          if (!storeId) {
            alert(
              "마트번호를 입력하세요."
            );

            return;
          }


          if (!message) {
            alert(
              "문의내용을 입력하세요."
            );

            return;
          }


          alert(
            "다음 단계에서 문의 전송 기능을 연결합니다."
          );
        }
      );


      validateSession();

    })();
  </script>

</body>
</html>
