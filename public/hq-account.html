<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15803d">
  <title>본사 관리자 계정관리</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{
      min-height:100vh;
      padding:22px 14px 36px;
      background:#f5f6f8;
      color:#111827;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .wrap{width:100%;max-width:620px;margin:0 auto}
    .card{
      padding:24px 22px;
      border:1px solid #e3e5e8;
      border-radius:16px;
      background:#fff;
      box-shadow:0 8px 24px rgba(15,23,42,.06);
    }
    h1{margin:0 0 8px;font-size:24px;line-height:1.35}
    .help{margin:0 0 20px;color:#64748b;font-size:14px;line-height:1.65}
    label{display:block;margin:15px 0 7px;font-size:14px;font-weight:700;color:#374151}
    input{
      width:100%;height:50px;padding:0 14px;
      border:1px solid #cbd5e1;border-radius:10px;
      background:#fff;color:#111827;font-size:16px;outline:none;
    }
    input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
    button{
      width:100%;min-height:50px;margin-top:18px;padding:12px 16px;
      border:0;border-radius:10px;background:#15803d;color:#fff;
      font-size:16px;font-weight:700;cursor:pointer;
    }
    button.secondary{margin-top:10px;background:#374151}
    button:disabled{opacity:.58;cursor:wait}
    .current{
      margin:0 0 10px;padding:12px 14px;border-radius:10px;
      background:#f1f5f9;color:#334155;font-size:14px;
    }
    .message{
      display:none;margin-top:14px;padding:13px 14px;
      border-radius:10px;font-size:14px;line-height:1.55;
    }
    .message.success{display:block;border:1px solid #b8dec2;background:#edf8f0;color:#236631}
    .message.error{display:block;border:1px solid #efb8b8;background:#fff0f0;color:#a02020}
    .message.waiting{display:block;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginPanel" class="card">
      <h1>본사 관리자 로그인</h1>
      <p class="help">본사 관리자 아이디와 비밀번호를 입력해 주세요.</p>

      <label for="loginId">아이디</label>
      <input id="loginId" type="text" autocomplete="username" placeholder="관리자 아이디">

      <label for="loginPassword">비밀번호</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호">

      <button id="loginButton" type="button">로그인</button>
    </section>

    <section id="accountPanel" class="card" hidden>
      <h1>본사 관리자 계정관리</h1>
      <p class="help">현재 비밀번호를 확인한 후 새 비밀번호로 변경합니다.</p>

      <div class="current">로그인 계정: <strong id="currentId">-</strong></div>

      <label for="currentPassword">현재 비밀번호</label>
      <input id="currentPassword" type="password" autocomplete="current-password" placeholder="현재 비밀번호">

      <label for="newPassword">새 비밀번호</label>
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="영문·숫자 포함 8자 이상">

      <label for="confirmPassword">새 비밀번호 확인</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="새 비밀번호 다시 입력">

      <button id="changeButton" type="button">비밀번호 변경</button>
      <button id="logoutButton" class="secondary" type="button">로그아웃</button>
    </section>

    <div id="messageBox" class="message" aria-live="polite"></div>
  </main>

  <script>
    (function(){
      "use strict";

      const FUNCTION_URL =
        "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-admin-account";

      const SESSION_KEY = "wooriapt_hq_admin_session";
      const ADMIN_ID_KEY = "wooriapt_hq_admin_id";

      const loginPanel = document.getElementById("loginPanel");
      const accountPanel = document.getElementById("accountPanel");
      const messageBox = document.getElementById("messageBox");

      const loginId = document.getElementById("loginId");
      const loginPassword = document.getElementById("loginPassword");
      const loginButton = document.getElementById("loginButton");

      const currentId = document.getElementById("currentId");
      const currentPassword = document.getElementById("currentPassword");
      const newPassword = document.getElementById("newPassword");
      const confirmPassword = document.getElementById("confirmPassword");
      const changeButton = document.getElementById("changeButton");
      const logoutButton = document.getElementById("logoutButton");

      function showMessage(text,type){
        messageBox.textContent = text || "";
        messageBox.className = "message" + (type ? " " + type : "");
      }

      function setBusy(busy){
        [loginButton,changeButton,logoutButton].forEach(function(button){
          if(button) button.disabled = busy;
        });
      }

      function getSession(){
        return localStorage.getItem(SESSION_KEY) || "";
      }

      function saveSession(token,adminId){
        localStorage.setItem(SESSION_KEY,token);
        localStorage.setItem(ADMIN_ID_KEY,adminId);
      }

      function clearSession(){
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(ADMIN_ID_KEY);
      }

      function showLogin(){
        loginPanel.hidden = false;
        accountPanel.hidden = true;
        loginPassword.value = "";
      }

      function showAccount(adminId){
        loginPanel.hidden = true;
        accountPanel.hidden = false;
        currentId.textContent =
          adminId || localStorage.getItem(ADMIN_ID_KEY) || "admin";
      }

      async function api(action,payload){
        const response = await fetch(FUNCTION_URL,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(Object.assign({action:action},payload || {}))
        });

        const text = await response.text();
        let data = {};

        try{
          data = text ? JSON.parse(text) : {};
        }catch(error){
          data = {};
        }

        if(!response.ok || data.ok === false){
          throw new Error(data.message || data.error || "처리에 실패했습니다.");
        }

        return data;
      }

      async function validateSavedSession(){
        const token = getSession();

        if(!token){
          showLogin();
          return;
        }

        try{
          const data = await api("validate_session",{session_token:token});
          saveSession(token,data.admin_id);
          showAccount(data.admin_id);
        }catch(error){
          clearSession();
          showLogin();
        }
      }

      loginButton.addEventListener("click",async function(){
        const adminId = loginId.value.trim();
        const password = loginPassword.value;

        if(!adminId || !password){
          showMessage("아이디와 비밀번호를 입력해 주세요.","error");
          return;
        }

        try{
          setBusy(true);
          showMessage("로그인하고 있습니다.","waiting");

          const data = await api("login",{
            admin_id:adminId,
            password:password
          });

          saveSession(data.session_token,data.admin_id);
          window.location.href="/hq-dashboard.html";
        }catch(error){
          showMessage(error.message || "로그인에 실패했습니다.","error");
        }finally{
          setBusy(false);
        }
      });

      loginPassword.addEventListener("keydown",function(event){
        if(event.key === "Enter") loginButton.click();
      });

      changeButton.addEventListener("click",async function(){
        const oldPassword = currentPassword.value;
        const nextPassword = newPassword.value;
        const confirm = confirmPassword.value;

        if(!oldPassword || !nextPassword || !confirm){
          showMessage("비밀번호 입력란을 모두 작성해 주세요.","error");
          return;
        }

        if(nextPassword !== confirm){
          showMessage("새 비밀번호와 확인 비밀번호가 일치하지 않습니다.","error");
          return;
        }

        if(
          nextPassword.length < 8 ||
          !/[A-Za-z]/.test(nextPassword) ||
          !/[0-9]/.test(nextPassword)
        ){
          showMessage(
            "새 비밀번호는 영문과 숫자를 포함해 8자 이상이어야 합니다.",
            "error"
          );
          return;
        }

        try{
          setBusy(true);
          showMessage("비밀번호를 변경하고 있습니다.","waiting");

          const data = await api("change_password",{
            session_token:getSession(),
            current_password:oldPassword,
            new_password:nextPassword
          });

          saveSession(data.session_token,data.admin_id);

          currentPassword.value = "";
          newPassword.value = "";
          confirmPassword.value = "";

          showMessage("비밀번호가 변경되었습니다.","success");
        }catch(error){
          showMessage(error.message || "비밀번호 변경에 실패했습니다.","error");
        }finally{
          setBusy(false);
        }
      });

      logoutButton.addEventListener("click",async function(){
        const token = getSession();

        try{
          setBusy(true);
          if(token){
            await api("logout",{session_token:token});
          }
        }catch(error){
          console.warn(error);
        }finally{
          clearSession();
          setBusy(false);
          showLogin();
          showMessage("로그아웃되었습니다.","success");
        }
      });

      validateSavedSession();
    })();
  </script>
</body>
</html>
