<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#15803d">

<title>본사 관리자 로그인</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;
  padding:22px 12px 36px;
  background:#f5f6f8;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Noto Sans KR",
    Arial,
    sans-serif;
}

#hq-account-app{
  width:100%;
}

#hq-account-app *{
  box-sizing:border-box;
}

#hq-account-app .hq-wrap{
  width:100%;
  max-width:620px;
  margin:0 auto;
}

#hq-account-app .hq-card{
  padding:22px;
  border:1px solid #e3e5e8;
  border-radius:14px;
  background:#fff;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
}

#hq-account-app h2{
  margin:0 0 8px;
  color:#1f2937;
  font-size:23px;
}

#hq-account-app .hq-help{
  margin:0 0 18px;
  color:#64748b;
  font-size:14px;
  line-height:1.6;
}

#hq-account-app label{
  display:block;
  margin:14px 0 7px;
  color:#374151;
  font-size:14px;
  font-weight:700;
}

#hq-account-app input{
  width:100%;
  height:48px;
  padding:0 13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  color:#111827;
  background:#fff;
  font-size:15px;
  outline:none;
}

#hq-account-app input:focus{
  border-color:#16a34a;
  box-shadow:0 0 0 3px rgba(22,163,74,.12);
}

#hq-account-app button{
  width:100%;
  min-height:48px;
  margin-top:18px;
  padding:12px 16px;
  border:0;
  border-radius:9px;
  background:#15803d;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

#hq-account-app button:disabled{
  opacity:.58;
  cursor:wait;
}

#hq-account-app .hq-message{
  display:none;
  margin-top:14px;
  padding:13px 14px;
  border-radius:9px;
  font-size:14px;
  line-height:1.55;
}

#hq-account-app .hq-message.success{
  display:block;
  border:1px solid #b8dec2;
  background:#edf8f0;
  color:#236631;
}

#hq-account-app .hq-message.error{
  display:block;
  border:1px solid #efb8b8;
  background:#fff0f0;
  color:#a02020;
}

#hq-account-app .hq-message.waiting{
  display:block;
  border:1px solid #bfdbfe;
  background:#eff6ff;
  color:#1d4ed8;
}

@media(max-width:480px){

  body{
    padding:16px 10px 28px;
  }

  #hq-account-app .hq-card{
    padding:20px 16px;
  }

  #hq-account-app h2{
    font-size:21px;
  }

}
</style>
</head>

<body>

<div id="hq-account-app">

  <div class="hq-wrap">

    <section
      id="hq-login-panel"
      class="hq-card"
    >

      <h2>
        본사 관리자 로그인
      </h2>

      <p class="hq-help">
        본사 관리자 아이디와 비밀번호를 입력해 주세요.
      </p>

      <label for="hq-login-id">
        아이디
      </label>

      <input
        id="hq-login-id"
        type="text"
        autocomplete="username"
        placeholder="관리자 아이디"
      >

      <label for="hq-login-password">
        비밀번호
      </label>

      <input
        id="hq-login-password"
        type="password"
        autocomplete="current-password"
        placeholder="비밀번호"
      >

      <button
        id="hq-login-button"
        type="button"
      >
        로그인
      </button>

    </section>

    <div
      id="hq-message"
      class="hq-message"
      aria-live="polite"
    ></div>

  </div>

</div>


<script>
(function(){

"use strict";


/* =========================================
   기본 설정
========================================= */

const FUNCTION_URL =
  "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-admin-account";

const SESSION_KEY =
  "wooriapt_hq_admin_session";

const ADMIN_ID_KEY =
  "wooriapt_hq_admin_id";

/*
  중요

  hq-account.html과 hq-dashboard.html이
  같은 Vercel 프로젝트 안에 있으므로
  상대경로를 사용합니다.

  로그인:
  /hq-account.html

  관리자 메인:
  /hq-dashboard.html
*/

const DASHBOARD_PAGE =
  "/hq-dashboard.html";


/* =========================================
   DOM
========================================= */

const loginPanel =
  document.getElementById(
    "hq-login-panel"
  );

const messageBox =
  document.getElementById(
    "hq-message"
  );

const loginId =
  document.getElementById(
    "hq-login-id"
  );

const loginPassword =
  document.getElementById(
    "hq-login-password"
  );

const loginButton =
  document.getElementById(
    "hq-login-button"
  );


/* =========================================
   메시지
========================================= */

function showMessage(
  text,
  type
){

  messageBox.textContent =
    text || "";

  messageBox.className =
    "hq-message" +
    (
      type
        ? " " + type
        : ""
    );

}


/* =========================================
   버튼 상태
========================================= */

function setBusy(
  busy
){

  loginButton.disabled =
    busy;

}


/* =========================================
   세션
========================================= */

function getSession(){

  return (
    localStorage.getItem(
      SESSION_KEY
    ) || ""
  );

}


function saveSession(
  token,
  adminId
){

  localStorage.setItem(
    SESSION_KEY,
    token
  );

  localStorage.setItem(
    ADMIN_ID_KEY,
    adminId || "admin"
  );

}


function clearSession(){

  localStorage.removeItem(
    SESSION_KEY
  );

  localStorage.removeItem(
    ADMIN_ID_KEY
  );

}


/* =========================================
   관리자 메인 이동
========================================= */

function goDashboard(){

  window.location.href =
    DASHBOARD_PAGE;

}


/* =========================================
   API
========================================= */

async function api(
  action,
  payload
){

  const response =
    await fetch(
      FUNCTION_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            Object.assign(
              {
                action:action
              },
              payload || {}
            )
          )
      }
    );

  const text =
    await response.text();

  let data = {};

  try{

    data =
      text
        ? JSON.parse(text)
        : {};

  }catch(error){

    data = {};

  }


  if(
    !response.ok ||
    data.ok === false
  ){

    throw new Error(
      data.message ||
      data.error ||
      "처리에 실패했습니다."
    );

  }

  return data;

}


/* =========================================
   기존 로그인 세션 확인
========================================= */

async function validateSavedSession(){

  const token =
    getSession();


  if(!token){

    loginPanel.hidden =
      false;

    return;

  }


  try{

    showMessage(
      "로그인 상태를 확인하고 있습니다.",
      "waiting"
    );


    const data =
      await api(
        "validate_session",
        {
          session_token:
            token
        }
      );


    saveSession(
      token,
      data.admin_id
    );


    showMessage(
      "로그인되었습니다.",
      "success"
    );


    /*
      기존 세션이 정상이라면
      관리자 메인으로 이동
    */

    goDashboard();


  }catch(error){

    clearSession();

    loginPanel.hidden =
      false;

    showMessage(
      "",
      ""
    );

  }

}


/* =========================================
   로그인
========================================= */

async function login(){

  const adminId =
    loginId.value.trim();

  const password =
    loginPassword.value;


  if(
    !adminId ||
    !password
  ){

    showMessage(
      "아이디와 비밀번호를 입력해 주세요.",
      "error"
    );

    return;

  }


  try{

    setBusy(
      true
    );


    showMessage(
      "로그인하고 있습니다.",
      "waiting"
    );


    const data =
      await api(
        "login",
        {
          admin_id:
            adminId,

          password:
            password
        }
      );


    if(
      !data.session_token
    ){

      throw new Error(
        "로그인 세션을 받지 못했습니다."
      );

    }


    /*
      반드시 Vercel 도메인의
      localStorage에 세션 저장
    */

    saveSession(
      data.session_token,
      data.admin_id
    );


    showMessage(
      "로그인되었습니다.",
      "success"
    );


    /*
      같은 Vercel 프로젝트의
      본사관리자 메인으로 이동
    */

    goDashboard();


  }catch(error){

    showMessage(
      error.message ||
      "로그인에 실패했습니다.",
      "error"
    );


  }finally{

    setBusy(
      false
    );

  }

}


/* =========================================
   로그인 버튼
========================================= */

loginButton.addEventListener(
  "click",
  function(){

    login();

  }
);


/* =========================================
   엔터키 로그인
========================================= */

loginId.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      loginPassword.focus();

    }

  }
);


loginPassword.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      login();

    }

  }
);


/* =========================================
   시작
========================================= */

validateSavedSession();

})();
</script>

</body>
</html>
