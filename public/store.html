<!DOCTYPE html>
<html lang="ko">
<head>

<meta property="og:title" content="[우리마트] 오늘의 특가 세일 전단지">

<style>

  body { margin: 0; background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; color: #0f172a; }
  .wrap { max-width: 520px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding-bottom: 40px; }
  .header { background: #166534; color: #fff; padding: 16px; text-align: center; font-size: 19px; font-weight: 900; }
  .msg-box { margin: 14px; padding: 16px; background: #f0fdf4; border: 2px solid #86efac; border-radius: 12px; font-size: 16px; font-weight: 800; color: #14532d; line-height: 1.6; }
  .flyer-box { margin: 14px; border-radius: 14px; overflow: hidden; border: 1px solid #cbd5e1; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .flyer-box img { display: block; width: 100%; height: auto; }
  .btn-go { display: block; margin: 16px 14px; padding: 16px; border-radius: 12px; background: #ea580c; color: #fff; text-align: center; text-decoration: none; font-size: 17px; font-weight: 900; box-shadow: 0 6px 16px rgba(234,88,12,0.3); }

<div class="wrap">

  <a href="/mart-view.html?store=store01" class="btn-go">🏪 매장 오늘특가 · 행사상품 전체보기 & 주문하기 ›</a>

</html>
