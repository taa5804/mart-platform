<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15803d">
  <title>메인 배너관리</title>

  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{
      min-height:100vh;
      padding:20px 14px 40px;
      background:#f4f7f5;
      color:#111827;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
    }
    .wrap{width:100%;max-width:760px;margin:0 auto}
    .header{
      padding:22px 20px;
      border-radius:18px;
      background:linear-gradient(135deg,#166534,#15803d);
      color:#fff;
      box-shadow:0 12px 30px rgba(21,128,61,.2)
    }
    .header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    h1{margin:0;font-size:25px;line-height:1.35}
    .header p{margin:8px 0 0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.6}
    .back-link{
      flex-shrink:0;
      padding:8px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      color:#fff;
      text-decoration:none;
      font-size:13px;
      font-weight:700
    }
    .card{
      margin-top:14px;
      padding:20px;
      border:1px solid #dfe7e1;
      border-radius:16px;
      background:#fff;
      box-shadow:0 8px 24px rgba(15,23,42,.06)
    }
    .section-title{margin:0 0 14px;font-size:18px;font-weight:800;color:#1f2937}
    label{display:block;margin:14px 0 7px;font-size:14px;font-weight:700;color:#374151}
    select,input,textarea{
      width:100%;
      border:1px solid #cbd5e1;
      border-radius:10px;
      background:#fff;
      color:#111827;
      font-size:15px;
      outline:none
    }
    select,input{height:48px;padding:0 13px}
    textarea{min-height:82px;padding:12px 13px;resize:vertical;line-height:1.55}
    select:focus,input:focus,textarea:focus{
      border-color:#16a34a;
      box-shadow:0 0 0 3px rgba(22,163,74,.12)
    }
    .store-note{margin-top:8px;color:#64748b;font-size:13px;line-height:1.55}
    .banner-card{
      margin-top:14px;
      padding:18px;
      border:1px solid #dfe7e1;
      border-radius:14px;
      background:#fbfdfb
    }
    .banner-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .banner-head strong{font-size:17px;color:#166534}
    .switch-row{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:#374151}
    .switch-row input{width:18px;height:18px;margin:0}
    .file-input{height:auto;padding:10px}
    .preview{
      display:none;
      width:100%;
      max-height:240px;
      margin-top:10px;
      border:1px solid #d8e0da;
      border-radius:12px;
      background:#eef2ef;
      object-fit:contain
    }
    .image-status{min-height:18px;margin-top:7px;color:#64748b;font-size:12px;line-height:1.5}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
    button{
      min-height:50px;
      border:0;
      border-radius:11px;
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer
    }
    .save-btn{background:#15803d}
    .reload-btn{background:#475569}
    button:disabled{opacity:.58;cursor:wait}
    .message{
      display:none;
      margin-top:14px;
      padding:13px 14px;
      border-radius:10px;
      font-size:14px;
      line-height:1.55
    }
    .message.success{display:block;border:1px solid #b8dec2;background:#edf8f0;color:#236631}
    .message.error{display:block;border:1px solid #efb8b8;background:#fff0f0;color:#a02020}
    .message.waiting{display:block;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8}
    .loading{
      padding:30px 20px;
      text-align:center;
      color:#64748b;
      font-size:15px
    }
    @media(max-width:520px){
      .buttons{grid-template-columns:1fr}
      .header-top{align-items:flex-start}
      .card{padding:16px}
      .banner-card{padding:15px}
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header class="header">
      <div class="header-top">
        <div>
          <h1>메인 배너관리</h1>
          <p>매장을 선택한 뒤 배너 2개를 등록하고 관리합니다.</p>
        </div>
        <a class="back-link" href="/hq-dashboard.html">본사 메인</a>
      </div>
    </header>

    <section id="loadingPanel" class="card">
      <div class="loading">본사 관리자 로그인 정보를 확인하고 있습니다.</div>
    </section>

    <section id="mainPanel" hidden>
      <div class="card">
        <h2 class="section-title">매장 선택</h2>

        <label for="storeSelect">배너를 등록할 매장</label>
        <select id="storeSelect">
          <option value="">매장을 선택하세요</option>
        </select>

        <div id="storeNote" class="store-note">
          매장을 선택하면 해당 매장의 기존 배너를 불러옵니다.
        </div>
      </div>

      <div id="bannerArea" hidden>
        <section class="card">
          <h2 class="section-title">배너 내용</h2>

          <div class="banner-card" data-slot="1">
            <div class="banner-head">
              <strong>배너 1</strong>
              <label class="switch-row">
                <input id="enabled1" type="checkbox">
                사용
              </label>
            </div>

            <label for="title1">제목</label>
            <input id="title1" type="text" maxlength="100" placeholder="배너 제목">

            <label for="content1">내용</label>
            <textarea id="content1" maxlength="500" placeholder="배너 내용을 입력하세요"></textarea>

            <label for="url1">연결주소</label>
            <input id="url1" type="url" placeholder="https://로 시작하는 주소">

            <label for="file1">배너 이미지</label>
            <input id="file1" class="file-input" type="file" accept="image/*">
            <input id="imageUrl1" type="hidden">
            <div id="imageStatus1" class="image-status">이미지는 선택사항입니다.</div>
            <img id="preview1" class="preview" alt="배너 1 미리보기">
          </div>

          <div class="banner-card" data-slot="2">
            <div class="banner-head">
              <strong>배너 2</strong>
              <label class="switch-row">
                <input id="enabled2" type="checkbox">
                사용
              </label>
            </div>

            <label for="title2">제목</label>
            <input id="title2" type="text" maxlength="100" placeholder="배너 제목">

            <label for="content2">내용</label>
            <textarea id="content2" maxlength="500" placeholder="배너 내용을 입력하세요"></textarea>

            <label for="url2">연결주소</label>
            <input id="url2" type="url" placeholder="https://로 시작하는 주소">

            <label for="file2">배너 이미지</label>
            <input id="file2" class="file-input" type="file" accept="image/*">
            <input id="imageUrl2" type="hidden">
            <div id="imageStatus2" class="image-status">이미지는 선택사항입니다.</div>
            <img id="preview2" class="preview" alt="배너 2 미리보기">
          </div>

          <div class="buttons">
            <button id="saveButton" class="save-btn" type="button">배너 2개 저장</button>
            <button id="reloadButton" class="reload-btn" type="button">다시 불러오기</button>
          </div>

          <div id="messageBox" class="message" aria-live="polite"></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (function(){
      "use strict";

      const SUPABASE_URL =
        "https://dcysjuxyjqtvkihdsjvv.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2";

      const STORAGE_BUCKET =
        "product_images";

      const IMAGE_MAX_BYTES =
        500 * 1024;

      const IMAGE_MAX_WIDTH =
        1200;

      const loadingPanel =
        document.getElementById("loadingPanel");

      const mainPanel =
        document.getElementById("mainPanel");

      const bannerArea =
        document.getElementById("bannerArea");

      const storeSelect =
        document.getElementById("storeSelect");

      const storeNote =
        document.getElementById("storeNote");

      const saveButton =
        document.getElementById("saveButton");

      const reloadButton =
        document.getElementById("reloadButton");

      const messageBox =
        document.getElementById("messageBox");


      function showMessage(text,type){
        messageBox.textContent=text||"";
        messageBox.className="message"+(type?" "+type:"");
      }


      function setBusy(busy){
        saveButton.disabled=busy;
        reloadButton.disabled=busy;
        storeSelect.disabled=busy;
      }


      function apiUrl(table,query){
        return SUPABASE_URL+
          "/rest/v1/"+
          table+
          (query||"");
      }


      function apiHeaders(extra){
        return Object.assign(
          {
            apikey:SUPABASE_KEY,
            Authorization:"Bearer "+SUPABASE_KEY,
            "Content-Type":"application/json",
            Prefer:"return=representation"
          },
          extra||{}
        );
      }


      async function loadStores(){
        const response=await fetch(
          apiUrl(
            "store_accounts",
            "?role=eq.store&select=store_id,store_name&order=store_name.asc,store_id.asc"
          ),
          {
            headers:apiHeaders()
          }
        );

        if(!response.ok){
          throw new Error(await response.text());
        }

        const rows=await response.json();

        storeSelect.innerHTML=
          '<option value="">매장을 선택하세요</option>';

        rows.forEach(function(row){
          const option=document.createElement("option");
          option.value=row.store_id;
          option.textContent=
            (row.store_name||row.store_id)+
            " / "+
            row.store_id;
          storeSelect.appendChild(option);
        });

        storeNote.textContent=
          rows.length+
          "개 매장을 불러왔습니다.";
      }


      function clearSlot(slot){
        document.getElementById("enabled"+slot).checked=false;
        document.getElementById("title"+slot).value="";
        document.getElementById("content"+slot).value="";
        document.getElementById("url"+slot).value="";
        document.getElementById("imageUrl"+slot).value="";
        document.getElementById("file"+slot).value="";

        const preview=
          document.getElementById("preview"+slot);

        preview.removeAttribute("src");
        preview.style.display="none";

        document.getElementById("imageStatus"+slot)
          .textContent="이미지는 선택사항입니다.";
      }


      function applySlot(slot,row){
        clearSlot(slot);

        if(!row)return;

        document.getElementById("enabled"+slot).checked=
          row.enabled===true;

        document.getElementById("title"+slot).value=
          row.title||"";

        document.getElementById("content"+slot).value=
          row.content||"";

        document.getElementById("url"+slot).value=
          row.url||"";

        document.getElementById("imageUrl"+slot).value=
          row.image_url||"";

        if(row.image_url){
          const preview=
            document.getElementById("preview"+slot);

          preview.src=row.image_url;
          preview.style.display="block";

          document.getElementById("imageStatus"+slot)
            .textContent="등록된 이미지가 있습니다.";
        }
      }


      async function loadBanners(){
        const storeId=storeSelect.value;

        if(!storeId){
          bannerArea.hidden=true;
          return;
        }

        try{
          setBusy(true);
          showMessage("배너를 불러오고 있습니다.","waiting");

          const response=await fetch(
            apiUrl(
              "main_banners",
              "?store_id=eq."+
              encodeURIComponent(storeId)+
              "&select=store_id,slot,title,content,url,image_url,enabled"+
              "&order=slot.asc"
            ),
            {
              headers:apiHeaders()
            }
          );

          if(!response.ok){
            throw new Error(await response.text());
          }

          const rows=await response.json();

          applySlot(
            1,
            rows.find(function(row){
              return Number(row.slot)===1;
            })
          );

          applySlot(
            2,
            rows.find(function(row){
              return Number(row.slot)===2;
            })
          );

          bannerArea.hidden=false;

          showMessage(
            rows.length
              ? "기존 배너를 불러왔습니다."
              : "등록된 배너가 없습니다. 새로 입력해 주세요.",
            "success"
          );

        }catch(error){
          showMessage(
            "배너 불러오기 실패: "+
            error.message,
            "error"
          );
        }finally{
          setBusy(false);
        }
      }


      function canvasToBlob(canvas,quality){
        return new Promise(function(resolve){
          canvas.toBlob(
            function(blob){
              resolve(blob);
            },
            "image/webp",
            quality
          );
        });
      }


      async function compressImage(file){
        const bitmap=await createImageBitmap(file);

        const scale=Math.min(
          1,
          IMAGE_MAX_WIDTH/bitmap.width
        );

        const width=Math.max(
          1,
          Math.round(bitmap.width*scale)
        );

        const height=Math.max(
          1,
          Math.round(bitmap.height*scale)
        );

        const canvas=document.createElement("canvas");
        canvas.width=width;
        canvas.height=height;

        const context=canvas.getContext("2d",{
          alpha:false
        });

        context.fillStyle="#ffffff";
        context.fillRect(0,0,width,height);
        context.imageSmoothingEnabled=true;
        context.imageSmoothingQuality="high";
        context.drawImage(bitmap,0,0,width,height);
        bitmap.close();

        let quality=.9;
        let blob=await canvasToBlob(canvas,quality);

        while(
          blob &&
          blob.size>IMAGE_MAX_BYTES &&
          quality>.45
        ){
          quality=Math.max(.45,quality-.08);
          blob=await canvasToBlob(canvas,quality);
        }

        if(!blob || blob.size>IMAGE_MAX_BYTES){
          throw new Error(
            "500KB 이하로 압축하지 못했습니다."
          );
        }

        return blob;
      }


      function formatBytes(bytes){
        return Math.round(bytes/1024)+"KB";
      }


      async function uploadBannerImage(slot,file){
        const storeId=storeSelect.value;

        if(!storeId){
          throw new Error("매장을 먼저 선택해 주세요.");
        }

        if(!file.type.startsWith("image/")){
          throw new Error("이미지 파일만 선택할 수 있습니다.");
        }

        const status=
          document.getElementById("imageStatus"+slot);

        status.textContent=
          "이미지를 500KB 이하로 최적화하고 있습니다.";

        const blob=await compressImage(file);

        const path=
          storeId+
          "/main-banner/slot-"+
          slot+
          "/"+
          Date.now()+
          "_"+
          Math.random().toString(36).slice(2,9)+
          ".webp";

        status.textContent=
          "최적화 완료("+
          formatBytes(blob.size)+
          "), 업로드 중입니다.";

        const response=await fetch(
          SUPABASE_URL+
          "/storage/v1/object/"+
          STORAGE_BUCKET+
          "/"+
          path,
          {
            method:"POST",
            headers:{
              apikey:SUPABASE_KEY,
              Authorization:"Bearer "+SUPABASE_KEY,
              "Content-Type":"image/webp",
              "x-upsert":"true"
            },
            body:blob
          }
        );

        if(!response.ok){
          throw new Error(await response.text());
        }

        const publicUrl=
          SUPABASE_URL+
          "/storage/v1/object/public/"+
          STORAGE_BUCKET+
          "/"+
          path;

        document.getElementById("imageUrl"+slot).value=
          publicUrl;

        const preview=
          document.getElementById("preview"+slot);

        preview.src=publicUrl;
        preview.style.display="block";

        status.textContent=
          "이미지 업로드 완료 · "+
          formatBytes(blob.size);
      }


      function makeBannerRow(slot){
        return {
          store_id:storeSelect.value,
          slot:slot,
          title:document.getElementById("title"+slot).value.trim(),
          content:document.getElementById("content"+slot).value.trim(),
          url:document.getElementById("url"+slot).value.trim(),
          image_url:document.getElementById("imageUrl"+slot).value.trim(),
          enabled:document.getElementById("enabled"+slot).checked
        };
      }


      function validateRow(row){
        if(!row.enabled)return;

        if(!row.title){
          throw new Error(
            "배너 "+row.slot+" 제목을 입력해 주세요."
          );
        }

        if(!row.content){
          throw new Error(
            "배너 "+row.slot+" 내용을 입력해 주세요."
          );
        }

        if(!row.url){
          throw new Error(
            "배너 "+row.slot+" 연결주소를 입력해 주세요."
          );
        }

        if(
          !/^https?:\/\//i.test(row.url)
        ){
          throw new Error(
            "배너 "+row.slot+
            " 연결주소는 http:// 또는 https://로 시작해야 합니다."
          );
        }
      }


      async function upsertBanner(row){
        const response=await fetch(
          apiUrl(
            "main_banners",
            "?on_conflict=store_id,slot"
          ),
          {
            method:"POST",
            headers:apiHeaders({
              Prefer:
                "resolution=merge-duplicates,return=representation"
            }),
            body:JSON.stringify(row)
          }
        );

        if(!response.ok){
          throw new Error(await response.text());
        }

        return await response.json();
      }


      async function saveBanners(){
        const storeId=storeSelect.value;

        if(!storeId){
          showMessage("매장을 선택해 주세요.","error");
          return;
        }

        const rows=[
          makeBannerRow(1),
          makeBannerRow(2)
        ];

        try{
          rows.forEach(validateRow);

          setBusy(true);
          showMessage("배너를 저장하고 있습니다.","waiting");

          await Promise.all(
            rows.map(upsertBanner)
          );

          showMessage(
            "선택한 매장의 배너 2개가 저장되었습니다.",
            "success"
          );

        }catch(error){
          showMessage(
            "배너 저장 실패: "+
            error.message,
            "error"
          );
        }finally{
          setBusy(false);
        }
      }


      [1,2].forEach(function(slot){
        document.getElementById("file"+slot)
          .addEventListener(
            "change",
            async function(event){
              const file=
                event.target.files &&
                event.target.files[0];

              if(!file)return;

              try{
                setBusy(true);
                await uploadBannerImage(slot,file);
              }catch(error){
                event.target.value="";
                document.getElementById("imageStatus"+slot)
                  .textContent="이미지 업로드 실패";

                showMessage(
                  "배너 "+slot+
                  " 이미지 업로드 실패: "+
                  error.message,
                  "error"
                );
              }finally{
                setBusy(false);
              }
            }
          );
      });


      storeSelect.addEventListener(
        "change",
        loadBanners
      );

      saveButton.addEventListener(
        "click",
        saveBanners
      );

      reloadButton.addEventListener(
        "click",
        loadBanners
      );


      async function start(){
        try{
          await loadStores();

          loadingPanel.hidden=true;
          mainPanel.hidden=false;

        }catch(error){
          loadingPanel.innerHTML=
            '<div class="loading" style="color:#a02020">'+
            "초기화 실패: "+
            String(error.message||error)+
            "</div>";
        }
      }

      start();
    })();
  </script>
</body>
</html>
