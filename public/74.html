<script>
async function s74ShowNativePush(title, body, targetUrl) {
  if (!('Notification' in window)) return false;

  let perm = Notification.permission;
  if (perm !== 'granted' && perm !== 'denied') {
    try { perm = await Notification.requestPermission(); } catch(e){}
  }

  if (perm !== 'granted') return false;

  if ('serviceWorker' in navigator) {
    try {
      let reg = await navigator.serviceWorker.getRegistration();
      if (!reg) {
        reg = await navigator.serviceWorker.register('/sw.js');
      }
      await navigator.serviceWorker.ready;
      await reg.showNotification(title, {
        body: body,
        icon: 'https://mart-platform.vercel.app/icon-192.png',
        badge: 'https://mart-platform.vercel.app/icon-192.png',
        vibrate: [300, 150, 300],
        tag: 'mart-sale-' + Date.now(),
        renotify: true,
        data: { url: targetUrl || location.href }
      });
      return true;
    } catch(swErr) {
      console.warn('SW notification error:', swErr);
    }
  }

  try {
    new Notification(title, { body: body, icon: 'https://mart-platform.vercel.app/icon-192.png' });
    return true;
  } catch(e) {}
  return false;
}

(function () {
  var viewport = document.querySelector('meta[name="viewport"]');
  if (!viewport) {
    viewport = document.createElement('meta');
    viewport.name = 'viewport';
    document.head.appendChild(viewport);
  }
  viewport.content = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
})();
</script>

<div id="store74App">
  <style>

      --green-dark:#0f6a34;

    @keyframes s74Shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .s74-skeleton-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      padding: 10px;
    }
    .s74-skeleton-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: s74Shimmer 1.5s infinite;
    }
    .s74-skeleton-line {
      height: 16px;
      margin-top: 10px;
      border-radius: 6px;
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: s74Shimmer 1.5s infinite;
    }
    .s74-skeleton-line.short {
      width: 55%;
      height: 18px;
    }

    /* [기존 고객 DB 문자 유입 & 단골 특가 알림 배너] */
    .s74-sms-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0 12px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border: 1.5px solid #86efac;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.1);
    }
    .s74-sms-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .s74-sms-icon {
      font-size: 22px;
      flex-shrink: 0;
    }
    .s74-sms-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .s74-sms-text strong {
      font-size: 13.5px;
      font-weight: 900;
      color: #166534;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .s74-sms-text span {
      font-size: 11px;
      color: #15803d;
      margin-top: 2px;
      line-height: 1.25;
      word-break: keep-all;
    }
    .s74-sms-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      border: 0;
      border-radius: 20px;
      background: #16a34a;
      color: #fff;
      font-size: 12.5px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
      white-space: nowrap;
      transition: all 0.15s;
    }
    .s74-sms-btn:hover {
      background: #15803d;
      transform: scale(1.02);
    }
    .s74-sms-btn.done {
      background: #e2e8f0;
      color: #475569;
      box-shadow: none;
      cursor: default;
    }

        padding: 10px 12px;
        gap: 8px;
      }
      .s74-sms-text strong {
        font-size: 12.5px;
      }
      .s74-sms-text span {
        font-size: 10.5px;
      }
      .s74-sms-btn {
        padding: 7px 11px;
        font-size: 11.5px;
      }

      const m=String(row.description||'').match(/(\d{1,2})\s*%/);
      return m?Number(m[1]):0;
    }

    function s74Show(type,button){
      document.querySelectorAll('#store74App .section').forEach(el=>el.classList.remove('active'));
      document.querySelectorAll('#store74App .tab-btn').forEach(el=>el.classList.remove('active'));
      const sec = document.getElementById('s74-'+type);
      if (sec) sec.classList.add('active');
      const b = button || document.querySelector(`.tab-btn[onclick*="${type}"]`);
      if (b) b.classList.add('active');
    }

    function s74ShowSection(type){
      s74Show(type);
    }

    function s74FindProduct(type,id){
      if (type && s74Products[type]) {
        const found = s74Products[type].find(p=>String(p.id)===String(id));
        if (found) return found;
      }
      for (const k of ['today', 'sale', 'group', 'general']) {
        const found = (s74Products[k] || []).find(p=>String(p.id)===String(id));
        if (found) return found;
      }
      return null;
    }

    function s74ChangeQty(type,id,delta){
      const p=s74FindProduct(type,id);
      if(!p)return;
      p.qty=Math.max(1,p.qty+delta);
      const el=document.getElementById('s74qty-'+type+'-'+id);
      if(el)el.textContent=p.qty;
    }

    
    let s74ActiveQtyProd = null;

    function s74CleanStoreName(raw) {
      if (!raw || raw === '우리아파트 제휴마트' || raw === 'store01') return '우리아파트 제휴마트';
      return raw;
    }

    function s74GetSpecText(p) {
      if (p.desc && p.desc.trim()) return p.desc.trim();
      if (p.spec && p.spec.trim()) return p.spec.trim();
      return '규격없음';
    }

    function s74GetPriceText(p) {
      const type = p.type || p.category || 'today';
      if (type === 'group' && (p.group || p.group_price)) return s74Won(s74PriceNumber(p.group || p.group_price));
      if (p.price) {
        const n = s74PriceNumber(p.price);
        return n > 0 ? s74Won(n) : p.price;
      }
      return '가격문의';
    }

    function s74ProductCard(p) {
      const type = p.type || p.category || 'today';
      const spec = s74GetSpecText(p);
      const priceText = s74GetPriceText(p);
      const existing = s74Cart.find(it => (it.category === type || it.type === type) && String(it.id) === String(p.id));
      const isChecked = existing && existing.qty > 0;
      const qtyLabel = isChecked ? '<b>' + existing.qty + '개</b>' : '수량';
      const rawImg = p.img || p.image_url;
      const imgUrl = (rawImg && rawImg.trim()) ? rawImg : 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=300&q=80';
      const badge = p.discount ? '<span class="s74-discount-badge">' + p.discount + '%</span>' : '';

      return `
        <article class="s74-col3-card${isChecked ? ' selected' : ''}" id="s74card-${type}-${p.id}">
          <div class="s74-photo-wrap">
            <img src="${s74Esc(imgUrl)}" alt="${s74Esc(p.name)}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=300&q=80'">
            ${badge}
          </div>
          <div class="s74-card-body">
            <div class="s74-price">${s74Esc(priceText)}</div>
            <div class="s74-spec">${s74Esc(spec)}</div>
            <div class="s74-name" title="${s74Esc(p.name)}">${s74Esc(p.name)}</div>
          </div>
          <div class="s74-qty-bar${isChecked ? ' checked' : ''}" id="s74qtybar-${type}-${p.id}" onclick="s74OpenQtyModal('${type}','${p.id}')">
            <input type="checkbox" id="s74chk-${type}-${p.id}" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); s74ToggleCheck('${type}','${p.id}')">
            <span id="s74lbl-${type}-${p.id}">${qtyLabel}</span>
          </div>
        </article>`;
    }

    function s74GeneralRow(p) {
      return s74ProductCard(p);
    }

    function s74GroupCard(p) {
      return s74ProductCard(p);
    }

    function s74OpenQtyModal(type, id) {
      const p = s74FindProduct(type, id);
      if (!p) return;
      s74ActiveQtyProd = { type: type, id: id, product: p };

      const titleEl = document.getElementById('s74QtyModalTitle');
      if (titleEl) titleEl.textContent = p.name + ' - 수량 선택';

      const existing = s74Cart.find(it => (it.category === type || it.type === type) && String(it.id) === String(id));
      const currentQty = existing ? Number(existing.qty) : 1;

      let listHtml = '';
      for (let i = 1; i <= 15; i++) {
        const isAct = (i === currentQty);
        listHtml += `<div class="s74-qty-modal-item${isAct ? ' active' : ''}" onclick="s74SelectQty(${i})">
          <span>${i}개</span>
          <span class="s74-qty-radio-circle"></span>
        </div>`;
      }
      const listEl = document.getElementById('s74QtyModalList');
      if (listEl) listEl.innerHTML = listHtml;

      const modal = document.getElementById('s74QtyModal');
      if (modal) modal.style.display = 'flex';
    }

    function s74CloseQtyModal(e) {
      if (e && e.target && e.target !== e.currentTarget) return;
      const modal = document.getElementById('s74QtyModal');
      if (modal) modal.style.display = 'none';
      s74ActiveQtyProd = null;
    }

    function s74SelectQty(qty) {
      if (!s74ActiveQtyProd) return;
      const { type, id, product: p } = s74ActiveQtyProd;
      const priceText = (type === 'group') ? (p.group || p.group_price || p.price) : p.price;
      const unitPrice = s74PriceNumber(priceText);
      const chosenQty = Number(qty) || 1;

      const existing = s74Cart.find(it => (it.category === type || it.type === type) && String(it.id) === String(id));
      if (existing) {
        existing.qty = chosenQty;
        existing.unitPrice = unitPrice;
      } else {
        s74Cart.push({
          category: type,
          type: type,
          id: id,
          name: p.name,
          qty: chosenQty,
          unitPrice: unitPrice,
          unitPriceText: priceText || '',
          img: p.img || p.image_url || '',
          image_url: p.img || p.image_url || ''
        });
      }

      s74UpdateCardState(type, id, chosenQty);
      s74UpdateStickyBar();
      s74CloseQtyModal();
      try { s74RenderCart(); } catch(e){}
    }

    function s74ToggleCheck(type, id) {
      const existingIdx = s74Cart.findIndex(it => (it.category === type || it.type === type) && String(it.id) === String(id));
      if (existingIdx >= 0) {
        s74Cart.splice(existingIdx, 1);
        s74UpdateCardState(type, id, 0);
        s74UpdateStickyBar();
        try { s74RenderCart(); } catch(e){}
      } else {
        s74OpenQtyModal(type, id);
      }
    }

    function s74UpdateCardState(type, id, qty) {
      const card = document.getElementById('s74card-' + type + '-' + id);
      const chk = document.getElementById('s74chk-' + type + '-' + id);
      const lbl = document.getElementById('s74lbl-' + type + '-' + id);
      const bar = document.getElementById('s74qtybar-' + type + '-' + id);

      if (qty > 0) {
        if (card) card.classList.add('selected');
        if (chk) chk.checked = true;
        if (lbl) lbl.innerHTML = '<b>' + qty + '개</b>';
        if (bar) bar.classList.add('checked');
      } else {
        if (card) card.classList.remove('selected');
        if (chk) chk.checked = false;
        if (lbl) lbl.textContent = '수량';
        if (bar) bar.classList.remove('checked');
      }
    }

    function s74UpdateStickyBar() {
      const total = s74CartTotal();
      const amtEl = document.getElementById('s74StickyOrderAmt');
      if (amtEl) amtEl.textContent = s74Won(total);
    }

    function s74HandleStickyOrderClick() {
      const total = s74CartTotal();
      if (total <= 0) {
        alert('주문하실 상품의 [수량]을 먼저 체크해 주세요!');
        return;
      }
      s74ShowSection('order');
      s74RenderCart();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function s74LiveFilterProducts(query) {
      const q = (query || '').trim().toLowerCase();
      const allCards = document.querySelectorAll('#store74App .s74-col3-card');
      allCards.forEach(card => {
        const nameEl = card.querySelector('.s74-name');
        const name = nameEl ? nameEl.textContent.toLowerCase() : '';
        if (!q || name.includes(q)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }


    function s74RenderType(type){
      const map={
        today:'s74TodayList',
        sale:'s74SaleList',
        group:'s74GroupList',
        general:'s74GeneralList'
      };
      const target=document.getElementById(map[type]);
      const products=s74Products[type];
      const visible=products.slice(0,s74Visible[type]);

      if(!visible.length){
        const text={
          today:'등록된 오늘특가 상품이 없습니다.',
          sale:'등록된 행사상품이 없습니다.',
          group:'등록된 공동구매 상품이 없습니다.',
          general:'등록된 일반상품이 없습니다.'
        };
        target.innerHTML=`<div class="empty">${text[type]}</div>`;
        return;
      }

      if(type==='group'){
        target.innerHTML=visible.map(s74GroupCard).join('');
      }else if(type==='general'){
        target.innerHTML=visible.map(s74GeneralRow).join('');
      }else{
        target.innerHTML=visible.map(s74ProductCard).join('');
      }
    }

    function s74RenderProducts(){
      s74RenderType('today');
      s74RenderType('sale');
      s74RenderType('group');
      s74RenderType('general');
    }

    async function s74LoadStoreInfo(){
      try{
        const res=await fetch(
          `${S74_SUPABASE_URL}/rest/v1/store_info?store_id=eq.${encodeURIComponent(S74_STORE_ID)}&select=store_name,phone,address,free_delivery_amount`,
          {headers:{apikey:S74_SUPABASE_KEY,Authorization:'Bearer '+S74_SUPABASE_KEY}}
        );
        if(!res.ok)throw new Error(await res.text());

        const rows=await res.json();
        const row=rows[0]||{};
        try{localStorage.setItem(S74_INFO_CACHE_KEY,JSON.stringify(row));}catch(e){}

        document.getElementById('s74StoreName').textContent=s74CleanStoreName(row.store_name);
        document.getElementById('s74OrderStoreName').textContent=s74CleanStoreName(row.store_name);
        document.getElementById('s74OrderPhone').textContent=row.phone?'☎ '+row.phone:'';
        document.getElementById('s74OrderAddress').textContent=row.address?'📍 '+row.address:'';

        s74FreeDelivery=Number(row.free_delivery_amount||0);
        s74RenderCart();
      }catch(error){
        document.getElementById('s74StoreName').textContent=S74_STORE_ID;
        document.getElementById('s74OrderStoreName').textContent=S74_STORE_ID;
      }
    }

    async function s74LoadProducts(){
      try{
        const res=await fetch(
          `${S74_SUPABASE_URL}/rest/v1/store_products_live?store_id=eq.${encodeURIComponent(S74_STORE_ID)}&select=product_no,category,product_name,price,normal_price,group_price,image_url,description,join_count,target_count&order=category.asc,product_no.asc&limit=1000`,
          {headers:{apikey:S74_SUPABASE_KEY,Authorization:'Bearer '+S74_SUPABASE_KEY}}
        );
        if(!res.ok)throw new Error(await res.text());

        const rows=await res.json();

        s74Products.today=rows
          .filter(r=>r.category==='today'&&(r.image_url||r.product_name||r.price||r.description))
          .map(r=>({
            type:'today',
            id:Number(r.product_no),
            name:r.product_name||'상품명 없음',
            price:r.price||'',
            desc:r.description||'',
            img:r.image_url||'',
            discount:s74Discount(r,r.price,r.normal_price||r.original_price||r.regular_price||r.base_price),
            qty:1
          }));

        s74Products.sale=rows
          .filter(r=>r.category==='sale'&&(r.image_url||r.product_name||r.price||r.description))
          .map(r=>({
            type:'sale',
            id:Number(r.product_no),
            name:r.product_name||'상품명 없음',
            price:r.price||'',
            desc:r.description||'',
            img:r.image_url||'',
            discount:s74Discount(r,r.price,r.normal_price||r.original_price||r.regular_price||r.base_price),
            qty:1
          }));

        s74Products.group=rows
          .filter(r=>r.category==='group'&&(r.image_url||r.product_name||r.group_price||r.normal_price))
          .map(r=>({
            type:'group',
            id:Number(r.product_no),
            name:r.product_name||'상품명 없음',
            normal:r.normal_price||'',
            group:r.group_price||'',
            join:Number(r.join_count)||0,
            goal:Number(r.target_count)||0,
            img:r.image_url||'',
            discount:s74Discount(r,r.group_price,r.normal_price),
            qty:1
          }));

        s74Products.general=rows
          .filter(r=>r.category==='general'&&(r.product_name||r.price))
          .map(r=>({
            type:'general',
            id:Number(r.product_no),
            name:r.product_name||'상품명 없음',
            price:r.price||'',
            desc:r.description||'',
            img:r.image_url||'',
            image_url:r.image_url||'',
            qty:1
          }));

        s74Visible={today:S74_BATCH,sale:S74_BATCH,group:S74_BATCH,general:Math.max(200, s74Products.general.length)};
        s74RenderProducts(); if(typeof s74UpdateStickyBar==='function')s74UpdateStickyBar();
        try{localStorage.setItem(S74_CACHE_KEY,JSON.stringify(s74Products));}catch(e){}
      }catch(error){
        ['s74TodayList','s74SaleList','s74GroupList','s74GeneralList'].forEach(id=>{
          document.getElementById(id).innerHTML='<div class="empty">상품을 불러오지 못했습니다.</div>';
        });
      }
    }

    function s74AddCart(type,id){
      const p=s74FindProduct(type,id);
      if(!p)return;

      const priceText=type==='group'?(p.group||p.group_price):p.price;
      const price=s74PriceNumber(priceText);
      const existing=s74Cart.find(item=>(item.category===type||item.type===type)&&String(item.id)===String(id));

      if(existing){
        existing.qty+=p.qty;
      }else{
        s74Cart.push({
          type,
          category:type,
          id,
          name:p.name,
          qty:p.qty,
          unitPrice:price,
          img:p.img||p.image_url||''
        });
      }

      s74UpdateCardState(type, id, existing ? existing.qty : p.qty);
      s74UpdateStickyBar();
      s74RenderCart();
      alert(`${p.name} ${p.qty}개를 장바구니에 담았습니다.`);
    }

    function s74CartTotal(){
      return s74Cart.reduce((sum,item)=>sum+(s74PriceNumber(item.unitPrice)*(Number(item.qty)||1)),0);
    }

    function s74RenderShipping(total){
      const box=document.getElementById('s74Shipping');

      if(s74FreeDelivery<=0){
        box.style.display='none';
        box.innerHTML='';
        return;
      }

      const remaining=Math.max(0,s74FreeDelivery-total);
      const percent=Math.min(100,Math.round((total/s74FreeDelivery)*100));
      const text=remaining>0
        ? `무료배송까지 <b>${s74Won(remaining)}</b> 남았습니다.`
        : '<b>무료배송이 적용되었습니다.</b>';

      box.innerHTML=`
        <div class="shipping-title">🚚 ${text}</div>
        <div class="shipping-bar"><span style="width:${percent}%"></span></div>
        <div class="shipping-meta">
          <span>현재 ${s74Won(total)}</span>
          <span>기준 ${s74Won(s74FreeDelivery)}</span>
        </div>`;
      box.style.display='block';
    }

    function s74RenderCart(){
      const list=document.getElementById('s74CartList');
      const openBtn=document.getElementById('s74OrderOpenBtn');
      const form=document.getElementById('s74OrderForm');

      if(!s74Cart.length){
        list.innerHTML='<div class="empty">장바구니가 비어 있습니다.</div>';
        openBtn.style.display='none';
        form.style.display='none';
        s74RenderShipping(0);
        return;
      }

      const rows=s74Cart.map((item,index)=>{
        const lineTotal=item.unitPrice*item.qty;
        const image=(item.img||item.image_url)
          ? `<img class="cart-thumb" src="${s74Esc(item.img||item.image_url)}" alt="${s74Esc(item.name)}">`
          : '';

        return `
          <div class="cart-row ${(item.img||item.image_url)?'':'no-image'}">
            ${image}
            <div>
              <div class="cart-name">${s74Esc(item.name)}</div>
              <div class="cart-price">${s74Won(item.unitPrice)} × ${item.qty}개 = <b>${s74Won(lineTotal)}</b></div>
              <div class="cart-actions">
                <button type="button" onclick="s74CartMinus(${index})">−</button>
                <button type="button" onclick="s74CartPlus(${index})">＋</button>
                <button type="button" onclick="s74CartRemove(${index})">삭제</button>
              </div>
            </div>
          </div>`;
      }).join('');

      const total=s74CartTotal();
      list.innerHTML=rows+`<div class="cart-total">총 주문금액 ${s74Won(total)}</div>`;
      openBtn.style.display='block';
      s74RenderShipping(total);
      s74UpdateOrderSummary();
    }

    function s74CartMinus(index){
      const item=s74Cart[index];
      if(!item)return;
      const cat = item.category || item.type;
      const id = item.id;
      if(item.qty>1){
        item.qty--;
        s74UpdateCardState(cat, id, item.qty);
      } else {
        s74Cart.splice(index,1);
        s74UpdateCardState(cat, id, 0);
      }
      s74UpdateStickyBar();
      s74RenderCart();
    }

    function s74CartPlus(index){
      if(!s74Cart[index])return;
      s74Cart[index].qty++;
      s74UpdateCardState(s74Cart[index].category || s74Cart[index].type, s74Cart[index].id, s74Cart[index].qty);
      s74UpdateStickyBar();
      s74RenderCart();
    }

    function s74CartRemove(index){
      if(!s74Cart[index])return;
      const cat = s74Cart[index].category || s74Cart[index].type;
      const id = s74Cart[index].id;
      s74Cart.splice(index,1);
      s74UpdateCardState(cat, id, 0);
      s74UpdateStickyBar();
      s74RenderCart();
    }

    function s74OpenOrderForm(){
      if(!s74Cart.length){
        alert('장바구니가 비어 있습니다.');
        return;
      }
      document.getElementById('s74OrderOpenBtn').style.display='none';
      document.getElementById('s74OrderForm').style.display='block';
      document.getElementById('s74OrderComplete').style.display='none';
      s74UpdateOrderSummary();
    }

    function s74CloseOrderForm(){
      document.getElementById('s74OrderForm').style.display='none';
      document.getElementById('s74OrderOpenBtn').style.display=s74Cart.length?'block':'none';
    }

    function s74SelectOrderType(type){
      document.getElementById('s74OrderType').value=type;
      document.getElementById('s74CustomerArea').style.display='block';
      document.getElementById('s74VisitArea').style.display=type==='방문'?'block':'none';
      document.getElementById('s74DeliveryArea').style.display=type==='배달'?'block':'none';
      document.getElementById('s74VisitBtn').classList.toggle('active',type==='방문');
      document.getElementById('s74DeliveryBtn').classList.toggle('active',type==='배달');
      s74UpdateOrderSummary();
    }

    function s74UpdateOrderSummary(){
      const box=document.getElementById('s74OrderSummary');
      if(!box)return;

      const type=document.getElementById('s74OrderType').value||'선택 전';
      const qty=s74Cart.reduce((sum,item)=>sum+item.qty,0);

      box.innerHTML=`
        <b>최종 주문 내용</b><br>
        주문 상품: ${s74Cart.length}종 / 총 ${qty}개<br>
        주문 방법: ${s74Esc(type)}<br>
        총 주문금액: <b>${s74Won(s74CartTotal())}</b>`;
    }

    function s74CompleteOrder(){
      if(!s74Cart.length){
        alert('장바구니가 비어 있습니다.');
        return;
      }

      const type=document.getElementById('s74OrderType').value;
      const name=document.getElementById('s74Name').value.trim();
      const phone=document.getElementById('s74Phone').value.replace(/[^0-9]/g,'');
      const address=document.getElementById('s74Address').value.trim();
      const visitTime=document.getElementById('s74VisitTime').value;
      const entrance=document.getElementById('s74Entrance').value.trim();
      const request=document.getElementById('s74Request').value.trim();

      if(!type){alert('방문 또는 배달을 선택하세요.');return;}
      if(!name){alert('이름을 입력하세요.');return;}
      if(phone.length<10){alert('휴대전화번호를 정확히 입력하세요.');return;}
      if(type==='배달'&&!address){alert('배달 주소를 입력하세요.');return;}

      const order={
        store_id:S74_STORE_ID,
        order_type:type,
        customer_name:name,
        customer_phone:phone,
        delivery_address:type==='배달'?address:'',
        visit_time:type==='방문'?visitTime:'',
        entrance_password:type==='배달'?entrance:'',
        request_message:request,
        items:s74Cart.map(item=>({
          id:item.id,
          type:item.type,
          name:item.name,
          quantity:item.qty,
          unit_price:item.unitPrice,
          line_total:item.unitPrice*item.qty
        })),
        total_amount:s74CartTotal(),
        ordered_at:new Date().toISOString()
      };

      try{
        const saved=JSON.parse(localStorage.getItem('mart_orders')||'[]');
        saved.push(order);
        localStorage.setItem('mart_orders',JSON.stringify(saved));
      }catch(e){}

      s74Cart=[];
      s74RenderCart();
      document.getElementById('s74OrderForm').style.display='none';
      document.getElementById('s74OrderComplete').style.display='block';

      document.getElementById('s74OrderType').value='';
      document.getElementById('s74Name').value='';
      document.getElementById('s74Phone').value='';
      document.getElementById('s74Address').value='';
      document.getElementById('s74VisitTime').value='';
      document.getElementById('s74Entrance').value='';
      document.getElementById('s74Request').value='';
      document.getElementById('s74CustomerArea').style.display='none';
      document.getElementById('s74VisitArea').style.display='none';
      document.getElementById('s74DeliveryArea').style.display='none';
      document.getElementById('s74VisitBtn').classList.remove('active');
      document.getElementById('s74DeliveryBtn').classList.remove('active');
    }

    function s74OpenJoin(id){
      const box=document.getElementById('s74JoinForm'+id);
      if(box)box.style.display='block';
    }

    function s74ToggleJoinAddress(id){
      const type=document.getElementById('s74ReceiveType'+id).value;
      document.getElementById('s74JoinAddress'+id).style.display=type==='배달'?'block':'none';
    }

    function s74CompleteJoin(id){
      const name=document.getElementById('s74JoinName'+id).value.trim();
      const phone=document.getElementById('s74JoinPhone'+id).value.trim();
      const type=document.getElementById('s74ReceiveType'+id).value;
      const address=document.getElementById('s74JoinAddress'+id).value.trim();

      if(!name){alert('이름을 입력하세요.');return;}
      if(!phone){alert('전화번호를 입력하세요.');return;}
      if(!type){alert('방문 또는 배달을 선택하세요.');return;}
      if(type==='배달'&&!address){alert('배달주소를 입력하세요.');return;}

      const p=s74FindProduct('group',id);
      if(p){
        p.join++;
        const count=document.getElementById('s74JoinCount'+id);
        if(count)count.textContent=p.join;
      }

      document.getElementById('s74JoinForm'+id).style.display='none';
      alert('공���구매 참여가 완료되었습니다.');
    }

    async function s74LoadBanners(){
      return;
    }

    function s74ActiveProductType(){
      const section=document.querySelector('#store74App .section.active');
      if(!section)return '';
      const type=section.id.replace('s74-','');
      return ['today','sale','group','general'].includes(type)?type:'';
    }

    function s74LoadNextSix(){
      if(s74LoadingMore)return;

      const type=s74ActiveProductType();
      if(!type)return;

      if(s74Visible[type]>=s74Products[type].length)return;

      const scrollTop=window.pageYOffset||document.documentElement.scrollTop||0;
      const viewport=window.innerHeight||document.documentElement.clientHeight||0;
      const pageHeight=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);

      if(scrollTop+viewport>=pageHeight-420){
        s74LoadingMore=true;
        s74Visible[type]=Math.min(s74Visible[type]+S74_BATCH,s74Products[type].length);
        s74RenderType(type);
        setTimeout(()=>{s74LoadingMore=false;},80);
      }
    }

    window.addEventListener('scroll',s74LoadNextSix,{passive:true});

    /* [기존 고객 DB 문자 유입 & 단골 특가 알림 등록 스크립트] */
    function s74CheckSubscribed() {
      try {
        const isSub = localStorage.getItem('wooriapt_mart_push_subscribed_' + S74_STORE_ID) || localStorage.getItem('wooriapt_mart_push_token');
        const btn = document.getElementById('s74SmsBannerBtn');
        const sub = document.getElementById('s74SmsBannerSub');
        if (isSub && btn) {
          btn.textContent = '✅ 알림 수신중';
          btn.classList.add('done');
          btn.onclick = () => alert('이미 우리 마트 특가 알림을 받고 계십니다. 매주 파격 할인 소식을 전해드립니다!');
          if (sub) sub.textContent = '이미 단골 알림 등록이 완료되었습니다. 이번 주 특가를 확인해보세요!';
        }
      } catch(e) {}
    }

    function s74OpenPushModal() {
      const modal = document.getElementById('s74PushModal');
      if (modal) {
        modal.style.display = 'flex';
        const input = document.getElementById('s74PushPhone');
        if (input) {
          const savedPhone = localStorage.getItem('wooriapt_customer_phone') || '';
          if (savedPhone) input.value = savedPhone;
          setTimeout(() => input.focus(), 100);
        }
      }
    }

    function s74ClosePushModal(e) {
      if (e && e.target && e.target.id === 's74PushModal') {
        document.getElementById('s74PushModal').style.display = 'none';
      }
    }

    async function s74SubmitPushRegistration() {
      const input = document.getElementById('s74PushPhone');
      const status = document.getElementById('s74PushStatus');
      const submitBtn = document.getElementById('s74PushSubmitBtn');
      const phone = String(input.value || '').replace(/[^0-9]/g, '');

      if (!/^01[016789][0-9]{7,8}$/.test(phone)) {
        status.textContent = '올바른 010 휴대전화번호를 입력해주세요.';
        status.className = 's74-modal-status error';
        input.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '알림 권한 확인 중...';
      status.textContent = '브라우저 알림 허용 창이 뜨면 [허용]을 눌러주세요.';
      status.className = 's74-modal-status ok';

      try {
        let perm = 'granted';
        if ('Notification' in window) {
          perm = await Notification.requestPermission();
          if (perm !== 'granted') {
            status.textContent = '알림 허용이 필요합니다. 브라우저 주소창 자물쇠 아이콘에서 알림을 허용해주세요.';
            status.className = 's74-modal-status error';
            submitBtn.disabled = false;
            submitBtn.textContent = '🔔 알림 허용하고 특가 받기 (1초)';
            return;
          }
        }

        // Supabase에 고객 단골 등록 (store_customers 테이블에 안전하게 적립)
        try {
          await fetch(S74_SUPABASE_URL + '/rest/v1/store_customers', {
            method: 'POST',
            headers: {
              apikey: S74_SUPABASE_KEY,
              Authorization: 'Bearer ' + S74_SUPABASE_KEY,
              'Content-Type': 'application/json',
              Prefer: 'resolution=merge-duplicates'
            },
            body: JSON.stringify({
              store_id: S74_STORE_ID,
              phone: phone,
              subscribed_at: new Date().toISOString(),
              channel: 'sms_link'
            })
          });
        } catch(saveErr) {
          console.warn('store_customers save log:', saveErr);
        }

        localStorage.setItem('wooriapt_mart_push_subscribed_' + S74_STORE_ID, 'true');
        localStorage.setItem('wooriapt_customer_phone', phone);

        status.textContent = '✅ 특가 알림 등록이 완료되었습니다!';
        status.className = 's74-modal-status ok';

        setTimeout(() => {
          document.getElementById('s74PushModal').style.display = 'none';
          s74CheckSubscribed();
          alert('🎉 단골 등록 및 특가 알림 설정이 완료되었습니다!\n앞으로 우리 마트의 파격 할인 소식을 실시간 디지털 전단지로 전해드립니다.');
        }, 500);

      } catch (err) {
        status.textContent = err.message || '등록 중 오류가 발생했습니다.';
        status.className = 's74-modal-status error';
        submitBtn.disabled = false;
        submitBtn.textContent = '🔔 알림 허용하고 특가 받기 (1초)';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const pIn = document.getElementById('s74PushPhone');
      if (pIn) {
        pIn.addEventListener('input', (e) => {
          const raw = e.target.value.replace(/[^0-9]/g, '').slice(0, 11);
          if (raw.length <= 3) e.target.value = raw;
          else if (raw.length <= 7) e.target.value = raw.slice(0, 3) + '-' + raw.slice(3);
          else e.target.value = raw.slice(0, 3) + '-' + raw.slice(3, 7) + '-' + raw.slice(7);
        });
      }
      s74CheckSubscribed();
    });

    s74RenderCart();
    s74RestoreCache();
    s74LoadStoreInfo();
    s74LoadProducts();
    s74LoadBanners();
    
    // [서비스워커 및 실시간 웹푸시 리스너 등록]
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then((reg) => {
        console.log('ServiceWorker registered:', reg);
      }).catch(err => console.warn('ServiceWorker error:', err));
    }

    // 웹푸시 브로드캐스트 실시간 감지 및 푸시 팝업 표시
    let s74LastPushBroadcastId = parseInt(localStorage.getItem('s74_last_push_id') || '0', 10);
    
    function s74ShowPushFloatingBanner(b) {
      try {
        var existing = document.getElementById('s74PushBannerAlert');
        if (existing) existing.remove();
        var box = document.createElement('div');
        box.id = 's74PushBannerAlert';
        box.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);width:92%;max-width:440px;background:linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);color:#ffffff;padding:14px 18px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.35);z-index:999999;display:flex;align-items:flex-start;gap:12px;border:1.5px solid #60a5fa;';
        box.innerHTML = '<span style="font-size:24px;line-height:1;">📢</span>' +
          '<div style="flex:1;">' +
          '<div style="font-size:14.5px;font-weight:800;color:#fde047;margin-bottom:4px;">' + (b.product_name || '실시간 세일 알림!') + '</div>' +
          '<div style="font-size:13px;line-height:1.45;color:#f1f5f9;">' + (b.description || '') + '</div>' +
          '</div>' +
          '<button onclick="this.parentElement.remove()" style="background:transparent;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:0 4px;font-weight:bold;">✕</button>';
        document.body.appendChild(box);
        setTimeout(function() { if (box && box.parentElement) box.remove(); }, 12000);
      } catch(e) { console.warn('Banner error:', e); }
    }

    async function s74CheckWebPushBroadcasts() {
      try {
        const res = await fetch(S74_SUPABASE_URL + '/rest/v1/store_products_live?store_id=eq.' + encodeURIComponent(S74_STORE_ID) + '&category=eq.push_broadcast&order=id.desc&limit=1', {
          headers: { apikey: S74_SUPABASE_KEY, Authorization: 'Bearer ' + S74_SUPABASE_KEY }
        });
        if (!res.ok) return;
        const rows = await res.json();
        if (!rows || !rows.length) return;
        const b = rows[0];
        if (b.id > s74LastPushBroadcastId) {
          s74LastPushBroadcastId = b.id;
          localStorage.setItem('s74_last_push_id', String(b.id));

          // 1. 화면 내 상단 실시간 플로팅 알림 배너 표시
          s74ShowPushFloatingBanner(b);

          // 2. OS 시스템 네이티브 푸시 알림 배너 팝업!
          await s74ShowNativePush(
            b.product_name || '📢 [우리아파트 제휴마트] 파격 세일 알림!',
            b.description || '오늘의 세일 전단지가 도착했습니다. 터치하여 확인하세요!',
            location.href
          );
        }
      } catch (e) {
        console.warn('Check push broadcasts error:', e);
      }
    }

    // 5초 주기로 신규 웹푸시 확인
    setInterval(s74CheckWebPushBroadcasts, 5000);
    setTimeout(s74CheckWebPushBroadcasts, 1000);

    s74CheckSubscribed();
  </script>
</div>
