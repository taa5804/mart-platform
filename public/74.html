  <script>
    const S74_SUPABASE_URL='https://dcysjuxyjqtvkihdsjvv.supabase.co';
    const S74_SUPABASE_KEY='sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2';
    const S74_PARAMS=new URLSearchParams(location.search);
    const S74_STORE_ID=S74_PARAMS.get('store_id')||S74_PARAMS.get('store')||'store01';
    const S74_BATCH=6;

    let s74Products={today:[],sale:[],group:[],general:[]};
    let s74Visible={today:S74_BATCH,sale:S74_BATCH,group:S74_BATCH,general:S74_BATCH};
    let s74Cart=[];
    let s74FreeDelivery=0;
    let s74LoadingMore=false;

    function s74Esc(value){
      return String(value??'')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function s74PriceNumber(value){
      const n=Number(String(value??'').replace(/[^0-9]/g,''));
      return Number.isFinite(n)?n:0;
    }

    function s74Won(value){
      return Number(value||0).toLocaleString('ko-KR')+'원';
    }

    function s74Discount(row,saleValue,normalValue){
      const keys=['discount_rate','discount_percent','discount','sale_rate','sale_percent','discountRate'];
      for(const key of keys){
        const n=Number(String(row[key]??'').replace(/[^0-9.]/g,''));
        if(Number.isFinite(n)&&n>0)return Math.round(n);
      }
      const sale=s74PriceNumber(saleValue);
      const normal=s74PriceNumber(normalValue);
      if(normal>0&&sale>0&&normal>sale){
        return Math.round(((normal-sale)/normal)*100);
      }
      const m=String(row.description||'').match(/(\d{1,2})\s*%/);
      return m?Number(m[1]):0;
    }

    function s74Show(type,button){
      document.querySelectorAll('#store74App .section').forEach(el=>el.classList.remove('active'));
      document.querySelectorAll('#store74App .tab-btn').forEach(el=>el.classList.remove('active'));
      document.getElementById('s74-'+type).classList.add('active');
      if(button)button.classList.add('active');
    }

    function s74FindProduct(type,id){
      return s74Products[type].find(p=>p.id===id);
    }

    function s74ChangeQty(type,id,delta){
      const p=s74FindProduct(type,id);
      if(!p)return;
      p.qty=Math.max(1,p.qty+delta);
      const el=document.getElementById('s74qty-'+type+'-'+id);
      if(el)el.textContent=p.qty;
    }

    function s74ProductCard(p){
      const discount=p.discount>0
        ? `<span class="discount"><strong>${p.discount}%</strong><span>할인</span></span>`
        : '';

      return `
        <article class="card">
          <div class="photo-wrap">
            ${p.img?`<img src="${s74Esc(p.img)}" alt="${s74Esc(p.name)}">`:''}
            ${discount}
          </div>
          <div class="card-body">
            <div class="product-name">${s74Esc(p.name)}</div>
            <div class="product-desc">${s74Esc(p.desc||'')}</div>
            <div class="price">${s74Esc(p.price||'')}</div>
            <div class="actions">
              <div class="qty">
                <button type="button" onclick="s74ChangeQty('${p.type}',${p.id},-1)">−</button>
                <span id="s74qty-${p.type}-${p.id}">1</span>
                <button type="button" onclick="s74ChangeQty('${p.type}',${p.id},1)">＋</button>
              </div>
              <button class="cart-btn" type="button" onclick="s74AddCart('${p.type}',${p.id})" aria-label="장바구니 담기">🛒</button>
            </div>
          </div>
        </article>`;
    }

    function s74GroupCard(p){
      const discount=p.discount>0
        ? `<span class="discount"><strong>${p.discount}%</strong><span>할인</span></span>`
        : '';

      return `
        <article class="card">
          <div class="photo-wrap">
            ${p.img?`<img src="${s74Esc(p.img)}" alt="${s74Esc(p.name)}">`:''}
            ${discount}
          </div>
          <div class="card-body">
            <div class="product-name">${s74Esc(p.name)}</div>
            <div class="normal-price">정상가 ${s74Esc(p.normal||'')}</div>
            <div class="group-price">${s74Esc(p.group||'')}</div>
            <div class="group-goal"><span id="s74JoinCount${p.id}">${p.join}</span>명 / 목표 ${p.goal}명</div>
            <div class="actions">
              <div class="qty">
                <button type="button" onclick="s74ChangeQty('group',${p.id},-1)">−</button>
                <span id="s74qty-group-${p.id}">1</span>
                <button type="button" onclick="s74ChangeQty('group',${p.id},1)">＋</button>
              </div>
              <button class="cart-btn" type="button" onclick="s74AddCart('group',${p.id})" aria-label="장바구니 담기">🛒</button>
            </div>

            <button class="join-btn" type="button" onclick="s74OpenJoin(${p.id})">참여하기</button>

            <div id="s74JoinForm${p.id}" class="join-form">
              <input id="s74JoinName${p.id}" type="text" placeholder="이름">
              <input id="s74JoinPhone${p.id}" type="tel" placeholder="전화번호">
              <select id="s74ReceiveType${p.id}" onchange="s74ToggleJoinAddress(${p.id})">
                <option value="">방문/배달 선택</option>
                <option value="방문">방문</option>
                <option value="배달">배달</option>
              </select>
              <textarea id="s74JoinAddress${p.id}" style="display:none" placeholder="배달주소"></textarea>
              <button class="submit-btn" type="button" onclick="s74CompleteJoin(${p.id})">참여완료</button>
            </div>
          </div>
        </article>`;
    }

    function s74GeneralRow(p){
      return `
        <div class="general-row">
          <div>
            <div class="general-name">${s74Esc(p.name)}</div>
            <div class="general-price">${s74Esc(p.price||'')}</div>
          </div>

          <div class="general-qty">
            <button type="button" onclick="s74ChangeQty('general',${p.id},-1)">−</button>
            <b id="s74qty-general-${p.id}">1</b>
            <button type="button" onclick="s74ChangeQty('general',${p.id},1)">＋</button>
          </div>

          <button class="general-cart" type="button" onclick="s74AddCart('general',${p.id})">🛒</button>
        </div>`;
    }

    function s74RenderType(type){
      const map={
        today:'s74TodayList',
        sale:'s74SaleList',
        group:'s74GroupList',
        general:'s74GeneralList'
      };
      const target=document.getElementById(map[type]);
      const products=s74Products[type];
      const visible=products.slice(0,s74Visible[type]);

      if(!visible.length){
        const text={
          today:'등록된 오늘특가 상품이 없습니다.',
          sale:'등록된 행사상품이 없습니다.',
          group:'등록된 공동구매 상품이 없습니다.',
          general:'등록된 일반상품이 없습니다.'
        };
        target.innerHTML=`<div class="empty">${text[type]}</div>`;
        return;
      }

      if(type==='group'){
        target.innerHTML=visible.map(s74GroupCard).join('');
      }else if(type==='general'){
        target.innerHTML=visible.map(s74GeneralRow).join('');
      }else{
        target.innerHTML=visible.map(s74ProductCard).join('');
      }
    }

    function s74RenderProducts(){
      s74RenderType('today');
      s74RenderType('sale');
      s74RenderType('group');
      s74RenderType('general');
    }

    async function s74LoadStoreInfo(){
      try{
        const res=await fetch(
          `${S74_SUPABASE_URL}/rest/v1/store_info?store_id=eq.${encodeURIComponent(S74_STORE_ID)}&select=store_name,phone,address,free_delivery_amount`,
          {headers:{apikey:S74_SUPABASE_KEY,Authorization:'Bearer '+S74_SUPABASE_KEY}}
        );
        if(!res.ok)throw new Error(await res.text());

        const rows=await res.json();
        const row=rows[0]||{};

        document.getElementById('s74StoreName').textContent=row.store_name||S74_STORE_ID;
        document.getElementById('s74OrderStoreName').textContent=row.store_name||S74_STORE_ID;
        document.getElementById('s74OrderPhone').textContent=row.phone?'☎ '+row.phone:'';
        document.getElementById('s74OrderAddress').textContent=row.address?'📍 '+row.address:'';

        s74FreeDelivery=Number(row.free_delivery_amount||0);
        s74RenderCart();
      }catch(error){
        document.getElementById('s74StoreName').textContent=S74_STORE_ID;
        document.getElementById('s74OrderStoreName').textContent=S74_STORE_ID;
      }
    }

    async function s74LoadProducts(){
      try{
        const res=await fetch(
          `${S74_SUPABASE_URL}/rest/v1/store_products_live?store_id=eq.${encodeURIComponent(S74_STORE_ID)}&select=*&order=category.asc,product_no.asc`,
          {headers:{apikey:S74_SUPABASE_KEY,Authorization:'Bearer '+S74_SUPABASE_KEY}}
        );
        if(!res.ok)throw new Error(await res.text());

        const rows=await res.json();

        s74Products.today=rows
          .filter(r=>r.category==='today'&&(r.image_url||r.product_name||r.price||r.description))
          .map(r=>({
            type:'today',
            id:Number(r.product_no),
            name:r.product_name||'상품명 없음',
            price:r.price||'',
            desc:r.description||'',
            img:r.image_url||'',
            discount:s74Discount(r,r.price,r.normal_price||r.original_price||r.regular_price||r.base_price),
            qty:1
          }));

        s74Products.sale=rows
          .filter(r=>r.category==='sale'&&(r.image_url||r.product_name||r.price||r.description))
          .map(r=>({
            type:'sale',
            id:Number(r.product_no),
            name:r.product_name||'상품명 없음',
            price:r.price||'',
            desc:r.description||'',
            img:r.image_url||'',
            discount:s74Discount(r,r.price,r.normal_price||r.original_price||r.regular_price||r.base_price),
            qty:1
          }));

        s74Products.group=rows
          .filter(r=>r.category==='group'&&(r.image_url||r.product_name||r.group_price||r.normal_price))
          .map(r=>({
            type:'group',
            id:Number(r.product_no),
            name:r.product_name||'상품명 없음',
            normal:r.normal_price||'',
            group:r.group_price||'',
            join:Number(r.join_count)||0,
            goal:Number(r.target_count)||0,
            img:r.image_url||'',
            discount:s74Discount(r,r.group_price,r.normal_price),
            qty:1
          }));

        s74Products.general=rows
          .filter(r=>r.category==='general'&&(r.product_name||r.price))
          .map(r=>({
            type:'general',
            id:Number(r.product_no),
            name:r.product_name||'상품명 없음',
            price:r.price||'',
            desc:r.description||'',
            qty:1
          }));

        s74Visible={today:S74_BATCH,sale:S74_BATCH,group:S74_BATCH,general:S74_BATCH};
        s74RenderProducts();
      }catch(error){
        ['s74TodayList','s74SaleList','s74GroupList','s74GeneralList'].forEach(id=>{
          document.getElementById(id).innerHTML='<div class="empty">상품을 불러오지 못했습니다.</div>';
        });
      }
    }

    function s74AddCart(type,id){
      const p=s74FindProduct(type,id);
      if(!p)return;

      const priceText=type==='group'?p.group:p.price;
      const price=s74PriceNumber(priceText);
      const existing=s74Cart.find(item=>item.type===type&&item.id===id);

      if(existing){
        existing.qty+=p.qty;
      }else{
        s74Cart.push({
          type,
          id,
          name:p.name,
          qty:p.qty,
          unitPrice:price,
          img:p.img||''
        });
      }

      s74RenderCart();
      alert(`${p.name} ${p.qty}개를 장바구니에 담았습니다.`);
    }

    function s74CartTotal(){
      return s74Cart.reduce((sum,item)=>sum+(item.unitPrice*item.qty),0);
    }

    function s74RenderShipping(total){
      const box=document.getElementById('s74Shipping');

      if(s74FreeDelivery<=0){
        box.style.display='none';
        box.innerHTML='';
        return;
      }

      const remaining=Math.max(0,s74FreeDelivery-total);
      const percent=Math.min(100,Math.round((total/s74FreeDelivery)*100));
      const text=remaining>0
        ? `무료배송까지 <b>${s74Won(remaining)}</b> 남았습니다.`
        : '<b>무료배송이 적용되었습니다.</b>';

      box.innerHTML=`
        <div class="shipping-title">🚚 ${text}</div>
        <div class="shipping-bar"><span style="width:${percent}%"></span></div>
        <div class="shipping-meta">
          <span>현재 ${s74Won(total)}</span>
          <span>기준 ${s74Won(s74FreeDelivery)}</span>
        </div>`;
      box.style.display='block';
    }

    function s74RenderCart(){
      const list=document.getElementById('s74CartList');
      const openBtn=document.getElementById('s74OrderOpenBtn');
      const form=document.getElementById('s74OrderForm');

      if(!s74Cart.length){
        list.innerHTML='<div class="empty">장바구니가 비어 있습니다.</div>';
        openBtn.style.display='none';
        form.style.display='none';
        s74RenderShipping(0);
        return;
      }

      const rows=s74Cart.map((item,index)=>{
        const lineTotal=item.unitPrice*item.qty;
        const image=item.img
          ? `<img class="cart-thumb" src="${s74Esc(item.img)}" alt="${s74Esc(item.name)}">`
          : '';

        return `
          <div class="cart-row ${item.img?'':'no-image'}">
            ${image}
            <div>
              <div class="cart-name">${s74Esc(item.name)}</div>
              <div class="cart-price">${s74Won(item.unitPrice)} × ${item.qty}개 = <b>${s74Won(lineTotal)}</b></div>
              <div class="cart-actions">
                <button type="button" onclick="s74CartMinus(${index})">−</button>
                <button type="button" onclick="s74CartPlus(${index})">＋</button>
                <button type="button" onclick="s74CartRemove(${index})">삭제</button>
              </div>
            </div>
          </div>`;
      }).join('');

      const total=s74CartTotal();
      list.innerHTML=rows+`<div class="cart-total">총 주문금액 ${s74Won(total)}</div>`;
      openBtn.style.display='block';
      s74RenderShipping(total);
      s74UpdateOrderSummary();
    }

    function s74CartMinus(index){
      const item=s74Cart[index];
      if(!item)return;
      if(item.qty>1)item.qty--;
      else s74Cart.splice(index,1);
      s74RenderCart();
    }

    function s74CartPlus(index){
      if(!s74Cart[index])return;
      s74Cart[index].qty++;
      s74RenderCart();
    }

    function s74CartRemove(index){
      if(!s74Cart[index])return;
      s74Cart.splice(index,1);
      s74RenderCart();
    }

    function s74OpenOrderForm(){
      if(!s74Cart.length){
        alert('장바구니가 비어 있습니다.');
        return;
      }
      document.getElementById('s74OrderOpenBtn').style.display='none';
      document.getElementById('s74OrderForm').style.display='block';
      document.getElementById('s74OrderComplete').style.display='none';
      s74UpdateOrderSummary();
    }

    function s74CloseOrderForm(){
      document.getElementById('s74OrderForm').style.display='none';
      document.getElementById('s74OrderOpenBtn').style.display=s74Cart.length?'block':'none';
    }

    function s74SelectOrderType(type){
      document.getElementById('s74OrderType').value=type;
      document.getElementById('s74CustomerArea').style.display='block';
      document.getElementById('s74VisitArea').style.display=type==='방문'?'block':'none';
      document.getElementById('s74DeliveryArea').style.display=type==='배달'?'block':'none';
      document.getElementById('s74VisitBtn').classList.toggle('active',type==='방문');
      document.getElementById('s74DeliveryBtn').classList.toggle('active',type==='배달');
      s74UpdateOrderSummary();
    }

    function s74UpdateOrderSummary(){
      const box=document.getElementById('s74OrderSummary');
      if(!box)return;

      const type=document.getElementById('s74OrderType').value||'선택 전';
      const qty=s74Cart.reduce((sum,item)=>sum+item.qty,0);

      box.innerHTML=`
        <b>최종 주문 내용</b><br>
        주문 상품: ${s74Cart.length}종 / 총 ${qty}개<br>
        주문 방법: ${s74Esc(type)}<br>
        총 주문금액: <b>${s74Won(s74CartTotal())}</b>`;
    }

    function s74CompleteOrder(){
      if(!s74Cart.length){
        alert('장바구니가 비어 있습니다.');
        return;
      }

      const type=document.getElementById('s74OrderType').value;
      const name=document.getElementById('s74Name').value.trim();
      const phone=document.getElementById('s74Phone').value.replace(/[^0-9]/g,'');
      const address=document.getElementById('s74Address').value.trim();
      const visitTime=document.getElementById('s74VisitTime').value;
      const entrance=document.getElementById('s74Entrance').value.trim();
      const request=document.getElementById('s74Request').value.trim();

      if(!type){alert('방문 또는 배달을 선택하세요.');return;}
      if(!name){alert('이름을 입력하세요.');return;}
      if(phone.length<10){alert('휴대전화번호를 정확히 입력하세요.');return;}
      if(type==='배달'&&!address){alert('배달 주소를 입력하세요.');return;}

      const order={
        store_id:S74_STORE_ID,
        order_type:type,
        customer_name:name,
        customer_phone:phone,
        delivery_address:type==='배달'?address:'',
        visit_time:type==='방문'?visitTime:'',
        entrance_password:type==='배달'?entrance:'',
        request_message:request,
        items:s74Cart.map(item=>({
          id:item.id,
          type:item.type,
          name:item.name,
          quantity:item.qty,
          unit_price:item.unitPrice,
          line_total:item.unitPrice*item.qty
        })),
        total_amount:s74CartTotal(),
        ordered_at:new Date().toISOString()
      };

      try{
        const saved=JSON.parse(localStorage.getItem('mart_orders')||'[]');
        saved.push(order);
        localStorage.setItem('mart_orders',JSON.stringify(saved));
      }catch(e){}

      s74Cart=[];
      s74RenderCart();
      document.getElementById('s74OrderForm').style.display='none';
      document.getElementById('s74OrderComplete').style.display='block';

      document.getElementById('s74OrderType').value='';
      document.getElementById('s74Name').value='';
      document.getElementById('s74Phone').value='';
      document.getElementById('s74Address').value='';
      document.getElementById('s74VisitTime').value='';
      document.getElementById('s74Entrance').value='';
      document.getElementById('s74Request').value='';
      document.getElementById('s74CustomerArea').style.display='none';
      document.getElementById('s74VisitArea').style.display='none';
      document.getElementById('s74DeliveryArea').style.display='none';
      document.getElementById('s74VisitBtn').classList.remove('active');
      document.getElementById('s74DeliveryBtn').classList.remove('active');
    }

    function s74OpenJoin(id){
      const box=document.getElementById('s74JoinForm'+id);
      if(box)box.style.display='block';
    }

    function s74ToggleJoinAddress(id){
      const type=document.getElementById('s74ReceiveType'+id).value;
      document.getElementById('s74JoinAddress'+id).style.display=type==='배달'?'block':'none';
    }

    function s74CompleteJoin(id){
      const name=document.getElementById('s74JoinName'+id).value.trim();
      const phone=document.getElementById('s74JoinPhone'+id).value.trim();
      const type=document.getElementById('s74ReceiveType'+id).value;
      const address=document.getElementById('s74JoinAddress'+id).value.trim();

      if(!name){alert('이름을 입력하세요.');return;}
      if(!phone){alert('전화번호를 입력하세요.');return;}
      if(!type){alert('방문 또는 배달을 선택하세요.');return;}
      if(type==='배달'&&!address){alert('배달주소를 입력하세요.');return;}

      const p=s74FindProduct('group',id);
      if(p){
        p.join++;
        const count=document.getElementById('s74JoinCount'+id);
        if(count)count.textContent=p.join;
      }

      document.getElementById('s74JoinForm'+id).style.display='none';
      alert('공동구매 참여가 완료되었습니다.');
    }

    async function s74LoadBanners(){
      const area=document.getElementById('s74BannerArea');

      try{
        const res=await fetch(
          `${S74_SUPABASE_URL}/rest/v1/main_banners?store_id=eq.${encodeURIComponent(S74_STORE_ID)}&select=slot,title,content,image_url,enabled&order=slot.asc`,
          {headers:{apikey:S74_SUPABASE_KEY,Authorization:'Bearer '+S74_SUPABASE_KEY}}
        );
        if(!res.ok)throw new Error();

        const rows=(await res.json())
          .filter(row=>row.enabled===true&&row.title&&row.content)
          .slice(0,2);

        if(!rows.length){
          area.style.display='none';
          area.innerHTML='';
          return;
        }

        area.innerHTML=`
          <div class="banner-grid ${rows.length===1?'one':''}">
            ${rows.map(row=>`
              <a class="banner-item"
                 href="https://www.wooriaptcd.com"
                 target="_self"
                 style="--banner-image:${row.image_url?`url('${String(row.image_url).replace(/'/g,'%27')}')`:'none'}">
                <span class="banner-text">
                  <span class="banner-label">아파트 분양정보</span>
                  <span class="banner-title">${s74Esc(row.title)}</span>
                  <span class="banner-content">${s74Esc(row.content)}</span>
                </span>
              </a>`).join('')}
          </div>`;

        area.style.display='block';
      }catch(e){
        area.style.display='none';
        area.innerHTML='';
      }
    }

    function s74ActiveProductType(){
      const section=document.querySelector('#store74App .section.active');
      if(!section)return '';
      const type=section.id.replace('s74-','');
      return ['today','sale','group','general'].includes(type)?type:'';
    }

    function s74LoadNextSix(){
      if(s74LoadingMore)return;

      const type=s74ActiveProductType();
      if(!type)return;

      if(s74Visible[type]>=s74Products[type].length)return;

      const scrollTop=window.pageYOffset||document.documentElement.scrollTop||0;
      const viewport=window.innerHeight||document.documentElement.clientHeight||0;
      const pageHeight=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);

      if(scrollTop+viewport>=pageHeight-420){
        s74LoadingMore=true;
        s74Visible[type]=Math.min(s74Visible[type]+S74_BATCH,s74Products[type].length);
        s74RenderType(type);
        setTimeout(()=>{s74LoadingMore=false;},80);
      }
    }

    window.addEventListener('scroll',s74LoadNextSix,{passive:true});

    s74RenderCart();
    s74LoadStoreInfo();
    s74LoadProducts();
    s74LoadBanners();
  </script>
</div>
