<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#16a34a">

  <link
    rel="manifest"
    href="/mart-manifest.webmanifest"
  >

  <title>자동차 QR 등록</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .card {
      display: none;
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.1);
      text-align: center;
    }

    .card.active {
      display: block;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 24px;
      line-height: 1.4;
    }

    p {
      margin: 0 0 20px;
      color: #64748b;
      font-size: 15px;
      line-height: 1.7;
    }

    input {
      width: 100%;
      height: 54px;
      margin-bottom: 12px;
      padding: 0 15px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      outline: none;
      font-size: 17px;
      text-align: center;
    }

    input:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border: 0;
      border-radius: 11px;
      background: #16a34a;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button + button {
      margin-top: 10px;
    }

    button:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }

    .guide {
      margin: 16px 0 20px;
      padding: 18px;
      border-radius: 12px;
      background: #f8fafc;
      color: #334155;
      font-size: 16px;
      line-height: 1.8;
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    .waiting {
      color: #1d4ed8;
    }
  </style>
</head>

<body>

  <section
    id="loadingCard"
    class="card active"
  >
    <h1>자동차 QR 확인 중</h1>
    <p>잠시만 기다려 주세요.</p>
  </section>


  <section
    id="registerCard"
    class="card"
  >
    <h1>자동차 QR 등록</h1>

    <p>
      자동차 QR을 확인하고<br>
      휴대전화번호를 입력해 주세요.
    </p>

    <input
      id="phoneInput"
      type="tel"
      inputmode="numeric"
      autocomplete="tel"
      maxlength="13"
      placeholder="010-0000-0000"
    >

    <button
      id="registerButton"
      type="button"
    >
      다음
    </button>

    <div
      id="registerStatus"
      class="status"
    ></div>
  </section>


  <section
    id="installCard"
    class="card"
  >
    <h1>앱 설치</h1>

    <div class="guide">
      먼저 우리가게 앱을 설치해 주세요.<br>
      설치가 끝난 후 앱을 실행하면<br>
      푸시알림을 허용할 수 있습니다.
    </div>

    <button
      id="installButton"
      type="button"
    >
      앱 설치
    </button>

    <button
      type="button"
      disabled
    >
      푸시알림 — 앱 설치 후 가능
    </button>

    <div
      id="installStatus"
      class="status"
    ></div>
  </section>


  <section
    id="pushCard"
    class="card"
  >
    <h1>푸시알림 허용</h1>

    <div class="guide">
      차량이동 요청을 받기 위해<br>
      푸시알림을 허용해 주세요.
    </div>

    <button
      id="pushButton"
      type="button"
    >
      푸시알림 허용
    </button>

    <div
      id="pushStatus"
      class="status"
    ></div>
  </section>


  <section
    id="completeCard"
    class="card"
  >
    <h1>자동차 QR 등록 완료</h1>

    <p>
      앱 설치와 푸시알림 설정이 완료되었습니다.
    </p>

    <div class="status success">
      자동차 QR 등록이 완료되었습니다.
    </div>

    <button
      id="platformButton"
      type="button"
    >
      마트 플랫폼 열기
    </button>
  </section>


  <section
    id="errorCard"
    class="card"
  >
    <h1>접속할 수 없습니다</h1>

    <p id="errorMessage">
      QR 정보를 확인할 수 없습니다.
    </p>
  </section>


  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>


  <script>
    "use strict";


    const API_URL =
      "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/send-vehicle-push";


    const SUPABASE_KEY =
      "sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2";


    const FIREBASE_CONFIG = {
      apiKey:
        "AIzaSyB3nZdmUrj2wsKPQpOV8dlso7iI7fZo0Hc",

      authDomain:
        "wooriapt-carqr.firebaseapp.com",

      projectId:
        "wooriapt-carqr",

      storageBucket:
        "wooriapt-carqr.firebasestorage.app",

      messagingSenderId:
        "101299637796",

      appId:
        "1:101299637796:web:cb69372592026b7aa192b1"
    };


    const VAPID_KEY =
      "BDtVeUPEh-pooMUUtj4Bd2f5x7EHuWyx4TeunbaQvR8WQs65qwNxryhhORYoS5mxxWMn0GogdgDs1Qod93Vj0jM";


    const PENDING_KEY =
      "wooriapt_vehicle_pending_registration";


    const OWNER_KEY =
      "wooriapt_vehicle_owner";


    const LAST_QR_KEY =
      "wooriapt_vehicle_last_qr";


    const PLATFORM_URL =
      "https://wooriapt.ai.kr/74";


    const params =
      new URLSearchParams(
        window.location.search
      );


    let qrCode =
      cleanQr(
        params.get("qr") ||
        localStorage.getItem(
          LAST_QR_KEY
        )
      );


    let installPrompt =
      null;


    let pushRunning =
      false;


    const loadingCard =
      document.getElementById(
        "loadingCard"
      );


    const registerCard =
      document.getElementById(
        "registerCard"
      );


    const installCard =
      document.getElementById(
        "installCard"
      );


    const pushCard =
      document.getElementById(
        "pushCard"
      );


    const completeCard =
      document.getElementById(
        "completeCard"
      );


    const errorCard =
      document.getElementById(
        "errorCard"
      );


    const phoneInput =
      document.getElementById(
        "phoneInput"
      );


    const registerButton =
      document.getElementById(
        "registerButton"
      );


    const registerStatus =
      document.getElementById(
        "registerStatus"
      );


    const installButton =
      document.getElementById(
        "installButton"
      );


    const installStatus =
      document.getElementById(
        "installStatus"
      );


    const pushButton =
      document.getElementById(
        "pushButton"
      );


    const pushStatus =
      document.getElementById(
        "pushStatus"
      );


    const platformButton =
      document.getElementById(
        "platformButton"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const cards = {
      loading:
        loadingCard,

      register:
        registerCard,

      install:
        installCard,

      push:
        pushCard,

      complete:
        completeCard,

      error:
        errorCard
    };


    function cleanQr(value) {

      return String(
        value || ""
      )
        .trim()
        .toUpperCase()
        .replace(
          /[^A-Z0-9_-]/g,
          ""
        );
    }


    function normalizePhone(value) {

      return String(
        value || ""
      )
        .replace(
          /[^0-9]/g,
          ""
        );
    }


    function isValidPhone(value) {

      return /^01[016789][0-9]{7,8}$/
        .test(
          value
        );
    }


    function formatPhone(value) {

      const number =
        normalizePhone(
          value
        )
          .slice(
            0,
            11
          );


      if (
        number.length <= 3
      ) {
        return number;
      }


      if (
        number.length <= 7
      ) {
        return (
          number.slice(
            0,
            3
          ) +
          "-" +
          number.slice(
            3
          )
        );
      }


      return (
        number.slice(
          0,
          3
        ) +
        "-" +
        number.slice(
          3,
          7
        ) +
        "-" +
        number.slice(
          7
        )
      );
    }


    function isInstalledApp() {

      return (
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        navigator.standalone === true
      );
    }


    function showCard(name) {

      Object
        .values(
          cards
        )
        .forEach(
          card => {
            card.classList.remove(
              "active"
            );
          }
        );


      cards[name]
        .classList
        .add(
          "active"
        );


      window.scrollTo(
        0,
        0
      );
    }


    function setStatus(
      element,
      message,
      type
    ) {

      element.textContent =
        message || "";


      element.className =
        "status";


      if (
        type
      ) {
        element.classList.add(
          type
        );
      }
    }


    function showError(
      message
    ) {

      errorMessage.textContent =
        message;


      showCard(
        "error"
      );
    }


    function savePending(
      qr,
      phone
    ) {

      localStorage.setItem(
        PENDING_KEY,

        JSON.stringify({
          qr_code:
            cleanQr(
              qr
            ),

          owner_phone:
            normalizePhone(
              phone
            )
        })
      );


      localStorage.setItem(
        LAST_QR_KEY,
        cleanQr(
          qr
        )
      );
    }


    function loadPending() {

      try {

        const saved =
          localStorage.getItem(
            PENDING_KEY
          );


        if (
          !saved
        ) {
          return null;
        }


        const data =
          JSON.parse(
            saved
          );


        const qr =
          cleanQr(
            data.qr_code
          );


        const phone =
          normalizePhone(
            data.owner_phone
          );


        if (
          !qr ||
          !isValidPhone(
            phone
          )
        ) {
          return null;
        }


        return {
          qr_code:
            qr,

          owner_phone:
            phone
        };


      } catch {

        return null;
      }
    }


    function clearPending() {

      localStorage.removeItem(
        PENDING_KEY
      );
    }


    function saveOwner(
      qr,
      phone
    ) {

      localStorage.setItem(
        OWNER_KEY,

        JSON.stringify({
          qr_code:
            cleanQr(
              qr
            ),

          owner_phone:
            normalizePhone(
              phone
            )
        })
      );
    }


    function loadOwner() {

      try {

        const saved =
          localStorage.getItem(
            OWNER_KEY
          );


        if (
          !saved
        ) {
          return null;
        }


        const data =
          JSON.parse(
            saved
          );


        if (
          !cleanQr(
            data.qr_code
          ) ||
          !isValidPhone(
            normalizePhone(
              data.owner_phone
            )
          )
        ) {
          return null;
        }


        return data;


      } catch {

        return null;
      }
    }


    async function callApi(
      payload
    ) {

      const response =
        await fetch(
          API_URL,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json",

              Authorization:
                "Bearer " +
                SUPABASE_KEY,

              apikey:
                SUPABASE_KEY
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      const text =
        await response.text();


      let data =
        {};


      try {

        data =
          text
            ? JSON.parse(
                text
              )
            : {};


      } catch {

        data =
          {};
      }


      if (
        !response.ok ||
        data.ok === false ||
        data.success === false
      ) {

        throw new Error(
          data.message ||
          data.error ||
          "등록에 실패했습니다."
        );
      }


      return data;
    }


    async function getServiceWorker() {

      if (
        !(
          "serviceWorker"
          in navigator
        )
      ) {

        throw new Error(
          "이 기기에서는 푸시알림을 사용할 수 없습니다."
        );
      }


      let registration =
        await navigator
          .serviceWorker
          .getRegistration(
            "/"
          );


      if (
        !registration
      ) {

        registration =
          await navigator
            .serviceWorker
            .register(
              "/firebase-messaging-sw.js",
              {
                scope:
                  "/",

                updateViaCache:
                  "none"
              }
            );
      }


      if (
        registration.active
      ) {
        return registration;
      }


      return await navigator
        .serviceWorker
        .ready;
    }


    async function createPushToken() {

      if (
        !(
          "Notification"
          in window
        )
      ) {

        throw new Error(
          "이 기기에서는 푸시알림을 지원하지 않습니다."
        );
      }


      if (
        Notification.permission ===
        "denied"
      ) {

        throw new Error(
          "알림이 차단되어 있습니다. 휴대폰 설정에서 알림을 허용해 주세요."
        );
      }


      if (
        Notification.permission ===
        "default"
      ) {

        const permission =
          await Notification
            .requestPermission();


        if (
          permission !==
          "granted"
        ) {

          throw new Error(
            "푸시알림을 허용해 주세요."
          );
        }
      }


      if (
        !firebase.apps.length
      ) {

        firebase.initializeApp(
          FIREBASE_CONFIG
        );
      }


      const registration =
        await getServiceWorker();


      const messaging =
        firebase.messaging();


      const token =
        await messaging.getToken({
          vapidKey:
            VAPID_KEY,

          serviceWorkerRegistration:
            registration
        });


      if (
        !token
      ) {

        throw new Error(
          "푸시알림 토큰을 발급하지 못했습니다."
        );
      }


      return token;
    }


    function startPage() {

      const pending =
        loadPending();


      const owner =
        loadOwner();


      if (
        isInstalledApp()
      ) {

        if (
          pending
        ) {

          qrCode =
            pending.qr_code;


          showCard(
            "push"
          );


          return;
        }


        if (
          owner
        ) {

          window.location.replace(
            PLATFORM_URL
          );


          return;
        }


        showError(
          "등록할 자동차 QR 정보가 없습니다. 자동차 QR을 다시 스캔해 주세요."
        );


        return;
      }


      if (
        !qrCode
      ) {

        showError(
          "올바른 자동차 QR 주소가 아닙니다."
        );


        return;
      }


      showCard(
        "register"
      );
    }


    phoneInput.addEventListener(
      "input",

      event => {

        event.target.value =
          formatPhone(
            event.target.value
          );
      }
    );


    registerButton.addEventListener(
      "click",

      async () => {

        const phone =
          normalizePhone(
            phoneInput.value
          );


        if (
          !isValidPhone(
            phone
          )
        ) {

          setStatus(
            registerStatus,
            "휴대전화번호를 정확히 입력해 주세요.",
            "error"
          );


          phoneInput.focus();


          return;
        }


        if (
          !qrCode
        ) {

          setStatus(
            registerStatus,
            "자동차 QR을 확인할 수 없습니다.",
            "error"
          );


          return;
        }


        savePending(
          qrCode,
          phone
        );


        try {

          await getServiceWorker();


          showCard(
            "install"
          );


        } catch (
          error
        ) {

          setStatus(
            registerStatus,
            error.message,
            "error"
          );
        }
      }
    );


    window.addEventListener(
      "beforeinstallprompt",

      event => {

        event.preventDefault();


        installPrompt =
          event;
      }
    );


    installButton.addEventListener(
      "click",

      async () => {

        if (
          !loadPending()
        ) {

          setStatus(
            installStatus,
            "자동차 QR 등록정보가 없습니다.",
            "error"
          );


          return;
        }


        if (
          !installPrompt
        ) {

          setStatus(
            installStatus,
            "Chrome 오른쪽 위 메뉴에서 앱 설치를 선택해 주세요.",
            "waiting"
          );


          return;
        }


        installButton.disabled =
          true;


        installButton.textContent =
          "앱 설치 중...";


        try {

          await installPrompt
            .prompt();


          const result =
            await installPrompt
              .userChoice;


          installPrompt =
            null;


          if (
            result.outcome ===
            "accepted"
          ) {

            installButton.textContent =
              "앱 설치 완료";


            setStatus(
              installStatus,
              "설치된 우리가게 앱을 실행해 주세요.",
              "success"
            );


            return;
          }


          installButton.disabled =
            false;


          installButton.textContent =
            "앱 설치";


          setStatus(
            installStatus,
            "앱 설치가 취소되었습니다.",
            "error"
          );


        } catch {

          installButton.disabled =
            false;


          installButton.textContent =
            "앱 설치";


          setStatus(
            installStatus,
            "앱 설치를 다시 시도해 주세요.",
            "error"
          );
        }
      }
    );


    window.addEventListener(
      "appinstalled",

      () => {

        installPrompt =
          null;


        installButton.disabled =
          true;


        installButton.textContent =
          "앱 설치 완료";


        setStatus(
          installStatus,
          "홈 화면의 우리가게 앱을 실행해 주세요.",
          "success"
        );
      }
    );


    pushButton.addEventListener(
      "click",

      async () => {

        if (
          !isInstalledApp()
        ) {

          setStatus(
            pushStatus,
            "설치된 우리가게 앱에서 진행해 주세요.",
            "error"
          );


          return;
        }


        if (
          pushRunning
        ) {
          return;
        }


        const pending =
          loadPending();


        if (
          !pending
        ) {

          setStatus(
            pushStatus,
            "자동차 QR 등록정보가 없습니다.",
            "error"
          );


          return;
        }


        pushRunning =
          true;


        pushButton.disabled =
          true;


        pushButton.textContent =
          "등록 중...";


        setStatus(
          pushStatus,
          "푸시알림을 등록하고 있습니다.",
          "waiting"
        );


        try {

          const token =
            await createPushToken();


          await callApi({
            action:
              "register",

            qr_code:
              pending.qr_code,

            owner_phone:
              pending.owner_phone,

            push_token:
              token,

            platform:
              "web",

            user_agent:
              navigator.userAgent
          });


          saveOwner(
            pending.qr_code,
            pending.owner_phone
          );


          clearPending();


          showCard(
            "complete"
          );


        } catch (
          error
        ) {

          setStatus(
            pushStatus,
            error.message ||
            "푸시알림 등록에 실패했습니다.",
            "error"
          );


          pushButton.disabled =
            false;


          pushButton.textContent =
            "푸시알림 허용";


        } finally {

          pushRunning =
            false;
        }
      }
    );


    platformButton.addEventListener(
      "click",

      () => {

        window.location.href =
          PLATFORM_URL;
      }
    );


    document.addEventListener(
      "DOMContentLoaded",

      () => {

        startPage();
      }
    );
  </script>

</body>
</html>
