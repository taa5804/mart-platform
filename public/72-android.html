<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="/car-manifest.webmanifest">
<title>자동차 QR</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f4f7fb;font-family:Arial,sans-serif;color:#111827}.card{display:none;max-width:430px;margin:30px auto;padding:26px 20px;background:#fff;border-radius:18px;text-align:center;box-shadow:0 8px 30px #0001}.active{display:block}h1{font-size:24px}p{line-height:1.7;color:#64748b}input,button{width:100%;height:54px;margin-top:12px;border-radius:11px;font-size:17px}input{padding:0 14px;border:1px solid #cbd5e1}button{border:0;background:#16a34a;color:#fff;font-weight:700}button:disabled{background:#cbd5e1;color:#64748b}.error{color:#dc2626}.ok{color:#15803d}
</style>
</head>
<body>
<section id="register" class="card"><h1>자동차 QR 등록</h1><p>등록할 자동차 QR을 확인하고<br>휴대전화번호를 입력해 주세요.</p><input id="phone" inputmode="numeric" placeholder="010-0000-0000"><button id="registerBtn">QR 등록하기</button><p id="registerMsg"></p></section>
<section id="install" class="card"><h1>앱 설치</h1><p>앱 설치가 끝난 뒤 푸시 알림을 허용해 주세요.</p><button id="installBtn">앱 설치</button><p id="installMsg"></p></section>
<section id="push" class="card"><h1>푸시 알림 허용</h1><p>QR 등록 완료를 위해 푸시 알림을 허용해 주세요.</p><button id="pushBtn" disabled>앱 설치 완료 대기 중...</button><p id="pushMsg"></p></section>
<section id="done" class="card"><h1>QR 등록 완료</h1><p class="ok">자동차 QR 등록과 푸시 알림 설정이 완료되었습니다.</p></section>
<section id="request" class="card"><h1>차량이동 요청</h1><button id="moveBtn">차량이동요청</button><button id="emergencyBtn">긴급통화</button><p id="requestMsg"></p></section>
<section id="error" class="card"><h1>접속 오류</h1><p id="errorMsg" class="error"></p></section>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
"use strict";
const API="https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/send-vehicle-push",KEY="sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2",VAPID="BDtVeUPEh-pooMUUtj4Bd2f5x7EHuWyx4TeunbaQvR8WQs65qwNxryhhORYoS5mxxWMn0GogdgDs1Qod93Vj0jM",CFG={apiKey:"AIzaSyB3nZdmUrj2wsKPQpOV8dlso7iI7fZo0Hc",authDomain:"wooriapt-carqr.firebaseapp.com",projectId:"wooriapt-carqr",storageBucket:"wooriapt-carqr.firebasestorage.app",messagingSenderId:"101299637796",appId:"1:101299637796:web:cb69372592026b7aa192b1"};
const p=new URLSearchParams(location.search),qr=(p.get("qr")||"").trim().toUpperCase(),PHONE="car_phone",DONE="car_qr_done",PENDING="car_qr_pending";let deferred=null;
const $=id=>document.getElementById(id),show=id=>{document.querySelectorAll(".card").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")},phone=()=>String($("phone").value||"").replace(/[^0-9]/g,"");
function installed(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}function msg(id,t,c=""){const e=$(id);e.textContent=t;e.className=c}
async function api(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+KEY,apikey:KEY},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false||d.success===false)throw Error(d.message||d.error||"처리에 실패했습니다.");return d}
async function token(){if(Notification.permission!=="granted"){const q=await Notification.requestPermission();if(q!=="granted")throw Error("푸시 알림을 허용해 주세요.")}if(!firebase.apps.length)firebase.initializeApp(CFG);const reg=await navigator.serviceWorker.register("/firebase-messaging-sw.js",{scope:"/"});return firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg})}
$("registerBtn").onclick=async()=>{const ph=phone();if(!qr||!/^[A-Z0-9_-]+$/.test(qr)){show("error");msg("errorMsg","자동차 QR 주소가 올바르지 않습니다.");return}if(!/^01[016789][0-9]{7,8}$/.test(ph)){msg("registerMsg","휴대전화번호를 정확히 입력해 주세요.","error");return}localStorage.setItem(PHONE,ph);localStorage.setItem(PENDING,JSON.stringify({qr,phone:ph}));show("install")};
$("installBtn").onclick=async()=>{if(installed()){ $("pushBtn").disabled=false;$("pushBtn").textContent="푸시 알림 허용";show("push");return}if(deferred){await deferred.prompt();deferred=null;msg("installMsg","설치가 끝날 때까지 기다려 주세요.");return}msg("installMsg","브라우저 메뉴에서 홈 화면에 추가 또는 앱 설치를 선택해 주세요.")};
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("installBtn").disabled=false});addEventListener("appinstalled",()=>{$("pushBtn").disabled=false;$("pushBtn").textContent="푸시 알림 허용";show("push")});
$("pushBtn").onclick=async()=>{if($("pushBtn").disabled)return;try{const d=JSON.parse(localStorage.getItem(PENDING)||"null");if(!d)throw Error("등록정보가 없습니다.");await api({action:"register",qr_code:d.qr,owner_phone:d.phone,push_token:await token(),platform:"web",user_agent:navigator.userAgent});localStorage.setItem(DONE,JSON.stringify({qr:d.qr,phone:d.phone}));localStorage.removeItem(PENDING);show("done");setTimeout(()=>location.replace("/74"),700)}catch(e){msg("pushMsg",e.message,"error")}};
$("moveBtn").onclick=async()=>{try{const d=JSON.parse(localStorage.getItem(DONE)||"null");await api({action:"request",qr_code:d.qr});msg("requestMsg","차량이동 요청을 보냈습니다.","ok")}catch(e){msg("requestMsg",e.message,"error")}};$("emergencyBtn").onclick=()=>{const d=JSON.parse(localStorage.getItem(DONE)||"null");api({action:"emergency",qr_code:d.qr}).then(x=>location.href="tel:"+x.owner_phone).catch(e=>msg("requestMsg",e.message,"error"))};
if(installed()&&!p.has("qr")&&localStorage.getItem(DONE)){location.replace("/74")}else if(qr){show("register")}else{show("error");msg("errorMsg","자동차 QR 주소가 없습니다.")}
</script></body></html>
