/*

 * 전화번호
 * =====================================================
 */

function normalizePhone(value){

  return String(
    value || ""
  ).replace(
    /[^0-9]/g,
    ""
  );
}


function validPhone(value){

  return /^01[016789][0-9]{7,8}$/
    .test(value);
}


function formatPhone(value){

  const number =
    normalizePhone(
      value
    ).slice(
      0,
      11
    );

  if(
    number.length <= 3
  ){
    return number;
  }

  if(
    number.length <= 7
  ){
    return (
      number.slice(0,3) +
      "-" +
      number.slice(3)
    );
  }

  return (
    number.slice(0,3) +
    "-" +
    number.slice(3,7) +
    "-" +
    number.slice(7)
  );
}

function getBrowserInfo(){

  const ua =
    navigator.userAgent || "";

  const android =
    /android/i.test(ua);

  const samsung =
    /samsungbrowser/i.test(ua);

  const inApp =
    /kakaotalk|naver\(inapp|naverapp|line\/|instagram|fbav|fban|\bGSA\//i
      .test(ua) ||
    /;\s*wv\)/i.test(ua);

  const chrome =
    android &&
    /chrome\//i.test(ua) &&
    !samsung &&
    !inApp &&
    !/edga|edg\/|opr\/|opera/i.test(ua);

  return {
    android,
    samsung,
    inApp,
    chrome
  };
}


function waitForInstallPrompt(
  timeoutMs = 5000
){

  if(
    deferredInstallPrompt
  ){
    return Promise.resolve(
      deferredInstallPrompt
    );
  }

  return new Promise(
    resolve => {

      let finished =
        false;

      let timer =
        null;

      function done(value){

        if(
          finished
        ){
          return;
        }

        finished =
          true;

        if(
          timer
        ){
          clearTimeout(
            timer
          );
        }

        window.removeEventListener(
          "beforeinstallprompt",
          onPrompt
        );

        resolve(
          value || null
        );
      }

      function onPrompt(event){

        event.preventDefault();

        deferredInstallPrompt =
          event;

        done(
          event
        );
      }

      window.addEventListener(
        "beforeinstallprompt",
        onPrompt,
        {
          once:true
        }
      );

      timer =
        setTimeout(
          () => {
            done(
              deferredInstallPrompt
            );
          },
          timeoutMs
        );
    }
  );
}

        body:

            payload
          )
      }
    );


  const data =
    await response
      .json()
      .catch(
        () => ({})
      );


  if(
    !response.ok ||
    data.ok === false ||
    data.success === false
  ){

    throw new Error(
      data.message ||
      "서버 처리에 실패했습니다."
    );
  }


  return data;
}


/*
 * =====================================================
 * 등록된 QR 차량이동요청
 * 과거 정상 로직 복구:
 * QR 스캔 -> 서버 status -> registered=true -> callCard
 * =====================================================
 */

const CALLER_SESSION_KEY_PREFIX =
  "wooriapt_vehicle_caller_session_";

let callTimer = null;
let currentCallState = {
  request_count: 0,
  next_allowed_at: null,
  emergency_enabled: false
};

function getCallerSessionId(){
  const key =
    CALLER_SESSION_KEY_PREFIX + qrCode;

  let value =
    sessionStorage.getItem(key);

  if(!value){
    value =
      (crypto.randomUUID
        ? crypto.randomUUID()
        : "caller-" + Date.now() + "-" + Math.random().toString(36).slice(2));

    sessionStorage.setItem(
      key,
      value
    );
  }

  return value;
}

function setCallMessage(text,type){
  callMessage.textContent =
    text || "";

  callMessage.className =
    "call-message" +
    (type ? " " + type : "");
}

function remainingSeconds(iso){
  if(!iso){
    return 0;
  }

  return Math.max(
    0,
    Math.ceil(
      (new Date(iso).getTime() - Date.now()) / 1000
    )
  );
}

function renderCallState(state){
  currentCallState = {
    request_count:
      Number(state.request_count || 0),
    next_allowed_at:
      state.next_allowed_at || null,
    emergency_enabled:
      state.emergency_enabled === true
  };

  const count =
    currentCallState.request_count;

  const remain =
    remainingSeconds(
      currentCallState.next_allowed_at
    );

  if(count >= 3){
    moveBtn.disabled = true;
    moveBtn.textContent =
      "차량이동요청 3회 완료";

    emergencyBtn.disabled =
      !currentCallState.emergency_enabled;

    callStatus.textContent =
      currentCallState.emergency_enabled
        ? "3회 요청 완료 · 긴급통화 가능"
        : "3회 요청 완료 · 긴급통화 대기 중";

    return;
  }

  emergencyBtn.disabled = true;

  if(remain > 0){
    const minutes =
      Math.floor(remain / 60);
    const seconds =
      remain % 60;

    moveBtn.disabled = true;
    moveBtn.textContent =
      "다음 요청 " +
      minutes +
      "분 " +
      seconds +
      "초 후";
  }else{
    moveBtn.disabled = false;
    moveBtn.textContent =
      count === 0
        ? "차량이동요청"
        : (count + 1) + "차 차량이동요청";
  }

  callStatus.textContent =
    "차량이동요청 " +
    count +
    "/3회";
}

async function loadVehicleStatus(){
  return await callApi({
    action: "status",
    qr_code: qrCode
  });
}

async function refreshCallState(){
  const status =
    await loadVehicleStatus();

  if(status.registered !== true){
    return false;
  }

  renderCallState(status);
  return true;
}

function startCallStateTimer(){
  if(callTimer){
    clearInterval(callTimer);
  }

  callTimer =
    setInterval(
      async () => {
        try{
          const before =
            currentCallState.emergency_enabled;

          renderCallState(
            currentCallState
          );

          if(
            currentCallState.request_count >= 3 &&
            !before
          ){
            await refreshCallState();
          }
        }catch(error){
          console.warn(
            "차량이동 상태 갱신:",
            error
          );
        }
      },
      1000
    );
}

        emergencyBtn.disabled = false;
      }
    }
  }
);

/*
 * =====================================================
 * 서비스워커
 * =====================================================
 */

function prepareServiceWorker(){

  if(
    serviceWorkerPromise
  ){
    return serviceWorkerPromise;
  }


  serviceWorkerPromise =
    (async()=>{

      if(
        !(
          "serviceWorker"
          in navigator
        )
      ){
        throw new Error(
          "이 브라우저에서는 앱 설치를 지원하지 않습니다."
        );
      }


      let registration =
        await navigator
          .serviceWorker
          .getRegistration(
            "/"
          );


      if(
        !registration
      ){

        registration =
          await navigator
            .serviceWorker
            .register(
              "/firebase-messaging-sw.js?v=" +
              BUILD_VERSION,
              {
                scope:"/",
                updateViaCache:"none"
              }
            );

      }else{

        try{
          await registration.update();
        }catch(error){
          console.warn(
            error
          );
        }
      }


      const ready =
        await navigator
          .serviceWorker
          .ready;


      return (
        ready ||
        registration
      );
    })();


  return serviceWorkerPromise;
}

/*

 */

registerBtn.addEventListener(
  "click",
  async () => {

    const ownerPhone =
      normalizePhone(

    if(
      !validPhone(
        ownerPhone

      setStatus(
        registerStatus,
        "휴대전화번호를 정확히 입력해 주세요.",
        "error"
      );

      phone.focus();

      return;
    }


    if(
      !qrCode
    ){

      setStatus(
        registerStatus,
        "자동차 QR 정보를 확인할 수 없습니다.",
        "error"
      );

      return;
    }


    /*
     * 아직 서버 등록완료 아님.
     * 설치·푸시까지 끝날 때 사용할
     * 임시정보만 보관합니다.
     */

    localStorage.setItem(
      PENDING_KEY,
      JSON.stringify({
        qr_code:
          qrCode,

        owner_phone:
          ownerPhone
      })
    );


    /*
     * 서비스워커 사전 준비
     */
    prepareServiceWorker()
      .catch(
        error =>
          console.warn(
            "서비스워커 준비:",
            error
          )
      );


    showCard(
      installCard
    );
  }
);


/*
 * =====================================================
 * 2. 실제 앱 설치
 * =====================================================
 */

installBtn.addEventListener(
  "click",
  async () => {

    installBtn.disabled =
      true;

    installBtn.textContent =
      "앱 설치 중...";

    setStatus(
      installStatus,
      "표시되는 설치창에서 ‘설치’를 눌러 주세요.",
      "waiting"
    );

    try{

      const pending =
        JSON.parse(
          localStorage.getItem(
            PENDING_KEY
          ) || "null"
        );

      if(
        !pending ||
        !pending.qr_code ||
        !pending.owner_phone
      ){
        throw new Error(
          "휴대전화번호를 다시 입력해 주세요."
        );
      }

      const browser =
        getBrowserInfo();

      if(
        browser.inApp
      ){
        throw new Error(
          "Chrome 또는 삼성 인터넷에서 다시 열어 앱을 설치해 주세요."
        );
      }

      const promptEvent =
        deferredInstallPrompt ||
        await waitForInstallPrompt(
          1500
        );

      if(
        !promptEvent
      ){
        throw new Error(
          "앱 설치창을 불러오지 못했습니다. 다시 시도해 주세요."
        );
      }

      await promptEvent.prompt();

      const result =
        await promptEvent.userChoice;

      deferredInstallPrompt =
        null;

      if(
        result.outcome !==
        "accepted"
      ){
        throw new Error(
          "앱 설치를 완료해 주세요."
        );
      }

      /*
       * 빠른 확인 방식
       * 설치 승인 후 실제 appinstalled 신호가 오면 즉시 푸시 단계로 이동합니다.
       * 3초 안에 신호가 오지 않아도 푸시 단계로 넘기지 않습니다.
       * 설치 화면을 유지하고 실제 설치 완료 신호를 계속 기다립니다.
       */
      setStatus(
        installStatus,
        "앱을 설치하고 있습니다.",
        "waiting"
      );

      if(
        installConfirmed
      ){
        showCard(
          pushCard
        );
        return;
      }

      setTimeout(
        () => {
          if(
            !installConfirmed
          ){
            setStatus(
              installStatus,
              "앱 설치가 진행중입니다. 화면을 닫지 마세요.",
              "waiting"
            );

            installBtn.textContent =
              "앱 설치 진행중...";
          }
        },
        3000
      );

    }catch(error){

      setStatus(
        installStatus,
        error instanceof Error
          ? error.message
          : "앱 설치에 실패했습니다.",
        "error"
      );

      installBtn.disabled =
        false;

      installBtn.textContent =
        "앱 설치";
    }
  }
);


/*
 * =====================================================
 * 3. 푸시 허용
 *
 * 앱 설치 확인 후에만 실행
 * =====================================================
 */

let registrationInProgress = false;

window.addEventListener(
  "beforeunload",
  event => {
    if(!registrationInProgress){
      return;
    }

    event.preventDefault();
    event.returnValue = "";
  }
);


pushBtn.addEventListener(
  "click",
  async () => {

    if(registrationInProgress){
      return;
    }

    registrationInProgress =
      true;

    const registrationStartedAt =
      Date.now();

    pushBtn.disabled =
      true;

    pushBtn.textContent =
      "등록 진행중...";

    const pushTitle =
      pushCard.querySelector(
        "h1"
      );

    const pushGuide =
      pushCard.querySelector(
        ".guide"
      );

    if(pushTitle){
      pushTitle.textContent =
        "등록 진행중";
    }

    if(pushGuide){
      pushGuide.innerHTML =
        "앱 설치 및 차량등록이 진행중입니다.<br>" +
        "완료까지 10초 정도 걸립니다.<br>" +
        "화면을 닫으면 등록이 완료되지 않습니다.";
    }

    setStatus(
      pushStatus,
      "",
      "waiting"
    );


    try{

      const pending =
        JSON.parse(
          localStorage.getItem(
            PENDING_KEY
          ) || "null"
        );


      if(
        !pending ||
        !pending.qr_code ||
        !pending.owner_phone
      ){

        throw new Error(
          "등록 정보를 찾을 수 없습니다."
        );
      }


      /*
       * 철칙:
       * 이번 최초 등록 과정에서 appinstalled 이벤트가 발생하여
       * installConfirmed === true 가 되기 전에는
       * 푸시 등록 및 서버 최종 등록을 절대 진행하지 않습니다.
       *
       * isInstalledApp() 값만으로는 통과시키지 않습니다.
       */
      if(
        !installConfirmed
      ){

        throw new Error(
          "앱 설치 완료가 확인되지 않았습니다. 앱 설치 단계부터 다시 진행해 주세요."
        );
      }


      if(
        !(
          "Notification"
          in window
        )
      ){

        throw new Error(
          "이 기기에서는 알림을 지원하지 않습니다."
        );
      }


      if(
        Notification.permission ===
        "denied"
      ){

        throw new Error(
          "알림 권한이 차단되어 있습니다."
        );
      }


      if(
        Notification.permission !==
        "granted"
      ){

        const permission =
          await Notification
            .requestPermission();


        if(
          permission !==
          "granted"
        ){

          throw new Error(
            "푸시 알림을 허용해 주세요."
          );
        }
      }


      /*
       * Firebase 시작
       */

      if(
        !firebase.apps.length
      ){

        firebase.initializeApp(
          FIREBASE_CONFIG
        );
      }


      const registration =
        await prepareServiceWorker();


      const messaging =
        firebase.messaging();


      const token =
        await messaging.getToken({
          vapidKey:
            VAPID_KEY,

          serviceWorkerRegistration:
            registration
        });


      if(
        !token
      ){

        throw new Error(
          "푸시 토큰을 발급하지 못했습니다."
        );
      }


      /*
       * =================================================
       * 여기에서 처음으로
       * 자동차 QR 최종 등록완료 처리
       *
       * 앱 설치 + 푸시 허용 + 토큰 발급
       * 모두 성공해야 register 실행
       * =================================================
       */

      await callApi({
        action:
          "register",

        registration_type:
          "vehicle",

        qr_code:
          pending.qr_code,

        owner_phone:
          pending.owner_phone,

        push_token:
          token,

        platform:
          "android",

        user_agent:
          navigator.userAgent
      });


      /*
       * 최종 등록 성공 후만
       * 임시 등록정보 제거
       */
      localStorage.removeItem(
        PENDING_KEY
      );

      localStorage.removeItem(
        INSTALL_CONFIRMED_KEY
      );

      localStorage.setItem(
        COMPLETED_KEY_PREFIX + qrCode,
        "1"
      );

      /*
       * 서버의 최종 register 성공 응답까지 받은 뒤에만
       * 등록완료 화면으로 전환합니다.
       */
      /*
       * 등록 완료 화면은 푸시 버튼을 누른 직후 미리 띄우지 않습니다.
       * 휴대폰의 앱 설치 완료 표시가 나올 시간을 확보하기 위해
       * 등록 진행중 화면을 최소 10초 유지한 뒤 완료 화면으로 전환합니다.
       */
      const elapsed =
        Date.now() - registrationStartedAt;

      const remaining =
        Math.max(0, 10000 - elapsed);

      if(remaining > 0){
        await new Promise(
          resolve => setTimeout(resolve, remaining)
        );
      }

      registrationInProgress =
        false;

      showCard(
        completeCard
      );


    }catch(error){

      registrationInProgress =
        false;

      const pushTitle =
        pushCard.querySelector(
          "h1"
        );

      const pushGuide =
        pushCard.querySelector(
          ".guide"
        );

      if(pushTitle){
        pushTitle.textContent =
          "등록을 완료하지 못했습니다";
      }

      if(pushGuide){
        pushGuide.innerHTML =
          "등록이 완료되지 않았습니다.<br>" +
          "아래 버튼을 다시 눌러 주세요.";
      }

      setStatus(
        pushStatus,
        error.message ||
        "푸시 알림 등록에 실패했습니다.",
        "error"
      );


      pushBtn.disabled =
        false;

      pushBtn.textContent =
        "다시 등록하기";
    }
  }
);


/*
 * =====================================================
 * 시작검사
 * =====================================================
 */
(async function startAndroidRegistration(){

  if(
    !qrCode
  ){
    errorText.textContent =
      "올바른 자동차 QR 주소가 아닙니다.";

    showCard(
      errorCard
    );

    return;
  }

  /*
   * 가장 먼저 서버의 실제 등록상태 확인
   * 등록된 QR이면 차량이동요청 화면으로 바로 이동
   */
  try{
    const vehicleStatus =
      await loadVehicleStatus();

    if(
      vehicleStatus.registered === true
    ){
      renderCallState(
        vehicleStatus
      );

      showCard(
        callCard
      );

      startCallStateTimer();
      return;
    }
  }catch(error){
    console.warn(
      "자동차 QR 상태 확인:",
      error
    );
  }

  /*
   * 아래부터는 기존 Android 등록/앱/푸시 로직 그대로
   */
  if(
    localStorage.getItem(
      COMPLETED_KEY_PREFIX + qrCode
    ) === "1"
  ){
    showCard(
      completeCard
    );

    return;
  }

  let startupPending =
    null;

  try{
    startupPending =
      JSON.parse(
        localStorage.getItem(
          PENDING_KEY
        ) || "null"
      );
  }catch(error){
    startupPending =
      null;
  }

  if(
    startupPending &&
    startupPending.qr_code &&
    startupPending.qr_code !== qrCode
  ){
    localStorage.removeItem(
      PENDING_KEY
    );

    localStorage.removeItem(
      INSTALL_CONFIRMED_KEY
    );

    startupPending =
      null;

    installConfirmed =
      false;
  }

  if(
    isInstalledApp() &&
    startupPending &&
    startupPending.qr_code === qrCode
  ){
    showCard(
      pushCard
    );

    return;
  }

  if(
    startupPending &&
    startupPending.qr_code === qrCode
  ){
    showCard(
      installCard
    );

    return;
  }

  showCard(
    registerCard
  );

})()
</script>
