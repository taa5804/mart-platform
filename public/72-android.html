<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="/android-manifest.webmanifest">
<title>자동차 QR Android 등록</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background:#f4f7fb;
  color:#111827;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  display:none;
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:18px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 10px 35px rgba(15,23,42,.1);
}

.card.active{
  display:block;
}

h1{
  font-size:24px;
  margin:0 0 14px;
}

p,
.guide{
  color:#64748b;
  line-height:1.7;
}

input{
  width:100%;
  height:54px;
  border:1px solid #cbd5e1;
  border-radius:11px;
  text-align:center;
  font-size:17px;
  margin:10px 0;
}

button{
  width:100%;
  min-height:54px;
  border:0;
  border-radius:11px;
  background:#16a34a;
  color:#fff;
  font-size:17px;
  font-weight:800;
  margin-top:10px;
}

button:disabled{
  background:#cbd5e1;
  color:#64748b;
}

.status{
  margin-top:14px;
  font-weight:700;
  line-height:1.6;
}

.error{
  color:#dc2626;
}

.success{
  color:#15803d;
}

.waiting{
  color:#1d4ed8;
}
</style>
</head>

<body>

<section id="registerCard" class="card active">
  <h1>자동차 QR 등록</h1>

  <p>
    차량이동 요청을 받을<br>
    휴대전화번호를 입력해 주세요.
  </p>

  <input
    id="phone"
    type="tel"
    inputmode="numeric"
    maxlength="13"
    placeholder="010-0000-0000"
  >

  <button id="registerBtn" type="button">
    등록하기
  </button>

  <div id="registerStatus" class="status"></div>
</section>


<section id="installCard" class="card">
  <h1>Android 앱 설치</h1>

  <div class="guide">
    앱이 실제로 설치되어야<br>
    다음 단계로 진행됩니다.
  </div>

  <button id="installBtn" type="button">
    앱 설치
  </button>

  <div id="installStatus" class="status"></div>
</section>


<section id="pushCard" class="card">
  <h1>푸시 알림 승인</h1>

  <div class="guide">
    차량이동 요청을 받기 위해<br>
    푸시 알림을 허용해 주세요.
  </div>

  <button id="pushBtn" type="button">
    푸시 알림 허용
  </button>

  <div id="pushStatus" class="status"></div>
</section>


<section id="completeCard" class="card">
  <h1>등록 완료</h1>

  <p>
    앱 설치와 푸시 알림 등록이<br>
    모두 완료되었습니다.
  </p>

  <button id="doneBtn" type="button">
    차량이동 화면 확인
  </button>
</section>


<section id="errorCard" class="card">
  <h1>등록할 수 없습니다</h1>
  <p id="errorText"></p>
</section>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<script>
"use strict";


const API_URL =
  "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/send-vehicle-push";

const SUPABASE_KEY =
  "sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2";

const VAPID_KEY =
  "BDtVeUPEh-pooMUUtj4Bd2f5x7EHuWyx4TeunbaQvR8WQs65qwNxryhhORYoS5mxxWMn0GogdgDs1Qod93Vj0jM";


const FIREBASE_CONFIG = {
  apiKey:
    "AIzaSyB3nZdmUrj2wsKPQpOV8dlso7iI7fZo0Hc",

  authDomain:
    "wooriapt-carqr.firebaseapp.com",

  projectId:
    "wooriapt-carqr",

  storageBucket:
    "wooriapt-carqr.firebasestorage.app",

  messagingSenderId:
    "101299637796",

  appId:
    "1:101299637796:web:cb69372592026b7aa192b1"
};


const BUILD_VERSION =
  "20260816-ANDROID-SPLIT-02";

const PENDING_KEY =
  "wooriapt_vehicle_android_pending";

const LAST_QR_KEY =
  "wooriapt_vehicle_android_last_qr";

const params =
  new URLSearchParams(
    window.location.search
  );

function cleanQr(value){
  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9_-]/g,"");
}

function loadPending(){
  try{
    const raw =
      localStorage.getItem(
        PENDING_KEY
      );

    if(!raw){
      return null;
    }

    const data =
      JSON.parse(raw);

    const pendingQr =
      cleanQr(
        data.qr_code
      );

    const pendingPhone =
      String(
        data.owner_phone || ""
      ).replace(
        /[^0-9]/g,
        ""
      );

    if(
      !pendingQr ||
      !/^01[016789][0-9]{7,8}$/.test(
        pendingPhone
      )
    ){
      return null;
    }

    return {
      qr_code:
        pendingQr,
      owner_phone:
        pendingPhone
    };

  }catch(error){
    return null;
  }
}

const startupPending =
  loadPending();

const qrCode =
  cleanQr(
    params.get("qr") ||
    (
      startupPending &&
      startupPending.qr_code
        ? startupPending.qr_code
        : ""
    ) ||
    localStorage.getItem(
      LAST_QR_KEY
    ) ||
    ""
  );

if(qrCode){
  localStorage.setItem(
    LAST_QR_KEY,
    qrCode
  );
}


let deferredInstallPrompt = null;

let installConfirmed = false;

let serviceWorkerPromise = null;


/*
 * =====================================================
 * 화면
 * =====================================================
 */

const registerCard =
  document.getElementById(
    "registerCard"
  );

const installCard =
  document.getElementById(
    "installCard"
  );

const pushCard =
  document.getElementById(
    "pushCard"
  );

const completeCard =
  document.getElementById(
    "completeCard"
  );

const errorCard =
  document.getElementById(
    "errorCard"
  );


const phone =
  document.getElementById(
    "phone"
  );

const registerBtn =
  document.getElementById(
    "registerBtn"
  );

const registerStatus =
  document.getElementById(
    "registerStatus"
  );

const installBtn =
  document.getElementById(
    "installBtn"
  );

const installStatus =
  document.getElementById(
    "installStatus"
  );

const pushBtn =
  document.getElementById(
    "pushBtn"
  );

const pushStatus =
  document.getElementById(
    "pushStatus"
  );

const doneBtn =
  document.getElementById(
    "doneBtn"
  );

const errorText =
  document.getElementById(
    "errorText"
  );


const cards = [
  registerCard,
  installCard,
  pushCard,
  completeCard,
  errorCard
];


function showCard(card){

  cards.forEach(
    item =>
      item.classList.remove(
        "active"
      )
  );

  card.classList.add(
    "active"
  );

  window.scrollTo(
    0,
    0
  );
}


function setStatus(
  element,
  text,
  type
){

  element.textContent =
    text || "";

  element.className =
    "status" +
    (
      type
        ? " " + type
        : ""
    );
}


/*
 * =====================================================
 * 전화번호
 * =====================================================
 */

function normalizePhone(value){

  return String(
    value || ""
  ).replace(
    /[^0-9]/g,
    ""
  );
}


function validPhone(value){

  return /^01[016789][0-9]{7,8}$/
    .test(value);
}


function formatPhone(value){

  const number =
    normalizePhone(
      value
    ).slice(
      0,
      11
    );

  if(
    number.length <= 3
  ){
    return number;
  }

  if(
    number.length <= 7
  ){
    return (
      number.slice(0,3) +
      "-" +
      number.slice(3)
    );
  }

  return (
    number.slice(0,3) +
    "-" +
    number.slice(3,7) +
    "-" +
    number.slice(7)
  );
}


/*
 * =====================================================
 * 설치 상태
 * =====================================================
 */

function isInstalledApp(){

  return (
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||
    window.navigator.standalone === true
  );
}


function getAndroidBrowserInfo(){

  const ua =
    navigator.userAgent || "";

  const android =
    /android/i.test(ua);

  const samsung =
    /samsungbrowser/i.test(ua);

  const inApp =
    /kakaotalk|naver\(inapp|naverapp|line\/|instagram|fbav|fban|\bGSA\//i
      .test(ua) ||
    /;\s*wv\)/i.test(ua);

  const chrome =
    android &&
    /chrome\//i.test(ua) &&
    !samsung &&
    !inApp &&
    !/edga|edg\/|opr\/|opera/i.test(ua);

  return {
    android,
    samsung,
    inApp,
    chrome
  };
}


function openCurrentPageInChrome(){

  const current =
    new URL(
      window.location.href
    );

  const scheme =
    current.protocol.replace(
      ":",
      ""
    );

  const intentUrl =
    "intent://" +
    current.host +
    current.pathname +
    current.search +
    current.hash +
    "#Intent;scheme=" +
    scheme +
    ";package=com.android.chrome" +
    ";S.browser_fallback_url=" +
    encodeURIComponent(
      current.href
    ) +
    ";end";

  window.location.href =
    intentUrl;
}


/*
 * =====================================================
 * 서버
 * =====================================================
 */

async function callApi(payload){

  const response =
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          Authorization:
            "Bearer " +
            SUPABASE_KEY,

          apikey:
            SUPABASE_KEY
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );


  const data =
    await response
      .json()
      .catch(
        () => ({})
      );


  if(
    !response.ok ||
    data.ok === false ||
    data.success === false
  ){

    throw new Error(
      data.message ||
      "서버 처리에 실패했습니다."
    );
  }


  return data;
}


/*
 * =====================================================
 * 서비스워커
 * =====================================================
 */

function prepareServiceWorker(){

  if(
    serviceWorkerPromise
  ){
    return serviceWorkerPromise;
  }


  serviceWorkerPromise =
    (async()=>{

      if(
        !(
          "serviceWorker"
          in navigator
        )
      ){
        throw new Error(
          "이 브라우저에서는 앱 설치를 지원하지 않습니다."
        );
      }


      let registration =
        await navigator
          .serviceWorker
          .getRegistration(
            "/"
          );


      if(
        !registration
      ){

        registration =
          await navigator
            .serviceWorker
            .register(
              "/firebase-messaging-sw.js?v=" +
              BUILD_VERSION,
              {
                scope:"/",
                updateViaCache:"none"
              }
            );

      }else{

        try{
          await registration.update();
        }catch(error){
          console.warn(
            error
          );
        }
      }


      const ready =
        await navigator
          .serviceWorker
          .ready;


      return (
        ready ||
        registration
      );
    })();


  return serviceWorkerPromise;
}


/*
 * =====================================================
 * Android 설치 이벤트
 * =====================================================
 */

window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredInstallPrompt =
      event;


    setStatus(
      installStatus,
      "앱 설치 준비가 완료되었습니다.",
      "success"
    );
  }
);


/*
 * 실제 설치 완료 이벤트
 */
window.addEventListener(
  "appinstalled",
  () => {

    installConfirmed =
      true;

    deferredInstallPrompt =
      null;


    setStatus(
      installStatus,
      "앱 설치가 완료되었습니다.",
      "success"
    );


    setTimeout(
      () => {
        showCard(
          pushCard
        );
      },
      400
    );
  }
);


/*
 * =====================================================
 * 전화번호 입력
 * =====================================================
 */

phone.addEventListener(
  "input",
  event => {

    event.target.value =
      formatPhone(
        event.target.value
      );
  }
);


/*
 * =====================================================
 * 1. 전화번호 확인
 * 아직 QR 등록완료 처리하지 않음
 * =====================================================
 */

registerBtn.addEventListener(
  "click",
  async () => {

    const ownerPhone =
      normalizePhone(
        phone.value
      );


    if(
      !validPhone(
        ownerPhone
      )
    ){

      setStatus(
        registerStatus,
        "휴대전화번호를 정확히 입력해 주세요.",
        "error"
      );

      phone.focus();

      return;
    }


    if(
      !qrCode
    ){

      setStatus(
        registerStatus,
        "자동차 QR 정보를 확인할 수 없습니다.",
        "error"
      );

      return;
    }


    /*
     * 아직 서버 등록완료 아님.
     * 설치·푸시까지 끝날 때 사용할
     * 임시정보만 보관합니다.
     */

    localStorage.setItem(
      PENDING_KEY,
      JSON.stringify({
        qr_code:
          qrCode,

        owner_phone:
          ownerPhone
      })
    );

    localStorage.setItem(
      LAST_QR_KEY,
      qrCode
    );


    /*
     * 서비스워커 사전 준비
     */
    prepareServiceWorker()
      .catch(
        error =>
          console.warn(
            "서비스워커 준비:",
            error
          )
      );


    showCard(
      installCard
    );
  }
);


/*
 * =====================================================
 * 2. 실제 앱 설치
 * =====================================================
 */

installBtn.addEventListener(
  "click",
  async () => {

    /*
     * 과거 S24 정상본 기준:
     * Android에서 실제 Chrome이 아니면
     * 먼저 같은 주소를 Chrome으로 넘깁니다.
     *
     * Chrome으로 넘어간 뒤 전화번호를 입력하고
     * 설치를 진행하게 하므로 브라우저별 저장공간 혼선을 막습니다.
     */
    const browser =
      getAndroidBrowserInfo();

    if(
      browser.android &&
      !browser.chrome &&
      !isInstalledApp()
    ){
      setStatus(
        installStatus,
        "Chrome으로 이동합니다.",
        "waiting"
      );

      installBtn.disabled =
        true;

      installBtn.textContent =
        "Chrome으로 이동 중...";

      openCurrentPageInChrome();

      setTimeout(
        () => {
          installBtn.disabled =
            false;

          installBtn.textContent =
            "앱 설치";

          setStatus(
            installStatus,
            "Chrome이 열리지 않으면 Chrome 앱에서 같은 자동차 QR 주소를 다시 열어 주세요.",
            "error"
          );
        },
        1800
      );

      return;
    }

    /*
     * 이미 설치된 앱 내부라면
     * 바로 푸시 단계
     */
    if(
      isInstalledApp() ||
      installConfirmed
    ){

      showCard(
        pushCard
      );

      return;
    }


    installBtn.disabled =
      true;


    setStatus(
      installStatus,
      "앱 설치창을 확인하고 있습니다.",
      "waiting"
    );


    try{

      /*
       * 설치 이벤트가 조금 늦게
       * 들어오는 경우 대기
       */
      if(
        !deferredInstallPrompt
      ){

        for(
          let i = 0;
          i < 20 &&
          !deferredInstallPrompt;
          i++
        ){

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                250
              )
          );
        }
      }


      if(
        !deferredInstallPrompt
      ){

        throw new Error(
          "Chrome 또는 삼성 인터넷 메뉴에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 선택해 주세요."
        );
      }


      const promptEvent =
        deferredInstallPrompt;


      deferredInstallPrompt =
        null;


      await promptEvent.prompt();


      const result =
        await promptEvent.userChoice;


      if(
        result.outcome !==
        "accepted"
      ){

        throw new Error(
          "앱 설치를 완료해 주세요."
        );
      }


      /*
       * 설치 버튼을 눌렀다는 것만으로
       * 다음 단계로 넘어가지 않습니다.
       */

      setStatus(
        installStatus,
        "설치를 승인했습니다. 실제 설치 완료를 확인하고 있습니다.",
        "waiting"
      );


      /*
       * appinstalled 이벤트 확인
       */
      for(
        let i = 0;
        i < 40 &&
        !installConfirmed;
        i++
      ){

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              250
            )
        );
      }


      if(
        !installConfirmed &&
        !isInstalledApp()
      ){

        throw new Error(
          "앱 실제 설치 완료가 확인되지 않았습니다."
        );
      }


      showCard(
        pushCard
      );


    }catch(error){

      setStatus(
        installStatus,
        error.message ||
        "앱 설치에 실패했습니다.",
        "error"
      );


      installBtn.disabled =
        false;
    }
  }
);


/*
 * =====================================================
 * 3. 푸시 허용
 *
 * 앱 설치 확인 후에만 실행
 * =====================================================
 */

pushBtn.addEventListener(
  "click",
  async () => {

    pushBtn.disabled =
      true;


    setStatus(
      pushStatus,
      "푸시 알림을 등록하고 있습니다.",
      "waiting"
    );


    try{

      const pending =
        JSON.parse(
          localStorage.getItem(
            PENDING_KEY
          ) || "null"
        );


      if(
        !pending ||
        !pending.qr_code ||
        !pending.owner_phone
      ){

        throw new Error(
          "등록 정보를 찾을 수 없습니다."
        );
      }


      /*
       * 철칙:
       * 앱 실제 설치 확인 전에는
       * 서버 등록 금지
       */
      if(
        !isInstalledApp() &&
        !installConfirmed
      ){

        throw new Error(
          "앱 설치 완료가 확인되지 않았습니다."
        );
      }


      if(
        !(
          "Notification"
          in window
        )
      ){

        throw new Error(
          "이 기기에서는 알림을 지원하지 않습니다."
        );
      }


      if(
        Notification.permission ===
        "denied"
      ){

        throw new Error(
          "알림 권한이 차단되어 있습니다."
        );
      }


      if(
        Notification.permission !==
        "granted"
      ){

        const permission =
          await Notification
            .requestPermission();


        if(
          permission !==
          "granted"
        ){

          throw new Error(
            "푸시 알림을 허용해 주세요."
          );
        }
      }


      /*
       * Firebase 시작
       */

      if(
        !firebase.apps.length
      ){

        firebase.initializeApp(
          FIREBASE_CONFIG
        );
      }


      const registration =
        await prepareServiceWorker();


      const messaging =
        firebase.messaging();


      const token =
        await messaging.getToken({
          vapidKey:
            VAPID_KEY,

          serviceWorkerRegistration:
            registration
        });


      if(
        !token
      ){

        throw new Error(
          "푸시 토큰을 발급하지 못했습니다."
        );
      }


      /*
       * =================================================
       * 여기에서 처음으로
       * 자동차 QR 최종 등록완료 처리
       *
       * 앱 설치 + 푸시 허용 + 토큰 발급
       * 모두 성공해야 register 실행
       * =================================================
       */

      await callApi({
        action:
          "register",

        registration_type:
          "vehicle",

        qr_code:
          pending.qr_code,

        owner_phone:
          pending.owner_phone,

        push_token:
          token,

        platform:
          "android",

        user_agent:
          navigator.userAgent
      });


      /*
       * 최종 등록 성공 후만
       * 임시 등록정보 제거
       */
      localStorage.removeItem(
        PENDING_KEY
      );


      showCard(
        completeCard
      );


    }catch(error){

      setStatus(
        pushStatus,
        error.message ||
        "푸시 알림 등록에 실패했습니다.",
        "error"
      );


      pushBtn.disabled =
        false;
    }
  }
);


/*
 * =====================================================
 * 등록 완료 후 자동차 QR 본체로 복귀
 * =====================================================
 */

doneBtn.addEventListener(
  "click",
  () => {

    window.location.replace(
      "/72.html?qr=" +
      encodeURIComponent(
        qrCode
      )
    );
  }
);


/*
 * =====================================================
 * 시작검사
 * =====================================================
 */

(function startAndroidRegistration(){

  /*
   * 설치된 앱이 다시 열린 경우:
   * 등록 대기정보가 있으면 푸시 단계부터 이어서 진행합니다.
   */
  if(
    isInstalledApp() &&
    startupPending &&
    startupPending.qr_code
  ){
    prepareServiceWorker()
      .catch(
        error =>
          console.warn(
            "서비스워커 준비:",
            error
          )
      );

    showCard(
      pushCard
    );

    return;
  }

  /*
   * 이미 등록을 끝낸 뒤 앱 아이콘으로 일반 실행한 경우
   * Android 등록화면에 머물지 않고 우리가게 시작화면으로 이동합니다.
   */
  if(
    isInstalledApp() &&
    !startupPending
  ){
    window.location.replace(
      "/mart-open.html"
    );

    return;
  }

  if(
    !qrCode
  ){
    errorText.textContent =
      "올바른 자동차 QR 주소가 아닙니다.";

    showCard(
      errorCard
    );

    return;
  }

  /*
   * S24/Android는 설치 절차를 Chrome 한 곳으로 고정합니다.
   * 전화번호를 입력하기 전에 Chrome으로 넘기므로
   * 삼성 인터넷과 Chrome의 localStorage가 섞이지 않습니다.
   */
  const browser =
    getAndroidBrowserInfo();

  if(
    browser.android &&
    !browser.chrome
  ){
    openCurrentPageInChrome();
    return;
  }

  showCard(
    registerCard
  );

})();
</script>
