    inputmode="numeric"

  <button id="registerBtn" type="button">

  <div id="registerStatus" class="status"></div>
</section>


<section id="installCard" class="card">

  <div class="guide">

  </div>

  <button id="installBtn" type="button">
    앱 설치
  </button>

</section>


<section id="pushCard" class="card">

  <div class="guide">
    차량이동 요청을 받기 위해<br>
    푸시 알림을 허용해 주세요.
  </div>

  <button id="pushBtn" type="button">
    푸시 알림 허용
  </button>

  <div id="pushStatus" class="status"></div>

  <button
    id="retrySecurityBtn"
    type="button"
    class="secondary hidden"

    다시 확인

</section>


<section id="completeCard" class="card">

    우리가게 앱 설치 및<br>
    자동차 QR 등록이 완료되었습니다.

</section>

</section>

  "BDtVeUPEh-pooMUUtj4Bd2f5x7EHuWyx4TeunbaQvR8WQs65qwNxryhhORYoS5mxxWMn0GogdgDs1Qod93Vj0jM";


const FIREBASE_CONFIG = {

let deferredInstallPrompt = null;

  new Promise(
    resolve => {

    }

let pushTokenPromise =

let installConfirmed = false;

let serviceWorkerPromise = null;


/*

 */

const registerCard =
  document.getElementById(

  );

const installCard =

  );

const pushCard =

  );


const phone =
  document.getElementById(

  );

const registerBtn =

    "registerBtn"
  );

const registerStatus =
  document.getElementById(
    "registerStatus"
  );

const installBtn =
  document.getElementById(
    "installBtn"
  );

const installStatus =
  document.getElementById(
    "installStatus"
  );

const pushBtn =
  document.getElementById(
    "pushBtn"
  );


const retrySecurityBtn =
  document.getElementById(
    "retrySecurityBtn"
  );

const pushStatus =
  document.getElementById(
    "pushStatus"
  );


const errorText =
  document.getElementById(
    "errorText"
  );


const cards = [
  registerCard,
  installCard,
  pushCard,
  completeCard,
  errorCard
];


function showCard(card){

  cards.forEach(
    item =>
      item.classList.remove(
        "active"
      )
  );

  card.classList.add(
    "active"
  );

  window.scrollTo(
    0,
    0
  );
}


function getSecurityErrorMessage(error){

  const message =
    String(
      error?.message || error || ""
    );

  if(
    /denied|차단|permission/i.test(
      message
    )
  ){
    return "알림이 차단되어 있습니다.";
  }

  if(
    /설치창|install|브라우저|Chrome|삼성 인터넷/i.test(
      message
    )
  ){
    return "앱 설치가 차단되어 있습니다.";
  }

  return "";
}


function showSecurityRetry(message){

  setStatus(
    pushStatus,
    message,
    "error"
  );

  retrySecurityBtn.classList.remove(
    "hidden"
  );

  pushBtn.classList.add(
    "hidden"
  );
}


function hideSecurityRetry(){

  retrySecurityBtn.classList.add(
    "hidden"
  );

  pushBtn.classList.remove(
    "hidden"
  );
}


function setStatus(
  element,
  text,
  type
){

  element.textContent =
    text || "";

  element.className =
    "status" +
    (
      type
        ? " " + type
        : ""
    );
}


/*
 * =====================================================
 * 전화번호
 * =====================================================
 */

function normalizePhone(value){

  return String(
    value || ""
  ).replace(
    /[^0-9]/g,
    ""
  );
}


function validPhone(value){

  return /^01[016789][0-9]{7,8}$/
    .test(value);
}


function formatPhone(value){

  const number =
    normalizePhone(
      value
    ).slice(
      0,
      11
    );

  if(
    number.length <= 3
  ){
    return number;
  }

  if(
    number.length <= 7
  ){
    return (
      number.slice(0,3) +
      "-" +
      number.slice(3)
    );
  }

  return (
    number.slice(0,3) +
    "-" +
    number.slice(3,7) +
    "-" +
    number.slice(7)
  );
}


/*
 * =====================================================
 * 설치 상태
 * =====================================================
 */

function isInstalledApp(){

  return (
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||
    window.navigator.standalone === true
  );
}


function getBrowserInfo(){

  const ua =
    navigator.userAgent || "";

  const android =
    /android/i.test(ua);

  const samsung =
    /samsungbrowser/i.test(ua);

  const inApp =
    /kakaotalk|naver\(inapp|naverapp|line\/|instagram|fbav|fban|\bGSA\//i
      .test(ua) ||
    /;\s*wv\)/i.test(ua);

  const chrome =
    android &&
    /chrome\//i.test(ua) &&
    !samsung &&
    !inApp &&
    !/edga|edg\/|opr\/|opera/i.test(ua);

  return {
    android,
    samsung,
    inApp,
    chrome
  };
}


function waitForInstallPrompt(
  timeoutMs = 5000
){

  if(
    deferredInstallPrompt
  ){
    return Promise.resolve(
      deferredInstallPrompt
    );
  }

  return new Promise(
    resolve => {

      let finished =
        false;

      let timer =
        null;

      function done(value){

        if(
          finished
        ){
          return;
        }

        finished =
          true;

        if(
          timer
        ){
          clearTimeout(
            timer
          );
        }

        window.removeEventListener(
          "beforeinstallprompt",
          onPrompt
        );

        resolve(
          value || null
        );
      }

      function onPrompt(event){

        event.preventDefault();

        deferredInstallPrompt =
          event;

        done(
          event
        );
      }

      window.addEventListener(
        "beforeinstallprompt",
        onPrompt,
        {
          once:true
        }
      );

      timer =
        setTimeout(
          () => {
            done(
              deferredInstallPrompt
            );
          },
          timeoutMs
        );
    }
  );
}


/*
 * =====================================================
 * 서버
 * =====================================================
 */

async function callApi(payload){

  const response =
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          Authorization:
            "Bearer " +
            SUPABASE_KEY,

          apikey:
            SUPABASE_KEY
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );


  const data =
    await response
      .json()
      .catch(
        () => ({})
      );


  if(
    !response.ok ||
    data.ok === false ||
    data.success === false
  ){

    throw new Error(
      data.message ||
      "서버 처리에 실패했습니다."
    );
  }


  return data;
}


/*
 * =====================================================
 * 서비스워커
 * =====================================================
 */

function prepareServiceWorker(){

  if(
    serviceWorkerPromise
  ){
    return serviceWorkerPromise;
  }


  serviceWorkerPromise =
    (async()=>{

      if(
        !(
          "serviceWorker"
          in navigator
        )
      ){
        throw new Error(
          "이 브라우저에서는 앱 설치를 지원하지 않습니다."
        );
      }


      let registration =
        await navigator
          .serviceWorker
          .getRegistration(
            "/"
          );


      if(
        !registration
      ){

        registration =
          await navigator
            .serviceWorker
            .register(
              "/firebase-messaging-sw.js?v=" +
              BUILD_VERSION,
              {
                scope:"/",
                updateViaCache:"none"
              }
            );

      }else{

        /*
         * 기존 서비스워커 업데이트는 등록 진행을 막지 않도록
         * 백그라운드에서 실행합니다.
         */
        registration.update()
          .catch(
            error =>
              console.warn(
                error
              )
          );
      }


      const ready =
        await navigator
          .serviceWorker
          .ready;


      return (
        ready ||
        registration
      );
    })();


  return serviceWorkerPromise;
}


/*
 * =====================================================
 * Android 설치 이벤트
 * =====================================================
 */

window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredInstallPrompt =
      event;

    setStatus(
      installStatus,
      "앱 설치 준비가 완료되었습니다.",
      "success"
    );

    installBtn.disabled =
      false;

    installBtn.textContent =
      "앱 설치";
  }
);


/*
 * 실제 앱 설치 완료가 확인된 순간에만
 * 푸시 알림 단계로 이동합니다.
 *
 * 설치창에서 '설치'를 눌렀다는 이유만으로
 * 절대 푸시 단계로 넘어가지 않습니다.
 */
window.addEventListener(
  "appinstalled",
  () => {

    installConfirmed =
      true;

    deferredInstallPrompt =
      null;

    localStorage.setItem(
      INSTALL_CONFIRMED_KEY,
      "1"
    );

    if(
      installCompletedPromiseResolve
    ){
      installCompletedPromiseResolve(
        true
      );

      installCompletedPromiseResolve =
        null;
    }
  }
);


/*
 * Firebase 앱 초기화도 페이지가 열리는 즉시 미리 완료합니다.
 */
if(
  !firebase.apps.length
){
  firebase.initializeApp(
    FIREBASE_CONFIG
  );
}

/*
 * =====================================================
 * 설치 사전 준비
 * 페이지가 열리는 즉시 Service Worker와 설치 프롬프트를 준비합니다.
 * =====================================================
 */
prepareServiceWorker()
  .catch(
    error =>
      console.warn(
        "서비스워커 사전 준비:",
        error
      )
  );

waitForInstallPrompt(
  1500
).catch(
  () => null
);


/*
 * =====================================================
 * 전화번호 입력
 * =====================================================
 */

phone.addEventListener(
  "input",
  event => {

    event.target.value =
      formatPhone(
        event.target.value
      );
  }
);


/*
 * =====================================================
 * 1. 전화번호 확인
 * 아직 QR 등록완료 처리하지 않음
 * =====================================================
 */

registerBtn.addEventListener(
  "click",
  async () => {

    const ownerPhone =
      normalizePhone(
        phone.value
      );


    if(
      !validPhone(
        ownerPhone
      )
    ){

      setStatus(
        registerStatus,
        "휴대전화번호를 정확히 입력해 주세요.",
        "error"
      );

      phone.focus();

      return;
    }


    if(
      !qrCode
    ){

      setStatus(
        registerStatus,
        "자동차 QR 정보를 확인할 수 없습니다.",
        "error"
      );

      return;
    }


    /*
     * 아직 서버 등록완료 아님.
     * 설치·푸시까지 끝날 때 사용할
     * 임시정보만 보관합니다.
     */

    localStorage.setItem(
      PENDING_KEY,
      JSON.stringify({
        qr_code:
          qrCode,

        owner_phone:
          ownerPhone
      })
    );


    /*
     * 서비스워커 사전 준비
     */
    prepareServiceWorker()
      .catch(
        error =>
          console.warn(
            "서비스워커 준비:",
            error
          )
      );


    showCard(
      installCard
    );
  }
);


/*
 * =====================================================
 * 2. 실제 앱 설치
 * =====================================================
 */

installBtn.addEventListener(
  "click",
  async () => {

    installBtn.disabled =
      true;

    installBtn.textContent =
      "앱 설치 중...";

    setStatus(
      installStatus,
      "표시되는 설치창에서 ‘설치’를 눌러 주세요.",
      "waiting"
    );

    try{

      const registrationStartedAt =
        performance.now();

      console.log(
        "[자동차QR] 푸시 등록 시작"
      );

      const pending =
        JSON.parse(
          localStorage.getItem(
            PENDING_KEY
          ) || "null"
        );

      if(
        !pending ||
        !pending.qr_code ||
        !pending.owner_phone
      ){
        throw new Error(
          "휴대전화번호를 다시 입력해 주세요."
        );
      }

      const browser =
        getBrowserInfo();

      if(
        browser.inApp
      ){
        throw new Error(
          "Chrome 또는 삼성 인터넷에서 다시 열어 앱을 설치해 주세요."
        );
      }

      const promptEvent =
        deferredInstallPrompt ||
        await waitForInstallPrompt(
          1500
        );

      if(
        !promptEvent
      ){
        throw new Error(
          "앱 설치창을 불러오지 못했습니다. 다시 시도해 주세요."
        );
      }

      await promptEvent.prompt();

      const result =
        await promptEvent.userChoice;

      deferredInstallPrompt =
        null;

      if(
        result.outcome !==
        "accepted"
      ){
        throw new Error(
          "앱 설치를 완료해 주세요."
        );
      }

      /*
       * 설치 승인 직후 즉시 푸시 허용 화면으로 이동합니다.
       * 실제 앱 설치는 Android가 뒤에서 계속 진행합니다.
       */
      showCard(
        pushCard
      );

      setStatus(
        pushStatus,
        "푸시 알림을 허용해 주세요.",
        "waiting"
      );

    }catch(error){

      setStatus(
        installStatus,
        error instanceof Error
          ? error.message
          : "앱 설치에 실패했습니다.",
        "error"
      );

      installBtn.disabled =
        false;

      installBtn.textContent =
        "앱 설치";
    }
  }
);


/*
 * =====================================================
 * 3. 푸시 허용
 *
 * 앱 설치 확인 후에만 실행
 * =====================================================
 */

pushBtn.addEventListener(
  "click",
  async () => {

    hideSecurityRetry();

    pushBtn.disabled =
      true;

    pushBtn.textContent =
      "등록 진행 중...";

    setStatus(
      pushStatus,
      "완료까지 10초정도 걸립니다.\n화면을 닫으면 등록이 완료되지 않읍니다.\n앱설치 및 차량등록이 진행중입니다.",
      "waiting"
    );

    try{

      const pending =
        JSON.parse(
          localStorage.getItem(
            PENDING_KEY
          ) || "null"
        );

      if(
        !pending ||
        !pending.qr_code ||
        !pending.owner_phone
      ){
        throw new Error(
          "등록 정보를 찾을 수 없습니다."
        );
      }

      if(
        !(
          "Notification"
          in window
        )
      ){
        throw new Error(
          "이 기기에서는 알림을 지원하지 않습니다."
        );
      }

      if(
        Notification.permission ===
        "denied"
      ){
        throw new Error(
          "알림 권한이 차단되어 있습니다."
        );
      }

      if(
        Notification.permission !==
        "granted"
      ){
        const permission =
          await Notification
            .requestPermission();

        if(
          permission !==
          "granted"
        ){
          throw new Error(
            "푸시 알림을 허용해 주세요."
          );
        }
      }

      /*
       * 푸시 토큰 발급을 즉시 시작합니다.
       * 동시에 Android의 앱 설치 완료(appinstalled)를 기다립니다.
       */
      pushTokenPromise =
        (async () => {

          if(
            !firebase.apps.length
          ){
            firebase.initializeApp(
              FIREBASE_CONFIG
            );
          }

          const registration =
            await prepareServiceWorker();

          const messaging =
            firebase.messaging();

          const token =
            await messaging.getToken({
              vapidKey:
                VAPID_KEY,

              serviceWorkerRegistration:
                registration
            });

          if(
            !token
          ){
            throw new Error(
              "푸시 토큰을 발급하지 못했습니다."
            );
          }

          return token;
        })();

      /*
       * 설치창에서 사용자가 '설치'를 승인한 상태이므로
       * Android의 appinstalled 완료 이벤트는 더 이상 기다리지 않습니다.
       * 푸시 토큰이 발급되는 즉시 자동차 QR 최종 등록을 진행합니다.
       */
      const token =
        await pushTokenPromise;

      console.log(
        "[자동차QR] FCM 토큰 완료:",
        Math.round(
          performance.now() -
          registrationStartedAt
        ) + "ms"
      );

      /*
       * 푸시 토큰 발급이 끝나면 즉시
       * 자동차 QR을 서버에 최종 등록합니다.
       */
      const serverStartedAt =
        performance.now();

      await callApi({
        action:
          "register",

        registration_type:
          "vehicle",

        qr_code:
          pending.qr_code,

        owner_phone:
          pending.owner_phone,

        push_token:
          token,

        platform:
          "android",

        user_agent:
          navigator.userAgent
      });

      console.log(
        "[자동차QR] 서버 등록 완료:",
        Math.round(
          performance.now() -
          serverStartedAt
        ) + "ms",
        "전체:",
        Math.round(
          performance.now() -
          registrationStartedAt
        ) + "ms"
      );

      localStorage.removeItem(
        PENDING_KEY
      );

      localStorage.removeItem(
        INSTALL_CONFIRMED_KEY
      );

      localStorage.setItem(
        COMPLETED_KEY_PREFIX +
          pending.qr_code,
        "1"
      );

      showCard(
        completeCard
      );

    }catch(error){

      const securityMessage =
        getSecurityErrorMessage(
          error
        );

      if(
        securityMessage
      ){
        showSecurityRetry(
          securityMessage
        );
      }else{
        setStatus(
          pushStatus,
          error instanceof Error
            ? error.message
            : "등록에 실패했습니다.",
          "error"
        );

        pushBtn.disabled =
          false;

        pushBtn.textContent =
          "푸시 알림 허용";
      }
    }
  }
);


retrySecurityBtn.addEventListener(
  "click",
  async () => {

    retrySecurityBtn.disabled =
      true;

    retrySecurityBtn.textContent =
      "확인 중...";

    try{

      if(
        !(
          "Notification"
          in window
        )
      ){
        throw new Error(
          "이 기기에서는 알림을 지원하지 않습니다."
        );
      }

      if(
        Notification.permission ===
        "denied"
      ){
        setStatus(
          pushStatus,
          "알림이 차단되어 있습니다.",
          "error"
        );

        return;
      }

      hideSecurityRetry();

      pushBtn.disabled =
        false;

      pushBtn.textContent =
        "푸시 알림 허용";

      setStatus(
        pushStatus,
        "설정이 확인되었습니다.",
        "success"
      );

    }finally{

      retrySecurityBtn.disabled =
        false;

      retrySecurityBtn.textContent =
        "다시 확인";
    }
  }
);


/*
 * =====================================================
 * 시작검사
 * =====================================================
 */
(function startAndroidRegistration(){

  if(
    !qrCode
  ){
    errorText.textContent =
      "올바른 자동차 QR 주소가 아닙니다.";

    showCard(
      errorCard
    );

    return;
  }

  /*
   * 최종 등록 완료된 QR은 푸시 승인 화면을 다시 열지 않습니다.
   */
  if(
    localStorage.getItem(
      COMPLETED_KEY_PREFIX +
        qrCode
    ) === "1"
  ){
    showCard(
      completeCard
    );

    return;
  }

  let startupPending =
    null;

  try{
    startupPending =
      JSON.parse(
        localStorage.getItem(
          PENDING_KEY
        ) || "null"
      );
  }catch(error){
    startupPending =
      null;
  }

  /*
   * 다른 QR의 이전 pending은 제거
   */
  if(
    startupPending &&
    startupPending.qr_code &&
    startupPending.qr_code !== qrCode
  ){
    localStorage.removeItem(
      PENDING_KEY
    );

    localStorage.removeItem(
      INSTALL_CONFIRMED_KEY
    );

    startupPending =
      null;

    installConfirmed =
      false;
  }

  /*
   * 같은 QR 등록 도중이면 설치 단계로 이어갑니다.
   */
  if(
    startupPending &&
    startupPending.qr_code === qrCode
  ){
    showCard(
      installCard
    );

    return;
  }

  /*
   * 새 QR은 반드시 전화번호 등록부터 시작
   */
  showCard(
    registerCard
  );

})();
</script>
