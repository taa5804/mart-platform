<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="/android-manifest.webmanifest">

<title>자동차 QR Android 등록</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background:#f4f7fb;
  color:#111827;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  display:none;
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:18px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 10px 35px rgba(15,23,42,.1);
}

.card.active{
  display:block;
}

h1{
  font-size:24px;
  margin:0 0 14px;
}

p,
.guide{
  color:#64748b;
  line-height:1.7;
}

input{
  width:100%;
  height:54px;
  border:1px solid #cbd5e1;
  border-radius:11px;
  text-align:center;
  font-size:17px;
  margin:10px 0;
}

button{
  width:100%;
  min-height:54px;
  border:0;
  border-radius:11px;
  background:#16a34a;
  color:#fff;
  font-size:17px;
  font-weight:800;
  margin-top:10px;
}

button:disabled{
  background:#cbd5e1;
  color:#64748b;
}

.status{
  margin-top:14px;
  font-weight:700;
  line-height:1.6;
  white-space:pre-line;
}

.error{
  color:#dc2626;
}

.success{
  color:#15803d;
}

.waiting{
  color:#1d4ed8;
}
</style>
</head>

<body>

<section id="registerCard" class="card active">
  <h1>자동차 QR 등록</h1>

  <p>
    차량이동 요청을 받을<br>
    휴대전화번호를 입력해 주세요.
  </p>

  <input
    id="phone"
    type="tel"
    inputmode="numeric"
    maxlength="13"
    placeholder="010-0000-0000"
  >

  <button id="registerBtn" type="button">
    등록하기
  </button>

  <div id="registerStatus" class="status"></div>
</section>


<section id="installCard" class="card">
  <h1>Android 앱 설치</h1>

  <div class="guide">
    아래 버튼을 눌러<br>
    우리가게 앱을 설치해 주세요.
  </div>

  <button id="installBtn" type="button" disabled>
    앱 설치 준비 중
  </button>

  <div id="installStatus" class="status"></div>
</section>


<section id="pushCard" class="card">
  <h1>푸시 알림 승인</h1>

  <div class="guide">
    차량이동 요청을 받기 위해<br>
    푸시 알림을 허용해 주세요.
  </div>

  <button id="pushBtn" type="button" disabled>
    앱 설치 완료 대기 중
  </button>

  <div id="pushStatus" class="status"></div>
</section>


<section id="completeCard" class="card">
  <h1>등록 완료</h1>

  <p>
    앱 설치와 푸시 알림 등록이<br>
    모두 완료되었습니다.
  </p>

  <div class="status success">
    등록이 완료되었습니다.<br>
    이제 차량이동 요청 알림을 받을 수 있습니다.
  </div>
</section>


<section id="errorCard" class="card">
  <h1>등록할 수 없습니다</h1>
  <p id="errorText"></p>
</section>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<script>
"use strict";


const API_URL =
  "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/send-vehicle-push";

const SUPABASE_KEY =
  "sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2";

const VAPID_KEY =
  "BDtVeUPEh-pooMUUtj4Bd2f5x7EHuWyx4TeunbaQvR8WQs65qwNxryhhORYoS5mxxWMn0GogdgDs1Qod93Vj0jM";

const FIREBASE_CONFIG = {
  apiKey:
    "AIzaSyB3nZdmUrj2wsKPQpOV8dLso7i17fZo0Hc",

  authDomain:
    "wooriapt-carqr.firebaseapp.com",

  projectId:
    "wooriapt-carqr",

  storageBucket:
    "wooriapt-carqr.firebasestorage.app",

  messagingSenderId:
    "101299637796",

  appId:
    "1:101299637796:web:cb69372592026b7aa192b1"
};

const BUILD_VERSION =
  "20260906-ANDROID-SIMPLE-02";

const PENDING_KEY =
  "wooriapt_vehicle_android_pending";


const params =
  new URLSearchParams(
    window.location.search
  );

const qrCode =
  String(
    params.get("qr") || ""
  )
    .trim()
    .toUpperCase()
    .replace(
      /[^A-Z0-9_-]/g,
      ""
    );


const registerCard =
  document.getElementById(
    "registerCard"
  );

const installCard =
  document.getElementById(
    "installCard"
  );

const pushCard =
  document.getElementById(
    "pushCard"
  );

const completeCard =
  document.getElementById(
    "completeCard"
  );

const errorCard =
  document.getElementById(
    "errorCard"
  );

const phone =
  document.getElementById(
    "phone"
  );

const registerBtn =
  document.getElementById(
    "registerBtn"
  );

const registerStatus =
  document.getElementById(
    "registerStatus"
  );

const installBtn =
  document.getElementById(
    "installBtn"
  );

const installStatus =
  document.getElementById(
    "installStatus"
  );

const pushBtn =
  document.getElementById(
    "pushBtn"
  );

const pushStatus =
  document.getElementById(
    "pushStatus"
  );

const errorText =
  document.getElementById(
    "errorText"
  );

const cards = [
  registerCard,
  installCard,
  pushCard,
  completeCard,
  errorCard
];


let deferredInstallPrompt = null;
let appInstallCompleted = false;
let registrationInProgress = false;
let serviceWorkerPromise = null;


/*
 * 화면 표시
 */

function showCard(card){

  cards.forEach(
    item => {
      item.classList.remove(
        "active"
      );
    }
  );

  card.classList.add(
    "active"
  );

  window.scrollTo(
    0,
    0
  );
}


function setStatus(
  element,
  text,
  type
){

  element.textContent =
    text || "";

  element.className =
    "status" +
    (
      type
        ? " " + type
        : ""
    );
}


/*
 * 전화번호
 */

function normalizePhone(value){

  return String(
    value || ""
  ).replace(
    /[^0-9]/g,
    ""
  );
}


function validPhone(value){

  return /^01[016789][0-9]{7,8}$/
    .test(value);
}


function formatPhone(value){

  const number =
    normalizePhone(
      value
    ).slice(
      0,
      11
    );

  if(
    number.length <= 3
  ){
    return number;
  }

  if(
    number.length <= 7
  ){
    return (
      number.slice(0,3) +
      "-" +
      number.slice(3)
    );
  }

  return (
    number.slice(0,3) +
    "-" +
    number.slice(3,7) +
    "-" +
    number.slice(7)
  );
}


/*
 * 서버
 */

async function callApi(payload){

  const response =
    await fetch(
      API_URL,
      {
        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json",

          Authorization:
            "Bearer " +
            SUPABASE_KEY,

          apikey:
            SUPABASE_KEY
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );

  const data =
    await response
      .json()
      .catch(
        () => ({})
      );

  if(
    !response.ok ||
    data.ok === false ||
    data.success === false
  ){

    throw new Error(
      data.message ||
      "서버 처리에 실패했습니다."
    );
  }

  return data;
}


/*
 * 서비스워커
 */

function prepareServiceWorker(){

  if(
    serviceWorkerPromise
  ){
    return serviceWorkerPromise;
  }

  serviceWorkerPromise =
    (async () => {

      if(
        !(
          "serviceWorker"
          in navigator
        )
      ){

        throw new Error(
          "이 브라우저에서는 앱 설치를 지원하지 않습니다."
        );
      }

      const registration =
        await navigator
          .serviceWorker
          .register(
            "/firebase-messaging-sw.js?v=" +
            BUILD_VERSION,
            {
              scope:
                "/",

              updateViaCache:
                "none"
            }
          );

      return await navigator
        .serviceWorker
        .ready;
    })();

  return serviceWorkerPromise;
}


/*
 * 앱 설치창 준비
 */

window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredInstallPrompt =
      event;

    installBtn.disabled =
      false;

    installBtn.textContent =
      "앱 설치";

    setStatus(
      installStatus,
      "앱 설치 준비가 완료되었습니다.",
      "success"
    );
  }
);


/*
 * 실제 앱 설치 완료
 *
 * 이 이벤트가 발생해야만
 * 푸시 버튼이 활성화됨
 */

window.addEventListener(
  "appinstalled",
  () => {

    deferredInstallPrompt =
      null;

    appInstallCompleted =
      true;

    showCard(
      pushCard
    );

    pushBtn.disabled =
      false;

    pushBtn.textContent =
      "푸시 알림 허용";

    setStatus(
      pushStatus,
      "앱 설치가 완료되었습니다.",
      "success"
    );
  }
);


/*
 * 전화번호 자동 형식
 */

phone.addEventListener(
  "input",
  event => {

    event.target.value =
      formatPhone(
        event.target.value
      );
  }
);


/*
 * 1단계
 * 전화번호 확인
 */

registerBtn.addEventListener(
  "click",
  async () => {

    const ownerPhone =
      normalizePhone(
        phone.value
      );

    if(
      !validPhone(
        ownerPhone
      )
    ){

      setStatus(
        registerStatus,
        "휴대전화번호를 정확히 입력해 주세요.",
        "error"
      );

      phone.focus();

      return;
    }

    if(
      !qrCode
    ){

      setStatus(
        registerStatus,
        "자동차 QR 정보를 확인할 수 없습니다.",
        "error"
      );

      return;
    }

    localStorage.setItem(
      PENDING_KEY,
      JSON.stringify({
        qr_code:
          qrCode,

        owner_phone:
          ownerPhone
      })
    );

    try{

      await prepareServiceWorker();

      showCard(
        installCard
      );

    }catch(error){

      setStatus(
        registerStatus,
        error instanceof Error
          ? error.message
          : "앱 설치 준비에 실패했습니다.",
        "error"
      );
    }
  }
);


/*
 * 2단계
 * 앱 설치
 */

installBtn.addEventListener(
  "click",
  async () => {

    if(
      !deferredInstallPrompt
    ){

      setStatus(
        installStatus,
        "앱 설치창을 준비하고 있습니다. 잠시 후 다시 눌러 주세요.",
        "waiting"
      );

      return;
    }

    const promptEvent =
      deferredInstallPrompt;

    installBtn.disabled =
      true;

    installBtn.textContent =
      "앱 설치 중...";

    setStatus(
      installStatus,
      "표시되는 설치창에서 ‘설치’를 눌러 주세요.",
      "waiting"
    );

    try{

      await promptEvent.prompt();

      const result =
        await promptEvent.userChoice;

      deferredInstallPrompt =
        null;

      if(
        result.outcome !==
        "accepted"
      ){

        throw new Error(
          "앱 설치를 완료해 주세요."
        );
      }

      /*
       * 여기에서는 푸시 화면으로 이동하지 않음
       * 실제 appinstalled 이벤트를 기다림
       */

      setStatus(
        installStatus,
        "앱 설치가 완료될 때까지 기다려 주세요.",
        "waiting"
      );

    }catch(error){

      installBtn.disabled =
        false;

      installBtn.textContent =
        "앱 설치";

      setStatus(
        installStatus,
        error instanceof Error
          ? error.message
          : "앱 설치에 실패했습니다.",
        "error"
      );
    }
  }
);


/*
 * 3단계
 * 푸시 허용 후 자동차 등록
 */

pushBtn.addEventListener(
  "click",
  async () => {

    if(
      registrationInProgress
    ){
      return;
    }

    /*
     * 앱 설치가 끝나지 않았으면
     * 푸시와 자동차등록을 실행하지 않음
     */

    if(
      !appInstallCompleted
    ){

      setStatus(
        pushStatus,
        "앱 설치가 완료될 때까지 기다려 주세요.",
        "error"
      );

      return;
    }

    registrationInProgress =
      true;

    pushBtn.disabled =
      true;

    pushBtn.textContent =
      "등록 진행 중...";

    setStatus(
      pushStatus,
      "",
      "waiting"
    );

    try{

      const pending =
        JSON.parse(
          localStorage.getItem(
            PENDING_KEY
          ) || "null"
        );

      if(
        !pending ||
        !pending.qr_code ||
        !pending.owner_phone
      ){

        throw new Error(
          "등록 정보를 찾을 수 없습니다."
        );
      }

      if(
        !(
          "Notification"
          in window
        )
      ){

        throw new Error(
          "이 기기에서는 알림을 지원하지 않습니다."
        );
      }

      if(
        Notification.permission ===
        "denied"
      ){

        throw new Error(
          "알림 권한이 차단되어 있습니다."
        );
      }

      if(
        Notification.permission !==
        "granted"
      ){

        const permission =
          await Notification
            .requestPermission();

        if(
          permission !==
          "granted"
        ){

          throw new Error(
            "푸시 알림을 허용해 주세요."
          );
        }
      }

      if(
        !firebase.apps.length
      ){

        firebase.initializeApp(
          FIREBASE_CONFIG
        );
      }

      const registration =
        await prepareServiceWorker();

      const messaging =
        firebase.messaging();

      const token =
        await messaging.getToken({
          vapidKey:
            VAPID_KEY,

          serviceWorkerRegistration:
            registration
        });

      if(
        !token
      ){

        throw new Error(
          "푸시 토큰을 발급하지 못했습니다."
        );
      }

      /*
       * 앱 설치와 푸시 토큰 발급이 끝난 후
       * 자동차를 한 번만 등록
       */

      await callApi({
        action:
          "register",

        registration_type:
          "vehicle",

        qr_code:
          pending.qr_code,

        owner_phone:
          pending.owner_phone,

        push_token:
          token,

        platform:
          "android",

        user_agent:
          navigator.userAgent
      });

      localStorage.removeItem(
        PENDING_KEY
      );

      registrationInProgress =
        false;

      showCard(
        completeCard
      );

    }catch(error){

      registrationInProgress =
        false;

      pushBtn.disabled =
        false;

      pushBtn.textContent =
        "푸시 알림 허용";

      setStatus(
        pushStatus,
        error instanceof Error
          ? error.message
          : "등록에 실패했습니다.",
        "error"
      );
    }
  }
);


/*
 * 시작
 */

(function start(){

  if(
    !qrCode
  ){

    errorText.textContent =
      "자동차 QR 정보를 확인할 수 없습니다.";

    showCard(
      errorCard
    );

    return;
  }

  let pending = null;

  try{

    pending =
      JSON.parse(
        localStorage.getItem(
          PENDING_KEY
        ) || "null"
      );

  }catch(error){

    localStorage.removeItem(
      PENDING_KEY
    );
  }

  /*
   * 등록 도중 다시 열려도
   * 푸시 화면으로 바로 보내지 않음
   */

  if(
    pending &&
    pending.qr_code === qrCode
  ){

    showCard(
      installCard
    );

  }else{

    showCard(
      registerCard
    );
  }

  prepareServiceWorker()
    .catch(
      error => {
        console.warn(
          "서비스워커 준비:",
          error
        );
      }
    );
})();
</script>

</body>
</html>
