<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>우리가게</title>

<style>
*{box-sizing:border-box}
html,body{
  width:100%;
  min-height:100%;
  margin:0;
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f4f7fb;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}
.status-card{
  display:none;
  width:100%;
  max-width:420px;
  padding:28px 22px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(15,23,42,.1);
  text-align:center;
}
.status-card.show{
  display:block;
}
.status-title{
  margin:0 0 12px;
  font-size:23px;
  font-weight:800;
}
.status-text{
  margin:0;
  color:#64748b;
  font-size:16px;
  line-height:1.7;
}
.error{
  color:#dc2626;
}
</style>
</head>

<body>

<div id="statusCard" class="status-card">
  <div id="statusTitle" class="status-title">
    등록정보 확인 중
  </div>
  <div id="statusText" class="status-text">
    잠시만 기다려 주세요.
  </div>
</div>

<script>
(function(){
  "use strict";

  /*
   * 기존 삼성·안드로이드용 저장키
   * 변경하지 않습니다.
   */
  const PENDING_KEY =
    "wooriapt_mart_pending_registration";

  const STORE_PATH_KEY =
    "wooriapt_store_path";

  const STORE_URL_KEY =
    "wooriapt_store_url";

  const params =
    new URLSearchParams(window.location.search);

  /*
   * 아이폰 전용 동적 manifest가 전달하는 등록키
   */
  const registrationKey =
    String(params.get("reg") || "")
      .trim()
      .toLowerCase();

  const validRegistrationKey =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
      .test(registrationKey);

  const standalone =
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||
    window.navigator.standalone === true;

  const statusCard =
    document.getElementById("statusCard");

  const statusTitle =
    document.getElementById("statusTitle");

  const statusText =
    document.getElementById("statusText");

  function showStatus(title,text,isError){
    statusCard.classList.add("show");

    statusTitle.textContent =
      title || "";

    statusText.textContent =
      text || "";

    statusText.className =
      isError
        ? "status-text error"
        : "status-text";
  }

  /*
   * =====================================================
   * 아이폰 전용 등록 복원
   *
   * 중요:
   * Safari에서 저장했던 localStorage를 가져오는 것이 아니라
   * registration_key로 서버에서 QR + 전화번호를 다시 받아
   * 설치된 PWA 자신의 localStorage에 새로 저장합니다.
   *
   * 삼성·안드로이드는 이 분기를 사용하지 않습니다.
   * =====================================================
   */
  async function restoreIphoneRegistration(){
    showStatus(
      "등록정보 확인 중",
      "잠시만 기다려 주세요.",
      false
    );

    try{
      const response =
        await fetch(
          "/api/iphone-registration?reg=" +
          encodeURIComponent(registrationKey),
          {
            method:"GET",
            cache:"no-store"
          }
        );

      const data =
        await response.json();

      if(
        !response.ok ||
        !data ||
        data.ok !== true
      ){
        throw new Error(
          data && data.message
            ? data.message
            : "등록정보를 확인할 수 없습니다."
        );
      }

      const qrCode =
        String(data.qr_code || "")
          .trim()
          .toUpperCase();

      const phone =
        String(data.phone || "")
          .replace(/[^0-9]/g,"");

      if(!qrCode){
        throw new Error(
          "QR 등록정보가 없습니다."
        );
      }

      if(
        !/^01[016789][0-9]{7,8}$/.test(phone)
      ){
        throw new Error(
          "휴대전화 등록정보를 확인할 수 없습니다."
        );
      }

      /*
       * 여기서부터는 설치된 아이폰 PWA 자신의 저장공간입니다.
       * mart-install.html에서도 동일한 값을 읽을 수 있습니다.
       */
      localStorage.setItem(
        PENDING_KEY,
        JSON.stringify({
          qr_code:qrCode,
          owner_phone:phone,
          store_path:
            data.store_url ||
            data.store_code ||
            "/74",
          store_url:
            data.store_url ||
            "/74"
        })
      );

      localStorage.setItem(
        STORE_PATH_KEY,
        data.store_url || "/74"
      );

      localStorage.setItem(
        STORE_URL_KEY,
        data.store_url || "/74"
      );

      /*
       * 기존 mart-install.html로 이동
       * 설치된 앱이므로 기존 코드가 pushCard를 바로 띄웁니다.
       */
      window.location.replace(
        "/mart-install.html?qr=" +
        encodeURIComponent(qrCode) +
        "&resume=1"
      );

    }catch(error){
      console.error(
        "iPhone registration restore error:",
        error
      );

      showStatus(
        "등록정보 확인 실패",
        error instanceof Error
          ? error.message
          : "자동차 QR을 다시 스캔해 주세요.",
        true
      );
    }
  }

  /*
   * =====================================================
   * 아이폰 전용 진입
   * =====================================================
   */
  if(
    standalone &&
    validRegistrationKey
  ){
    restoreIphoneRegistration();
    return;
  }

  /*
   * =====================================================
   * 아래부터는 기존 삼성·안드로이드 흐름
   * 기존 로직을 그대로 유지합니다.
   * =====================================================
   */

  let pending = null;

  try{
    pending =
      JSON.parse(
        localStorage.getItem(
          PENDING_KEY
        ) || "null"
      );
  }catch(e){}

  if(
    standalone &&
    pending &&
    pending.qr_code
  ){
    const target =
      "/mart-install.html?qr=" +
      encodeURIComponent(
        pending.qr_code
      ) +
      "&resume=1";

    window.location.replace(target);
    return;
  }

  const saved =
    localStorage.getItem(
      STORE_URL_KEY
    ) ||
    localStorage.getItem(
      STORE_PATH_KEY
    ) ||
    "/74";

  const target =
    /^https?:\/\//i.test(saved)
      ? saved
      : "https://wooriapt.ai.kr" +
        (
          saved.charAt(0) === "/"
            ? saved
            : "/" + saved
        );

  window.location.replace(target);

})();
</script>

</body>
</html>
