<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>우리가게</title>
</head>
<body>
<script>
(function(){
  "use strict";

  const PENDING_KEY="wooriapt_mart_pending_registration";
  const STORE_PATH_KEY="wooriapt_store_path";
  const STORE_URL_KEY="wooriapt_store_url";

  let pending=null;
  try{
    pending=JSON.parse(localStorage.getItem(PENDING_KEY)||"null");
  }catch(e){}

  const standalone=
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone===true;

  if(standalone && pending && pending.qr_code){
    const target=
      "/mart-install.html?qr="+
      encodeURIComponent(pending.qr_code)+
      "&resume=1";
    window.location.replace(target);
    return;
  }

  const saved=
    localStorage.getItem(STORE_URL_KEY) ||
    localStorage.getItem(STORE_PATH_KEY) ||
    "/74";

  const target=
    /^https?:\/\//i.test(saved)
      ? saved
      : "https://wooriapt.ai.kr"+(
          saved.charAt(0)==="/" ? saved : "/"+saved
        );

  window.location.replace(target);
})();
</script>
</body>
</html>
