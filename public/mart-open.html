<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#16a34a">

<title>우리가게</title>
</head>

<body>

<script>
"use strict";


const STORE_ID_KEY =
  "wooriapt_store_id";


const params =
  new URLSearchParams(
    window.location.search
  );


const receivedStoreId =
  String(
    params.get("store_id") ||
    params.get("store") ||
    ""
  )
    .trim()
    .replace(
      /[^a-zA-Z0-9_-]/g,
      ""
    );


if(
  receivedStoreId
){

  localStorage.setItem(
    STORE_ID_KEY,
    receivedStoreId
  );
}


const savedStoreId =
  receivedStoreId ||
  String(
    localStorage.getItem(
      STORE_ID_KEY
    ) || ""
  )
    .trim()
    .replace(
      /[^a-zA-Z0-9_-]/g,
      ""
    );


const destination =
  savedStoreId
    ? "https://wooriapt.ai.kr/74?store_id=" +
      encodeURIComponent(
        savedStoreId
      )
    : "https://wooriapt.ai.kr/74";


window.location.replace(
  destination
);
</script>

</body>
</html>
