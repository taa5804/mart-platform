<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#16a34a"
>

<title>우리가게</title>


<!--
=====================================================
iPhone 자동차 QR 전용 동적 Manifest 연결

기존 자동차 QR의 reg 방식은 그대로 유지합니다.
입간판 QR은 mart-install.html에서
별도로 동적 manifest를 연결합니다.
=====================================================
-->
<script>
(function(){
  "use strict";

  const params =
    new URLSearchParams(
      window.location.search
    );


  const registrationKey =
    String(
      params.get("reg") || ""
    )
      .trim()
      .toLowerCase();


  const validRegistrationKey =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
      .test(
        registrationKey
      );


  const ua =
    navigator.userAgent || "";


  const isIOS =
    /iPhone|iPad|iPod/i.test(
      ua
    ) ||
    (
      navigator.platform ===
        "MacIntel" &&
      navigator.maxTouchPoints > 1
    );


  if(
    isIOS &&
    validRegistrationKey
  ){

    const manifest =
      document.createElement(
        "link"
      );


    manifest.rel =
      "manifest";


    manifest.href =
      "/api/iphone-manifest?reg=" +
      encodeURIComponent(
        registrationKey
      );


    document.head.appendChild(
      manifest
    );
  }

})();
</script>


<style>
*{
  box-sizing:border-box;
}


html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}


body{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#f4f7fb;

  color:#111827;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    Roboto,
    Arial,
    sans-serif;
}


.status-card{
  display:none;

  width:100%;
  max-width:420px;

  padding:28px 22px;

  background:#ffffff;

  border-radius:18px;

  box-shadow:
    0 10px 35px
    rgba(15,23,42,.10);

  text-align:center;
}


.status-card.show{
  display:block;
}


.status-title{
  margin:0 0 12px;

  font-size:23px;
  font-weight:800;
}


.status-text{
  margin:0;

  color:#64748b;

  font-size:16px;
  line-height:1.7;

  word-break:keep-all;
}


.error{
  color:#dc2626;
}


.success{
  color:#15803d;
}
</style>
</head>


<body>


<div
  id="statusCard"
  class="status-card"
>

  <div
    id="statusTitle"
    class="status-title"
  >
    등록정보 확인 중
  </div>


  <div
    id="statusText"
    class="status-text"
  >
    잠시만 기다려 주세요.
  </div>

</div>



<script>
(function(){
  "use strict";


  /*
   * =====================================================
   * 공통 저장키
   * =====================================================
   */

  const PENDING_KEY =
    "wooriapt_mart_pending_registration";


  const STORE_PATH_KEY =
    "wooriapt_store_path";


  const STORE_URL_KEY =
    "wooriapt_store_url";



  /*
   * =====================================================
   * URL 정보
   * =====================================================
   */

  const params =
    new URLSearchParams(
      window.location.search
    );



  /*
   * =====================================================
   * 자동차 iPhone registration key
   * =====================================================
   */

  const registrationKey =
    String(
      params.get("reg") || ""
    )
      .trim()
      .toLowerCase();


  const validRegistrationKey =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
      .test(
        registrationKey
      );



  /*
   * =====================================================
   * 입간판 QR
   * =====================================================
   */

  const qrCode =
    String(
      params.get("qr") || ""
    )
      .trim()
      .toUpperCase()
      .replace(
        /[^A-Z0-9_-]/g,
        ""
      );



  /*
   * =====================================================
   * 입간판 매장 경로
   * =====================================================
   */

  function cleanStorePath(
    value
  ){

    const digits =
      String(
        value || ""
      )
        .replace(
          /[^0-9]/g,
          ""
        );


    if(!digits){

      return "/74";

    }


    return "/" +
      String(
        Number(
          digits
        )
      );
  }


  const storePath =
    cleanStorePath(
      params.get("path") ||
      params.get("store_path") ||
      "74"
    );



  /*
   * =====================================================
   * 매장 코드
   * =====================================================
   */

  const storeCode =
    String(
      params.get("store") ||
      params.get("store_code") ||
      ""
    )
      .trim()
      .toUpperCase();



  /*
   * =====================================================
   * 입간판 여부
   * =====================================================
   */

  const source =
    String(
      params.get("source") || ""
    )
      .trim()
      .toLowerCase();


  const SIGNBOARD_MODE =
    source ===
      "signboard" ||
    !!qrCode;



  /*
   * =====================================================
   * PWA 실행 여부
   * =====================================================
   */

  const standalone =
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||
    window.navigator.standalone ===
      true;



  /*
   * =====================================================
   * 상태 화면
   * =====================================================
   */

  const statusCard =
    document.getElementById(
      "statusCard"
    );


  const statusTitle =
    document.getElementById(
      "statusTitle"
    );


  const statusText =
    document.getElementById(
      "statusText"
    );


  function showStatus(
    title,
    text,
    isError
  ){

    statusCard.classList.add(
      "show"
    );


    statusTitle.textContent =
      title || "";


    statusText.textContent =
      text || "";


    statusText.className =
      isError
        ? "status-text error"
        : "status-text";
  }



  /*
   * =====================================================
   * 입간판 QR 저장
   *
   * 전화번호를 저장하지 않습니다.
   * =====================================================
   */

  function saveSignboardRegistration(){

    if(!qrCode){

      return false;

    }


    const data = {

      registration_type:
        "mart",

      source_type:
        "signboard",

      qr_code:
        qrCode,

      owner_phone:
        "",

      store_code:
        storeCode,

      store_path:
        storePath,

      store_url:
        storePath

    };


    try{

      localStorage.setItem(
        PENDING_KEY,
        JSON.stringify(
          data
        )
      );


      localStorage.setItem(
        STORE_PATH_KEY,
        storePath
      );


      localStorage.setItem(
        STORE_URL_KEY,
        storePath
      );


      return true;


    }catch(error){

      console.error(
        "signboard storage error:",
        error
      );


      return false;
    }
  }



  /*
   * =====================================================
   * 입간판 QR 처리
   *
   * iPhone 설치 앱이
   * manifest start_url을 통해 이곳으로 들어오면
   *
   * 전화번호 확인 없이
   * QR + 매장경로를 설치된 PWA localStorage에 저장
   *
   * 그리고 mart-install.html의
   * 푸시 허용 단계로 이동합니다.
   * =====================================================
   */

  function openSignboardFlow(){

    showStatus(
      "우리가게 연결 중",
      "입간판 QR 정보를 확인하고 있습니다.",
      false
    );


    if(!qrCode){

      showStatus(
        "QR 확인 실패",
        "입간판 QR 정보를 확인할 수 없습니다.",
        true
      );


      return;
    }


    const saved =
      saveSignboardRegistration();


    if(!saved){

      showStatus(
        "등록정보 저장 실패",
        "입간판 정보를 저장하지 못했습니다.",
        true
      );


      return;
    }


    const target =
      "/mart-install.html" +
      "?qr=" +
      encodeURIComponent(
        qrCode
      ) +
      "&path=" +
      encodeURIComponent(
        storePath.replace(
          /^\//,
          ""
        )
      ) +
      "&source=signboard" +
      "&resume=1";


    window.location.replace(
      target
    );
  }



  /*
   * =====================================================
   * 가장 먼저 입간판 분기
   *
   * 자동차 reg 로직보다 먼저 분리합니다.
   * =====================================================
   */

  if(
    SIGNBOARD_MODE &&
    qrCode
  ){

    openSignboardFlow();

    return;
  }



  /*
   * =====================================================
   * 아래부터 자동차 iPhone 기존 등록 복원
   * =====================================================
   */

  async function restoreIphoneRegistration(){

    showStatus(
      "등록정보 확인 중",
      "잠시만 기다려 주세요.",
      false
    );


    try{


      /*
       * 기존 iphone-registration.js 기능이
       * api/register.js GET에 통합되어 있으므로
       * /api/register를 사용합니다.
       */

      const response =
        await fetch(

          "/api/register?reg=" +
          encodeURIComponent(
            registrationKey
          ),

          {
            method:
              "GET",

            cache:
              "no-store",

            headers:{

              "Accept":
                "application/json"

            }
          }
        );



      let data =
        null;


      try{

        data =
          await response.json();

      }catch(error){

        throw new Error(
          "등록정보 응답을 확인할 수 없습니다."
        );

      }



      if(
        !response.ok ||
        !data ||
        data.ok !== true
      ){

        throw new Error(

          data &&
          data.message

            ? data.message

            : "등록정보를 확인할 수 없습니다."

        );

      }



      const vehicleQrCode =
        String(
          data.qr_code || ""
        )
          .trim()
          .toUpperCase();



      const phone =
        String(
          data.phone || ""
        )
          .replace(
            /[^0-9]/g,
            ""
          );



      if(
        !vehicleQrCode
      ){

        throw new Error(
          "QR 등록정보가 없습니다."
        );

      }



      /*
       * 자동차 QR은
       * 기존 전화번호 검사를 그대로 유지합니다.
       */

      if(
        !/^01[016789][0-9]{7,8}$/
          .test(
            phone
          )
      ){

        throw new Error(
          "휴대전화 등록정보를 확인할 수 없습니다."
        );

      }



      const vehicleStoreUrl =
        String(

          data.store_url ||
          data.store_code ||
          "/74"

        )
          .trim() ||
        "/74";



      /*
       * =================================================
       * 기존 자동차 등록정보 저장
       * =================================================
       */

      localStorage.setItem(

        PENDING_KEY,

        JSON.stringify({

          qr_code:
            vehicleQrCode,

          owner_phone:
            phone,

          store_path:
            vehicleStoreUrl,

          store_url:
            vehicleStoreUrl

        })

      );



      localStorage.setItem(
        STORE_PATH_KEY,
        vehicleStoreUrl
      );


      localStorage.setItem(
        STORE_URL_KEY,
        vehicleStoreUrl
      );



      /*
       * =================================================
       * 자동차 기존 흐름
       * =================================================
       */

      window.location.replace(

        "/mart-install.html?qr=" +
        encodeURIComponent(
          vehicleQrCode
        ) +
        "&resume=1"

      );


    }catch(error){


      console.error(
        "iPhone registration restore error:",
        error
      );


      showStatus(

        "등록정보 확인 실패",

        error instanceof Error

          ? error.message

          : "자동차 QR을 다시 스캔해 주세요.",

        true

      );

    }
  }



  /*
   * =====================================================
   * 자동차 iPhone 설치 앱
   * =====================================================
   */

  if(
    standalone &&
    validRegistrationKey
  ){

    restoreIphoneRegistration();

    return;
  }



  /*
   * =====================================================
   * 기존 Android / 일반 PWA 저장정보
   * =====================================================
   */

  let pending =
    null;


  try{

    pending =
      JSON.parse(

        localStorage.getItem(
          PENDING_KEY
        ) ||
        "null"

      );

  }catch(error){

    pending =
      null;

  }



  /*
   * =====================================================
   * 저장된 입간판 정보가 있는 PWA
   * =====================================================
   */

  if(
    standalone &&
    pending &&
    pending.qr_code &&
    (
      pending.source_type ===
        "signboard" ||
      pending.registration_type ===
        "mart"
    ) &&
    !pending.owner_phone
  ){

    const pendingPath =
      cleanStorePath(
        pending.store_path ||
        pending.store_url ||
        "74"
      );


    const target =
      "/mart-install.html" +
      "?qr=" +
      encodeURIComponent(
        pending.qr_code
      ) +
      "&path=" +
      encodeURIComponent(
        pendingPath.replace(
          /^\//,
          ""
        )
      ) +
      "&source=signboard" +
      "&resume=1";


    window.location.replace(
      target
    );


    return;
  }



  /*
   * =====================================================
   * 기존 자동차 Android / PWA 흐름
   * =====================================================
   */

  if(
    standalone &&
    pending &&
    pending.qr_code
  ){

    const target =
      "/mart-install.html?qr=" +
      encodeURIComponent(
        pending.qr_code
      ) +
      "&resume=1";


    window.location.replace(
      target
    );


    return;
  }



  /*
   * =====================================================
   * 저장된 매장으로 이동
   * =====================================================
   */

  const saved =
    localStorage.getItem(
      STORE_URL_KEY
    ) ||
    localStorage.getItem(
      STORE_PATH_KEY
    ) ||
    "/74";


  const target =
    /^https?:\/\//i.test(
      saved
    )

      ? saved

      : "https://wooriapt.ai.kr" +
        (
          saved.charAt(0) === "/"

            ? saved

            : "/" + saved
        );


  window.location.replace(
    target
  );


})();
</script>


</body>
</html>
