<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>우리가게</title>

<!--
  =====================================================
  iPhone 전용 동적 Manifest 연결
  =====================================================
-->
<script>
(function(){
  "use strict";

  const params =
    new URLSearchParams(window.location.search);

  const registrationKey =
    String(params.get("reg") || "")
      .trim()
      .toLowerCase();

  const validRegistrationKey =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
      .test(registrationKey);

  const ua =
    navigator.userAgent || "";

  const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (
      navigator.platform === "MacIntel" &&
      navigator.maxTouchPoints > 1
    );

  /*
   * iPhone + 정상 registrationKey일 때만
   * 동적 manifest를 연결합니다.
   *
   * 삼성·안드로이드는 건드리지 않습니다.
   */
  if(
    isIOS &&
    validRegistrationKey
  ){
    const manifest =
      document.createElement("link");

    manifest.rel =
      "manifest";

    manifest.href =
      "/api/iphone-manifest?reg=" +
      encodeURIComponent(registrationKey);

    document.head.appendChild(manifest);
  }
})();
</script>

<style>
*{box-sizing:border-box}

html,body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f4f7fb;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

.status-card{
  display:none;
  width:100%;
  max-width:420px;
  padding:28px 22px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(15,23,42,.1);
  text-align:center;
}

.status-card.show{
  display:block;
}

.status-title{
  margin:0 0 12px;
  font-size:23px;
  font-weight:800;
}

.status-text{
  margin:0;
  color:#64748b;
  font-size:16px;
  line-height:1.7;
}

.error{
  color:#dc2626;
}
</style>
</head>

<body>

<div id="statusCard" class="status-card">

  <div
    id="statusTitle"
    class="status-title"
  >
    등록정보 확인 중
  </div>

  <div
    id="statusText"
    class="status-text"
  >
    잠시만 기다려 주세요.
  </div>

</div>

<script>
(function(){
  "use strict";

  /*
   * =====================================================
   * 기존 삼성·안드로이드용 저장키
   * 변경하지 않습니다.
   * =====================================================
   */

  const PENDING_KEY =
    "wooriapt_mart_pending_registration";

  const STORE_PATH_KEY =
    "wooriapt_store_path";

  const STORE_URL_KEY =
    "wooriapt_store_url";


  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
   * =====================================================
   * iPhone 동적 Manifest가
   * start_url을 통해 전달하는 registrationKey
   * =====================================================
   */

  const registrationKey =
    String(
      params.get("reg") || ""
    )
      .trim()
      .toLowerCase();


  const validRegistrationKey =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
      .test(registrationKey);


  /*
   * =====================================================
   * 현재 PWA 설치 실행 여부
   * =====================================================
   */

  const standalone =
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||
    window.navigator.standalone === true;


  const statusCard =
    document.getElementById(
      "statusCard"
    );

  const statusTitle =
    document.getElementById(
      "statusTitle"
    );

  const statusText =
    document.getElementById(
      "statusText"
    );


  function showStatus(
    title,
    text,
    isError
  ){

    statusCard.classList.add(
      "show"
    );

    statusTitle.textContent =
      title || "";

    statusText.textContent =
      text || "";

    statusText.className =
      isError
        ? "status-text error"
        : "status-text";
  }


  /*
   * =====================================================
   * iPhone 전용 등록 복원
   *
   * Safari localStorage를 복사하지 않습니다.
   *
   * Manifest start_url에 포함된
   * registrationKey를 이용하여
   * 서버에서 등록정보를 다시 가져옵니다.
   *
   * 그리고 설치된 PWA 자신의
   * localStorage에 새로 저장합니다.
   *
   * 삼성·안드로이드는 이 분기를
   * 사용하지 않습니다.
   * =====================================================
   */

  async function restoreIphoneRegistration(){

    showStatus(
      "등록정보 확인 중",
      "잠시만 기다려 주세요.",
      false
    );


    try{

      const response =
        await fetch(
          "/api/iphone-registration?reg=" +
          encodeURIComponent(
            registrationKey
          ),
          {
            method:"GET",
            cache:"no-store",
            headers:{
              "Accept":"application/json"
            }
          }
        );


      let data = null;


      try{

        data =
          await response.json();

      }catch(e){

        throw new Error(
          "등록정보 응답을 확인할 수 없습니다."
        );
      }


      if(
        !response.ok ||
        !data ||
        data.ok !== true
      ){

        throw new Error(
          data &&
          data.message
            ? data.message
            : "등록정보를 확인할 수 없습니다."
        );
      }


      const qrCode =
        String(
          data.qr_code || ""
        )
          .trim()
          .toUpperCase();


      const phone =
        String(
          data.phone || ""
        )
          .replace(
            /[^0-9]/g,
            ""
          );


      if(!qrCode){

        throw new Error(
          "QR 등록정보가 없습니다."
        );
      }


      if(
        !/^01[016789][0-9]{7,8}$/.test(
          phone
        )
      ){

        throw new Error(
          "휴대전화 등록정보를 확인할 수 없습니다."
        );
      }


      /*
       * =================================================
       * 설치된 iPhone PWA 저장공간에
       * 등록정보 저장
       * =================================================
       */

      const storeUrl =
        String(
          data.store_url ||
          data.store_code ||
          "/74"
        ).trim() || "/74";


      localStorage.setItem(
        PENDING_KEY,
        JSON.stringify({
          qr_code:
            qrCode,

          owner_phone:
            phone,

          store_path:
            storeUrl,

          store_url:
            storeUrl
        })
      );


      localStorage.setItem(
        STORE_PATH_KEY,
        storeUrl
      );


      localStorage.setItem(
        STORE_URL_KEY,
        storeUrl
      );


      /*
       * =================================================
       * 기존 mart-install.html로 이동
       *
       * 기존 pushCard 흐름 그대로 사용
       * =================================================
       */

      window.location.replace(
        "/mart-install.html?qr=" +
        encodeURIComponent(
          qrCode
        ) +
        "&resume=1"
      );


    }catch(error){

      console.error(
        "iPhone registration restore error:",
        error
      );


      showStatus(
        "등록정보 확인 실패",
        error instanceof Error
          ? error.message
          : "자동차 QR을 다시 스캔해 주세요.",
        true
      );
    }
  }


  /*
   * =====================================================
   * iPhone 설치 앱 전용 진입
   *
   * standalone + reg가 있을 때만 실행
   * =====================================================
   */

  if(
    standalone &&
    validRegistrationKey
  ){

    restoreIphoneRegistration();

    return;
  }


  /*
   * =====================================================
   * 아래부터 기존 삼성·안드로이드 흐름
   * 변경하지 않습니다.
   * =====================================================
   */

  let pending = null;


  try{

    pending =
      JSON.parse(
        localStorage.getItem(
          PENDING_KEY
        ) || "null"
      );

  }catch(e){}


  if(
    standalone &&
    pending &&
    pending.qr_code
  ){

    const target =
      "/mart-install.html?qr=" +
      encodeURIComponent(
        pending.qr_code
      ) +
      "&resume=1";


    window.location.replace(
      target
    );

    return;
  }


  const saved =
    localStorage.getItem(
      STORE_URL_KEY
    ) ||
    localStorage.getItem(
      STORE_PATH_KEY
    ) ||
    "/74";


  const target =
    /^https?:\/\//i.test(
      saved
    )
      ? saved
      : "https://wooriapt.ai.kr" +
        (
          saved.charAt(0) === "/"
            ? saved
            : "/" + saved
        );


  window.location.replace(
    target
  );

})();
</script>

</body>
</html>
