<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15803d">
  <title>본사 계정관리</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{
      min-height:100vh;padding:20px 14px 40px;background:#f4f7f5;color:#111827;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
    }
    .wrap{width:100%;max-width:720px;margin:0 auto}
    .header{
      padding:22px 20px;border-radius:18px;background:linear-gradient(135deg,#166534,#15803d);
      color:#fff;box-shadow:0 12px 30px rgba(21,128,61,.2)
    }
    .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    h1{margin:0;font-size:25px}
    .header p{margin:8px 0 0;color:rgba(255,255,255,.86);font-size:14px;line-height:1.6}
    .back-link{
      flex-shrink:0;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.16);
      color:#fff;text-decoration:none;font-size:13px;font-weight:700
    }
    .card{
      margin-top:14px;padding:20px;border:1px solid #dfe7e1;border-radius:16px;background:#fff;
      box-shadow:0 8px 24px rgba(15,23,42,.06)
    }
    .title{margin:0 0 14px;font-size:18px;font-weight:800}
    .info-row{
      display:grid;grid-template-columns:120px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ee
    }
    .info-row:last-child{border-bottom:0}
    .info-label{color:#64748b;font-size:14px}
    .info-value{font-weight:700;word-break:break-all}
    .locked{display:inline-block;margin-left:7px;padding:3px 7px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:11px}
    label{display:block;margin:14px 0 7px;font-size:14px;font-weight:700;color:#374151}
    select,input{
      width:100%;height:49px;padding:0 13px;border:1px solid #cbd5e1;border-radius:10px;
      background:#fff;color:#111827;font-size:15px;outline:none
    }
    select:focus,input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
    input[readonly]{background:#f8fafc;color:#475569}
    button{
      width:100%;min-height:50px;margin-top:17px;border:0;border-radius:11px;color:#fff;
      font-size:16px;font-weight:800;cursor:pointer
    }
    .primary{background:#15803d}
    .danger{background:#b42318}
    .secondary{background:#475569}
    button:disabled{opacity:.58;cursor:wait}
    .help{margin-top:8px;color:#64748b;font-size:13px;line-height:1.55}
    .message{
      display:none;margin-top:14px;padding:13px 14px;border-radius:10px;font-size:14px;line-height:1.55
    }
    .message.success{display:block;border:1px solid #b8dec2;background:#edf8f0;color:#236631}
    .message.error{display:block;border:1px solid #efb8b8;background:#fff0f0;color:#a02020}
    .message.waiting{display:block;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8}
    #mainPanel{display:none}
    .loading{padding:30px 20px;text-align:center;color:#64748b}
    @media(max-width:520px){
      .info-row{grid-template-columns:1fr;gap:5px}
      .card{padding:16px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="header-top">
        <div>
          <h1>본사 계정관리</h1>
          <p>본사 비밀번호 변경과 매장 비밀번호 초기화를 관리합니다.</p>
        </div>
        <a class="back-link" href="/hq-dashboard.html">본사 메인</a>
      </div>
    </header>

    <section id="loadingPanel" class="card">
      <div class="loading">본사 관리자 로그인 정보를 확인하고 있습니다.</div>
    </section>

    <section id="mainPanel">
      <div class="card">
        <h2 class="title">본사 관리자 정보</h2>
        <div class="info-row">
          <div class="info-label">관리자 아이디</div>
          <div id="adminId" class="info-value">admin</div>
        </div>
        <div class="info-row">
          <div class="info-label">복구 이메일</div>
          <div class="info-value">
            jsy5804@empas.com
            <span class="locked">변경 불가</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="title">본사 비밀번호 변경</h2>

        <label for="currentPassword">현재 비밀번호</label>
        <input id="currentPassword" type="password" autocomplete="current-password" placeholder="현재 비밀번호">

        <label for="newPassword">새 비밀번호</label>
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="영문·숫자 포함 8자 이상">

        <label for="confirmPassword">새 비밀번호 확인</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="새 비밀번호 다시 입력">

        <button id="changeHqButton" class="primary" type="button">본사 비밀번호 변경</button>
        <div class="help">변경 후에도 현재 본사 관리자 로그인 상태는 유지됩니다.</div>
      </div>

      <div class="card">
        <h2 class="title">매장 비밀번호 초기화</h2>

        <label for="storeSelect">매장 선택</label>
        <select id="storeSelect">
          <option value="">매장을 선택하세요</option>
        </select>

        <label for="selectedStoreId">선택한 매장 ID</label>
        <input id="selectedStoreId" type="text" readonly placeholder="매장을 선택하면 표시됩니다">

        <label for="tempPassword">새 임시 비밀번호</label>
        <input id="tempPassword" type="password" autocomplete="new-password" placeholder="영문·숫자 포함 8자 이상">

        <label for="tempPasswordConfirm">새 임시 비밀번호 확인</label>
        <input id="tempPasswordConfirm" type="password" autocomplete="new-password" placeholder="임시 비밀번호 다시 입력">

        <button id="resetStoreButton" class="danger" type="button">선택 매장 비밀번호 초기화</button>
        <div class="help">초기화 즉시 기존 매장 비밀번호는 사용할 수 없습니다.</div>
      </div>

      <div id="messageBox" class="message" aria-live="polite"></div>

      <button id="logoutButton" class="secondary" type="button">로그아웃</button>
    </section>
  </main>

  <script>
    (function(){
      "use strict";

      const SUPABASE_URL="https://dcysjuxyjqtvkihdsjvv.supabase.co";
      const SUPABASE_KEY="sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2";
      const FUNCTION_URL=SUPABASE_URL+"/functions/v1/hq-admin-account";
      const SESSION_KEY="wooriapt_hq_admin_session";
      const ADMIN_ID_KEY="wooriapt_hq_admin_id";

      const loadingPanel=document.getElementById("loadingPanel");
      const mainPanel=document.getElementById("mainPanel");
      const adminId=document.getElementById("adminId");
      const storeSelect=document.getElementById("storeSelect");
      const selectedStoreId=document.getElementById("selectedStoreId");
      const messageBox=document.getElementById("messageBox");
      const changeHqButton=document.getElementById("changeHqButton");
      const resetStoreButton=document.getElementById("resetStoreButton");
      const logoutButton=document.getElementById("logoutButton");

      function showMessage(text,type){
        messageBox.textContent=text||"";
        messageBox.className="message"+(type?" "+type:"");
      }

      function setBusy(busy){
        changeHqButton.disabled=busy;
        resetStoreButton.disabled=busy;
        logoutButton.disabled=busy;
        storeSelect.disabled=busy;
      }

      function clearSession(){
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(ADMIN_ID_KEY);
      }

      async function callApi(action,payload){
        const response=await fetch(FUNCTION_URL,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(Object.assign({action:action},payload||{}))
        });

        const text=await response.text();
        let data={};

        try{
          data=text?JSON.parse(text):{};
        }catch(error){
          data={};
        }

        if(!response.ok||data.ok===false){
          throw new Error(data.message||data.error||"처리에 실패했습니다.");
        }

        return data;
      }

      async function validateSession(){
        const token=localStorage.getItem(SESSION_KEY)||"";

        if(!token){
          location.replace("/hq-account.html");
          return false;
        }

        try{
          const data=await callApi("validate_session",{session_token:token});
          adminId.textContent=data.admin_id||"admin";
          localStorage.setItem(ADMIN_ID_KEY,data.admin_id||"admin");
          return true;
        }catch(error){
          clearSession();
          location.replace("/hq-account.html");
          return false;
        }
      }

      async function loadStores(){
        const response=await fetch(
          SUPABASE_URL+
          "/rest/v1/store_accounts?role=eq.store&select=store_id,store_name&order=store_name.asc,store_id.asc",
          {
            headers:{
              apikey:SUPABASE_KEY,
              Authorization:"Bearer "+SUPABASE_KEY
            }
          }
        );

        if(!response.ok){
          throw new Error(await response.text());
        }

        const rows=await response.json();

        storeSelect.innerHTML='<option value="">매장을 선택하세요</option>';

        rows.forEach(function(row){
          const option=document.createElement("option");
          option.value=row.store_id;
          option.textContent=(row.store_name||row.store_id)+" / "+row.store_id;
          storeSelect.appendChild(option);
        });
      }

      storeSelect.addEventListener("change",function(){
        selectedStoreId.value=storeSelect.value||"";
      });

      changeHqButton.addEventListener("click",async function(){
        const current=document.getElementById("currentPassword").value;
        const next=document.getElementById("newPassword").value;
        const confirm=document.getElementById("confirmPassword").value;

        if(!current||!next||!confirm){
          showMessage("비밀번호 입력란을 모두 작성해 주세요.","error");
          return;
        }

        if(next!==confirm){
          showMessage("새 비밀번호와 확인 비밀번호가 일치하지 않습니다.","error");
          return;
        }

        if(next.length<8||!/[A-Za-z]/.test(next)||!/[0-9]/.test(next)){
          showMessage("새 비밀번호는 영문과 숫자를 포함해 8자 이상이어야 합니다.","error");
          return;
        }

        try{
          setBusy(true);
          showMessage("본사 비밀번호를 변경하고 있습니다.","waiting");

          const data=await callApi("change_password",{
            session_token:localStorage.getItem(SESSION_KEY)||"",
            current_password:current,
            new_password:next
          });

          localStorage.setItem(SESSION_KEY,data.session_token);
          localStorage.setItem(ADMIN_ID_KEY,data.admin_id||"admin");

          document.getElementById("currentPassword").value="";
          document.getElementById("newPassword").value="";
          document.getElementById("confirmPassword").value="";

          showMessage("본사 비밀번호가 변경되었습니다.","success");
        }catch(error){
          showMessage(error.message,"error");
        }finally{
          setBusy(false);
        }
      });

      resetStoreButton.addEventListener("click",async function(){
        const storeId=storeSelect.value;
        const password=document.getElementById("tempPassword").value;
        const confirm=document.getElementById("tempPasswordConfirm").value;

        if(!storeId){
          showMessage("비밀번호를 초기화할 매장을 선택해 주세요.","error");
          return;
        }

        if(!password||!confirm){
          showMessage("새 임시 비밀번호를 두 번 입력해 주세요.","error");
          return;
        }

        if(password!==confirm){
          showMessage("임시 비밀번호와 확인 비밀번호가 일치하지 않습니다.","error");
          return;
        }

        if(password.length<8||!/[A-Za-z]/.test(password)||!/[0-9]/.test(password)){
          showMessage("임시 비밀번호는 영문과 숫자를 포함해 8자 이상이어야 합니다.","error");
          return;
        }

        if(!confirm("선택한 매장의 기존 비밀번호를 즉시 초기화하시겠습니까?")){
          return;
        }

        try{
          setBusy(true);
          showMessage("매장 비밀번호를 초기화하고 있습니다.","waiting");

          await callApi("reset_store_password",{
            session_token:localStorage.getItem(SESSION_KEY)||"",
            store_id:storeId,
            new_password:password
          });

          document.getElementById("tempPassword").value="";
          document.getElementById("tempPasswordConfirm").value="";

          showMessage(
            storeId+" 매장의 비밀번호가 초기화되었습니다. 새 임시 비밀번호를 매장에 전달하세요.",
            "success"
          );
        }catch(error){
          showMessage(error.message,"error");
        }finally{
          setBusy(false);
        }
      });

      logoutButton.addEventListener("click",async function(){
        try{
          setBusy(true);
          await callApi("logout",{
            session_token:localStorage.getItem(SESSION_KEY)||""
          });
        }catch(error){
          console.warn(error);
        }finally{
          clearSession();
          location.replace("/hq-account.html");
        }
      });

      async function start(){
        try{
          const valid=await validateSession();
          if(!valid)return;

          await loadStores();

          loadingPanel.style.display="none";
          mainPanel.style.display="block";
        }catch(error){
          loadingPanel.innerHTML=
            '<div class="loading" style="color:#a02020">초기화 실패: '+
            String(error.message||error)+
            "</div>";
        }
      }

      start();
    })();
  </script>
</body>
</html>
