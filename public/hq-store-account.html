<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>
<meta name="theme-color" content="#15803d">

<title>가맹점 승인 | 본사 관리자</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;
  padding:22px 14px 40px;
  background:#f4f7f5;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

.wrap{
  width:100%;
  max-width:850px;
  margin:0 auto;
}

.back-button{
  min-height:42px;
  margin-bottom:14px;
  padding:0 15px;
  border:0;
  border-radius:8px;
  background:#374151;
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.header{
  margin-bottom:16px;
  padding:22px 20px;
  border-radius:16px;
  background:linear-gradient(
    135deg,
    #166534,
    #15803d
  );
  color:#fff;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:7px 0 0;
  color:rgba(255,255,255,.86);
  font-size:14px;
}

.card{
  padding:18px;
  border:1px solid #dde5df;
  border-radius:14px;
  background:#fff;
}

.search{
  width:100%;
  height:46px;
  margin-bottom:14px;
  padding:0 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

.search:focus{
  border-color:#15803d;
  box-shadow:0 0 0 3px rgba(21,128,61,.08);
}

.count{
  margin:0 0 12px;
  color:#64748b;
  font-size:14px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:14px;
}

th{
  background:#f8fafc;
  color:#475569;
}

.status{
  font-weight:700;
}

.pending{
  color:#d97706;
}

.active{
  color:#15803d;
}

.approve-button{
  min-width:72px;
  min-height:38px;
  border:0;
  border-radius:7px;
  background:#15803d;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.approve-button:disabled{
  opacity:.5;
  cursor:default;
}

.message{
  margin-top:14px;
  font-size:14px;
  font-weight:700;
}

.error{
  color:#dc2626;
}

.success{
  color:#15803d;
}

@media(max-width:600px){
  body{
    padding:14px 10px 30px;
  }

  .header{
    padding:20px 17px;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <button
    id="backButton"
    class="back-button"
    type="button"
  >
    ← 본사 관리자
  </button>


  <header class="header">
    <h1>가맹점 승인</h1>
    <p>
      승인대기 가맹점을 확인하고 승인합니다.
    </p>
  </header>


  <section class="card">

    <input
      id="search"
      class="search"
      placeholder="마트번호 · 마트명 검색"
    >

    <p
      id="count"
      class="count"
    >
      불러오는 중...
    </p>


    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>마트번호</th>
            <th>마트명</th>
            <th>상태</th>
            <th>처리</th>
          </tr>
        </thead>

        <tbody id="storeTable"></tbody>

      </table>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>

</main>


<script>
(function(){

"use strict";


const FUNCTION_URL =
  "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/hq-store-account";

const SESSION_KEY =
  "wooriapt_hq_admin_session";

const LOGIN_PAGE =
  "/hq-account.html";

const DASHBOARD_PAGE =
  "/hq-dashboard.html";


let stores = [];


const searchInput =
  document.getElementById(
    "search"
  );

const storeTable =
  document.getElementById(
    "storeTable"
  );

const count =
  document.getElementById(
    "count"
  );

const messageBox =
  document.getElementById(
    "message"
  );


function session(){

  return (
    localStorage.getItem(
      SESSION_KEY
    ) || ""
  );

}


function showMessage(
  text,
  error
){

  messageBox.textContent =
    text || "";

  messageBox.className =
    "message " +
    (
      error
        ? "error"
        : "success"
    );

}


function escapeHtml(
  value
){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value == null
      ? ""
      : String(value);

  return div.innerHTML;

}


async function api(
  action,
  data
){

  const body =
    Object.assign(
      {},
      data || {},
      {
        action:
          action,

        session_token:
          session()
      }
    );


  const response =
    await fetch(
      FUNCTION_URL,
      {
        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            body
          )
      }
    );


  const text =
    await response.text();

  let result = {};


  try{

    result =
      text
        ? JSON.parse(text)
        : {};

  }catch(error){

    result = {};

  }


  if(
    !response.ok ||
    result.ok === false
  ){

    throw new Error(
      result.message ||
      "처리에 실패했습니다."
    );

  }


  return result;

}


async function loadStores(){

  try{

    const result =
      await api(
        "list_stores",
        {}
      );


    stores =
      result.stores || [];


    renderStores();


  }catch(error){

    count.textContent =
      "목록을 불러오지 못했습니다.";

    showMessage(
      error.message,
      true
    );

  }

}


function renderStores(){

  const keyword =
    searchInput
      .value
      .trim()
      .toLowerCase();


  const list =
    stores.filter(
      function(store){

        return [
          store.store_id,
          store.store_name
        ]
        .join(" ")
        .toLowerCase()
        .includes(
          keyword
        );

      }
    );


  count.textContent =
    "총 " +
    list.length +
    "개 가맹점";


  storeTable.innerHTML =
    "";


  list.forEach(
    function(store){

      const tr =
        document.createElement(
          "tr"
        );


      const pending =
        store.account_status ===
        "pending";


      const statusText =
        pending
          ? "승인대기"
          : "승인완료";


      const statusClass =
        pending
          ? "pending"
          : "active";


      tr.innerHTML =
        "<td>" +
        escapeHtml(
          store.store_id
        ) +
        "</td>" +

        "<td>" +
        escapeHtml(
          store.store_name
        ) +
        "</td>" +

        '<td class="status ' +
        statusClass +
        '">' +
        statusText +
        "</td>" +

        "<td></td>";


      const actionCell =
        tr.children[3];


      if(
        pending
      ){

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";

        button.className =
          "approve-button";

        button.textContent =
          "승인";


        button.addEventListener(
          "click",
          async function(){

            if(
              !confirm(
                (
                  store.store_name ||
                  store.store_id
                ) +
                " 가맹점을 승인하시겠습니까?"
              )
            ){

              return;

            }


            try{

              button.disabled =
                true;


              const result =
                await api(
                  "activate_store",
                  {
                    store_id:
                      store.store_id
                  }
                );


              showMessage(
                result.message ||
                "승인되었습니다.",
                false
              );


              await loadStores();


            }catch(error){

              button.disabled =
                false;

              showMessage(
                error.message,
                true
              );

            }

          }
        );


        actionCell.appendChild(
          button
        );

      }else{

        actionCell.textContent =
          "승인완료";

      }


      storeTable.appendChild(
        tr
      );

    }
  );

}


searchInput.addEventListener(
  "input",
  renderStores
);


document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    function(){

      location.href =
        DASHBOARD_PAGE;

    }
  );


if(
  !session()
){

  location.replace(
    LOGIN_PAGE
  );

}else{

  loadStores();

}


})();
</script>

</body>
</html>
