<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#16a34a">

<link
  id="manifestLink"
  rel="manifest"
  href="/mart-manifest.webmanifest"
>

<link rel="icon" href="/icon-192.png">

<title>우리가게 앱 설치</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;
  padding:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f4f7fb;
  color:#111827;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    Roboto,
    Arial,
    sans-serif;
}

.card{
  display:none;

  width:100%;
  max-width:430px;

  padding:28px 22px;

  border-radius:18px;

  background:#ffffff;

  box-shadow:
    0 10px 35px
    rgba(15,23,42,.10);

  text-align:center;
}

.card.active{
  display:block;
}

.logo{
  width:92px;
  height:92px;

  margin:0 auto 16px;

  border-radius:22px;

  object-fit:cover;

  box-shadow:
    0 8px 22px
    rgba(15,23,42,.14);
}

h1{
  margin:0 0 12px;

  font-size:25px;
  line-height:1.4;
}

p{
  margin:0;

  color:#64748b;

  font-size:15px;
  line-height:1.75;

  word-break:keep-all;
}

.guide{
  margin:18px 0;

  padding:17px 15px;

  border-radius:12px;

  background:#f8fafc;
  color:#334155;

  font-size:15px;
  line-height:1.75;

  word-break:keep-all;
}

.guide strong{
  color:#166534;
}

button{
  width:100%;
  min-height:54px;

  padding:13px 16px;

  border:0;
  border-radius:11px;

  background:#16a34a;
  color:#ffffff;

  font-size:17px;
  font-weight:800;

  cursor:pointer;
}

button:disabled{
  background:#cbd5e1;
  color:#64748b;

  cursor:not-allowed;
}

.secondary{
  margin-top:10px;

  background:#475569;
}

.status{
  min-height:24px;

  margin-top:15px;

  font-size:14px;
  font-weight:700;
  line-height:1.6;

  word-break:keep-all;
}

.success{
  color:#15803d;
}

.error{
  color:#dc2626;
}

.waiting{
  color:#1d4ed8;
}

.iphone-steps{
  margin:18px 0;

  padding:18px 15px;

  border-radius:14px;

  background:#f8fafc;
  color:#334155;

  text-align:left;

  font-size:15px;
  line-height:1.8;
}

.iphone-steps b{
  color:#111827;
}

.share-symbol{
  display:flex;

  width:56px;
  height:56px;

  margin:12px auto;

  align-items:center;
  justify-content:center;

  border:2px solid #94a3b8;
  border-radius:13px;

  background:#ffffff;

  font-size:31px;
}

.done-box{
  margin-top:18px;

  padding:15px;

  border-radius:12px;

  background:#ecfdf5;
  color:#166534;

  font-size:15px;
  font-weight:800;
  line-height:1.7;
}

.qr-box{
  margin:14px 0;

  padding:11px 12px;

  border:1px solid #bbf7d0;
  border-radius:10px;

  background:#f0fdf4;

  color:#166534;

  font-size:13px;
  line-height:1.6;

  word-break:break-all;
}
</style>
</head>


<body>

     로딩
===================================================== -->

<section
  id="loadingCard"
  class="card active"
>

  <img
    class="logo"
    src="/icon-192.png"
    alt="우리가게"
  >

  <h1 id="loadingTitle">
    우리가
