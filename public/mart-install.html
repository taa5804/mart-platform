<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#16a34a">

<link
  rel="manifest"
  href="/mart-manifest.webmanifest"
>

<title>우리가게 알림 등록</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f4f7fb;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

.card{
  display:none;
  width:100%;
  max-width:420px;
  padding:28px 22px;
  background:#ffffff;
  border-radius:18px;
  text-align:center;
  box-shadow:0 10px 35px rgba(15,23,42,.1);
}

.card.active{
  display:block;
}

h1{
  margin:0 0 14px;
  font-size:24px;
}

p,
.guide{
  color:#64748b;
  line-height:1.7;
}

input{
  width:100%;
  height:54px;
  margin:10px 0;
  border:1px solid #cbd5e1;
  border-radius:11px;
  font-size:17px;
  text-align:center;
}

button{
  width:100%;
  min-height:54px;
  margin-top:10px;
  border:0;
  border-radius:11px;
  background:#16a34a;
  color:#ffffff;
  font-size:17px;
  font-weight:800;
}

button:disabled{
  background:#cbd5e1;
  color:#64748b;
}

.status{
  margin-top:14px;
  font-weight:700;
  line-height:1.6;
  white-space:pre-line;
}

.error{
  color:#dc2626;
}

.waiting{
  color:#1d4ed8;
}

.success{
  color:#15803d;
}
</style>
</head>

<body>

<section id="registerCard" class="card">
  <h1>우리가게 알림 등록</h1>

  <p>
    마트 행사와 할인 알림을 받을<br>
    휴대전화번호를 입력해 주세요.
  </p>

  <input
    id="phone"
    type="tel"
    inputmode="numeric"
    maxlength="13"
    placeholder="010-0000-0000"
  >

  <button id="registerBtn" type="button">
    등록하기
  </button>

  <div
    id="registerStatus"
    class="status"
  ></div>
</section>


<section id="installCard" class="card">
  <h1>우리가게 앱 설치</h1>

  <div class="guide">
    휴대전화에 표시되는 설치창에서<br>
    설치를 눌러 주세요.
  </div>

  <div class="status waiting">
    앱 설치를 진행해 주세요.
  </div>
</section>


<section id="pushCard" class="card">
  <h1>푸시 알림 승인</h1>

  <div class="guide">
    마트 행사와 할인 알림을 받기 위해<br>
    푸시 알림을 허용해 주세요.
  </div>

  <button
    id="pushBtn"
    type="button"
    disabled
  >
    푸시 알림 허용
  </button>

  <div
    id="pushStatus"
    class="status"
  ></div>
</section>


<section id="completeCard" class="card">
  <h1>등록 완료</h1>

  <p>
    우리가게 앱 설치와<br>
    알림 등록이 완료되었습니다.
  </p>

  <div class="status success">
    해당 마트 플랫폼으로 이동합니다.
  </div>
</section>


<section id="errorCard" class="card">
  <h1>등록할 수 없습니다</h1>
  <p id="errorText"></p>
</section>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<script>
"use strict";


/*
 * 서버 설정
 */

const API_URL =
  "https://dcysjuxyjqtvkihdsjvv.supabase.co/functions/v1/register-mart-push";

const SUPABASE_KEY =
  "sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2";

const VAPID_KEY =
  "BDtVeUPEh-pooMUUtj4Bd2f5x7EHuWyx4TeunbaQvR8WQs65qwNxryhhORYoS5mxxWMn0GogdgDs1Qod93Vj0jM";

const STORE_ID_KEY =
  "wooriapt_store_id";

const SIGN_QR_KEY =
  "wooriapt_sign_qr";

const SIGN_PHONE_KEY =
  "wooriapt_sign_phone";


/*
 * Firebase 설정
 */

const FIREBASE_CONFIG = {
  apiKey:
    "AIzaSyB3nZdmUrj2wsKPQpOV8dlso7iI7fZo0Hc",

  authDomain:
    "wooriapt-carqr.firebaseapp.com",

  projectId:
    "wooriapt-carqr",

  storageBucket:
    "wooriapt-carqr.firebasestorage.app",

  messagingSenderId:
    "101299637796",

  appId:
    "1:101299637796:web:cb69372592026b7aa192b1",

  measurementId:
    "G-11E955VBX3"
};


/*
 * 입간판 QR 번호
 */

const params =
  new URLSearchParams(
    window.location.search
  );

const urlQrCode =
  cleanQr(
    params.get("qr")
  );

let qrCode =
  urlQrCode ||
  cleanQr(
    localStorage.getItem(
      SIGN_QR_KEY
    )
  );


/*
 * 화면
 */

const registerCard =
  document.getElementById(
    "registerCard"
  );

const installCard =
  document.getElementById(
    "installCard"
  );

const pushCard =
  document.getElementById(
    "pushCard"
  );

const completeCard =
  document.getElementById(
    "completeCard"
  );

const errorCard =
  document.getElementById(
    "errorCard"
  );

const phoneInput =
  document.getElementById(
    "phone"
  );

const registerBtn =
  document.getElementById(
    "registerBtn"
  );

const pushBtn =
  document.getElementById(
    "pushBtn"
  );

const registerStatus =
  document.getElementById(
    "registerStatus"
  );

const pushStatus =
  document.getElementById(
    "pushStatus"
  );

const errorText =
  document.getElementById(
    "errorText"
  );

const cards = [
  registerCard,
  installCard,
  pushCard,
  completeCard,
  errorCard
];


/*
 * 필요한 상태
 */

let customerPhone =
  normalizePhone(
    localStorage.getItem(
      SIGN_PHONE_KEY
    )
  );

let installPrompt = null;
let appInstalled = false;
let processing = false;
let serviceWorkerRegistration = null;


/*
 * 화면 표시
 */

function showCard(card) {
  cards.forEach(
    function (item) {
      item.classList.remove(
        "active"
      );
    }
  );

  card.classList.add(
    "active"
  );

  window.scrollTo(
    0,
    0
  );
}


function setStatus(
  element,
  message,
  type
) {
  element.textContent =
    message || "";

  element.className =
    type
      ? "status " + type
      : "status";
}


function showError(message) {
  errorText.textContent =
    message ||
    "등록 처리에 실패했습니다.";

  showCard(
    errorCard
  );
}


/*
 * QR 번호
 */

function cleanQr(value) {
  return String(
    value || ""
  )
    .trim()
    .toUpperCase()
    .replace(
      /[^A-Z0-9_-]/g,
      ""
    );
}


/*
 * 전화번호
 */

function normalizePhone(value) {
  return String(
    value || ""
  ).replace(
    /[^0-9]/g,
    ""
  );
}


function validPhone(value) {
  return /^01[016789][0-9]{7,8}$/
    .test(value);
}


function formatPhone(value) {
  const number =
    normalizePhone(value)
      .slice(0, 11);

  if (number.length <= 3) {
    return number;
  }

  if (number.length <= 7) {
    return (
      number.slice(0, 3) +
      "-" +
      number.slice(3)
    );
  }

  return (
    number.slice(0, 3) +
    "-" +
    number.slice(3, 7) +
    "-" +
    number.slice(7)
  );
}


/*
 * 서비스워커
 */

async function prepareServiceWorker() {
  if (serviceWorkerRegistration) {
    return serviceWorkerRegistration;
  }

  if (
    !("serviceWorker" in navigator)
  ) {
    throw new Error(
      "이 브라우저에서는 앱 설치를 지원하지 않습니다."
    );
  }

  await navigator.serviceWorker.register(
    "/firebase-messaging-sw.js",
    {
      scope:"/",
      updateViaCache:"none"
    }
  );

  serviceWorkerRegistration =
    await navigator.serviceWorker.ready;

  return serviceWorkerRegistration;
}


/*
 * 입간판 고객 등록
 */

async function registerSignCustomer(
  token
) {
  const response =
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          Authorization:
            "Bearer " +
            SUPABASE_KEY,

          apikey:
            SUPABASE_KEY
        },

        body:
          JSON.stringify({
            action:
              "register",

            registration_type:
              "sign",

            qr_code:
              qrCode,

            phone:
              customerPhone,

            push_token:
              token,

            platform:
              "android",

            user_agent:
              navigator.userAgent
          })
      }
    );

  const data =
    await response
      .json()
      .catch(
        function () {
          return {};
        }
      );

  if (
    !response.ok ||
    data.ok === false ||
    data.success === false
  ) {
    throw new Error(
      data.message ||
      data.error ||
      "입간판 QR 등록에 실패했습니다."
    );
  }

  return data;
}


/*
 * 앱 설치창 준비
 */

window.addEventListener(
  "beforeinstallprompt",
  function (event) {
    event.preventDefault();

    installPrompt =
      event;
  }
);


/*
 * 실제 설치가 끝난 후에만
 * 푸시 화면 표시
 */

window.addEventListener(
  "appinstalled",
  function () {
    appInstalled =
      true;

    installPrompt =
      null;

    qrCode =
      cleanQr(
        localStorage.getItem(
          SIGN_QR_KEY
        )
      );

    customerPhone =
      normalizePhone(
        localStorage.getItem(
          SIGN_PHONE_KEY
        )
      );

    if (
      !qrCode ||
      !validPhone(customerPhone)
    ) {
      showError(
        "입간판 등록정보를 확인할 수 없습니다."
      );

      return;
    }

    setTimeout(
      function () {
        showCard(
          pushCard
        );

        pushBtn.disabled =
          false;

        pushBtn.textContent =
          "푸시 알림 허용";

        setStatus(
          pushStatus,
          "",
          ""
        );
      },
      2000
    );
  }
);


/*
 * 전화번호 자동 표시
 */

phoneInput.addEventListener(
  "input",
  function (event) {
    event.target.value =
      formatPhone(
        event.target.value
      );
  }
);


/*
 * 전화번호 저장 후 앱 설치
 */

registerBtn.addEventListener(
  "click",
  async function () {
    customerPhone =
      normalizePhone(
        phoneInput.value
      );

    if (
      !validPhone(customerPhone)
    ) {
      setStatus(
        registerStatus,
        "휴대전화번호를 정확히 입력해 주세요.",
        "error"
      );

      phoneInput.focus();

      return;
    }

    if (!qrCode) {
      setStatus(
        registerStatus,
        "입간판 QR 정보를 확인할 수 없습니다.",
        "error"
      );

      return;
    }

    if (!installPrompt) {
      setStatus(
        registerStatus,
        "앱 설치 준비 중입니다. 잠시 후 다시 눌러 주세요.",
        "waiting"
      );

      return;
    }

    localStorage.setItem(
      SIGN_QR_KEY,
      qrCode
    );

    localStorage.setItem(
      SIGN_PHONE_KEY,
      customerPhone
    );

    const currentPrompt =
      installPrompt;

    registerBtn.disabled =
      true;

    showCard(
      installCard
    );

    try {
      await currentPrompt.prompt();

      const choice =
        await currentPrompt.userChoice;

      installPrompt =
        null;

      if (
        choice.outcome !==
        "accepted"
      ) {
        registerBtn.disabled =
          false;

        showCard(
          registerCard
        );

        setStatus(
          registerStatus,
          "앱을 설치해 주세요.",
          "error"
        );
      }

    } catch (error) {
      registerBtn.disabled =
        false;

      showCard(
        registerCard
      );

      setStatus(
        registerStatus,
        error instanceof Error
          ? error.message
          : "앱 설치에 실패했습니다.",
        "error"
      );
    }
  }
);


/*
 * 푸시 허용 후 고객 등록
 */

pushBtn.addEventListener(
  "click",
  async function () {
    if (processing) {
      return;
    }

    if (!appInstalled) {
      return;
    }

    qrCode =
      cleanQr(
        localStorage.getItem(
          SIGN_QR_KEY
        )
      );

    customerPhone =
      normalizePhone(
        localStorage.getItem(
          SIGN_PHONE_KEY
        )
      );

    if (!qrCode) {
      setStatus(
        pushStatus,
        "입간판 QR 정보를 확인할 수 없습니다.",
        "error"
      );

      return;
    }

    if (!validPhone(customerPhone)) {
      setStatus(
        pushStatus,
        "휴대전화번호를 정확히 입력해 주세요.",
        "error"
      );

      return;
    }

    processing =
      true;

    pushBtn.disabled =
      true;

    pushBtn.textContent =
      "등록 중...";

    setStatus(
      pushStatus,
      "",
      ""
    );

    try {
      if (
        !("Notification" in window)
      ) {
        throw new Error(
          "이 기기에서는 알림을 지원하지 않습니다."
        );
      }

      if (
        Notification.permission ===
        "denied"
      ) {
        throw new Error(
          "알림 권한이 차단되어 있습니다."
        );
      }

      if (
        Notification.permission !==
        "granted"
      ) {
        const permission =
          await Notification.requestPermission();

        if (
          permission !==
          "granted"
        ) {
          throw new Error(
            "푸시 알림을 허용해 주세요."
          );
        }
      }

      if (
        !firebase.apps.length
      ) {
        firebase.initializeApp(
          FIREBASE_CONFIG
        );
      }

      const registration =
        await prepareServiceWorker();

      const messaging =
        firebase.messaging();

      const token =
        await messaging.getToken({
          vapidKey:
            VAPID_KEY,

          serviceWorkerRegistration:
            registration
        });

      if (!token) {
        throw new Error(
          "푸시 토큰을 발급하지 못했습니다."
        );
      }

      const result =
        await registerSignCustomer(
          token
        );

      const storeId =
        String(
          result.store_id || ""
        ).trim();

      if (storeId) {
        localStorage.setItem(
          STORE_ID_KEY,
          storeId
        );
      } else {
        localStorage.removeItem(
          STORE_ID_KEY
        );
      }

      localStorage.removeItem(
        SIGN_QR_KEY
      );

      localStorage.removeItem(
        SIGN_PHONE_KEY
      );

      processing =
        false;

      showCard(
        completeCard
      );

      setTimeout(
        function () {
          window.location.replace(
            "/mart-open.html"
          );
        },
        1200
      );

    } catch (error) {
      processing =
        false;

      pushBtn.disabled =
        false;

      pushBtn.textContent =
        "푸시 알림 허용";

      setStatus(
        pushStatus,
        error instanceof Error
          ? error.message
          : "입간판 QR 등록에 실패했습니다.",
        "error"
      );
    }
  }
);


/*
 * 처음 시작
 */

(async function start() {
  if (urlQrCode) {
    qrCode =
      urlQrCode;

    localStorage.setItem(
      SIGN_QR_KEY,
      qrCode
    );
  }

  if (!qrCode) {
    showError(
      "올바른 입간판 QR 주소가 아닙니다."
    );

    return;
  }

  if (validPhone(customerPhone)) {
    phoneInput.value =
      formatPhone(customerPhone);
  }

  showCard(
    registerCard
  );

  try {
    await prepareServiceWorker();

  } catch (error) {
    console.warn(
      "서비스워커 준비 실패:",
      error
    );
  }
})();
</script>

</body>
</html>
