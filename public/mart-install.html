<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#16a34a">
  <title>우리가게</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f4f7fb;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #ffffff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.1);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: #64748b;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1 id="title">우리가게 연결 중</h1>
    <p id="message">등록된 마트로 이동하고 있습니다.</p>
  </main>

  <script>
    (function () {
      "use strict";

      const STORE_ID_KEY =
        "wooriapt_store_id";

      const STORE_PATH_KEY =
        "wooriapt_store_path";

      const STORE_URL_KEY =
        "wooriapt_store_url";

      const title =
        document.getElementById("title");

      const message =
        document.getElementById("message");

      const params =
        new URLSearchParams(window.location.search);

      const queryStore = String(
        params.get("store") ||
        params.get("store_id") ||
        params.get("path") ||
        ""
      ).trim();

      if (queryStore) {
        localStorage.setItem(
          STORE_ID_KEY,
          queryStore
        );
      }

      const saved = String(
        localStorage.getItem(STORE_URL_KEY) ||
        localStorage.getItem(STORE_PATH_KEY) ||
        localStorage.getItem(STORE_ID_KEY) ||
        queryStore ||
        ""
      ).trim();

      if (!saved) {
        title.textContent =
          "마트 정보를 확인할 수 없습니다";

        message.textContent =
          "입간판 QR을 다시 스캔해 주세요.";

        return;
      }

      const target =
        /^https?:\/\//i.test(saved)
          ? saved
          : "https://wooriapt.ai.kr/" +
            saved.replace(/^\/+/, "");

      window.location.replace(target);
    })();
  </script>
</body>
</html>
